syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewReportingServiceProto";
option java_package = "com.acme.recruiting.v1";

// Builds and schedules reports about interviews.
service InterviewReportingService {
  // Generates an interview.
  rpc GenerateInterviewReport(GenerateInterviewReportRequest) returns (GenerateInterviewReportResponse);

  // Returns an interview.
  rpc FetchInterviewReport(FetchInterviewReportRequest) returns (FetchInterviewReportResponse);

  // Schedules an interview.
  rpc ScheduleInterviewReport(ScheduleInterviewReportRequest) returns (ScheduleInterviewReportResponse);

  // Streams the changes of interviews as they happen.
  rpc StreamInterviewMetrics(StreamInterviewMetricsRequest) returns (stream StreamInterviewMetricsResponse);

  // Lists interviews a page at a time.
  rpc ListInterviewReports(ListInterviewReportsRequest) returns (ListInterviewReportsResponse);

  // Shares an interview.
  rpc ShareInterviewReport(ShareInterviewReportRequest) returns (ShareInterviewReportResponse);

  // Deletes an interview.
  rpc DeleteInterviewReport(DeleteInterviewReportRequest) returns (DeleteInterviewReportResponse);
}

// The request of `GenerateInterviewReport`.
message GenerateInterviewReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  GenerateInterviewReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateInterviewReport`.
message GenerateInterviewReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchInterviewReport`.
message FetchInterviewReportRequest {
  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchInterviewReport`.
message FetchInterviewReportResponse {
  Interview interview = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleInterviewReport`.
message ScheduleInterviewReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  ScheduleInterviewReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleInterviewReport`.
message ScheduleInterviewReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamInterviewMetrics`.
message StreamInterviewMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InterviewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamInterviewMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamInterviewMetrics`.
message StreamInterviewMetricsResponse {
  Interview interview = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListInterviewReports`.
message ListInterviewReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InterviewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListInterviewReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListInterviewReports`.
message ListInterviewReportsResponse {
  repeated Interview interviews = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareInterviewReport`.
message ShareInterviewReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  ShareInterviewReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareInterviewReport`.
message ShareInterviewReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interview interview = 1;
  ShareInterviewReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteInterviewReport`.
message DeleteInterviewReportRequest {
  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteInterviewReport`.
message DeleteInterviewReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
