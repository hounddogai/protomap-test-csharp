syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewSyncServiceProto";
option java_package = "com.acme.recruiting.v1";

// Keeps interviews in step with the systems of record in other regions.
service InterviewSyncService {
  // Syncs an interview.
  rpc SyncInterviews(SyncInterviewsRequest) returns (SyncInterviewsResponse);

  // Pushs an interview.
  rpc PushInterview(PushInterviewRequest) returns (PushInterviewResponse);

  // Pulls an interview.
  rpc PullInterviews(PullInterviewsRequest) returns (PullInterviewsResponse);

  // Reconciles an interview.
  rpc ReconcileInterviews(ReconcileInterviewsRequest) returns (ReconcileInterviewsResponse);

  // Exchanges changes of interviews with a peer.
  rpc StreamInterviewChanges(stream StreamInterviewChangesRequest) returns (stream StreamInterviewChangesResponse);

  // Resolves an interview.
  rpc ResolveInterviewConflict(ResolveInterviewConflictRequest) returns (ResolveInterviewConflictResponse);

  // Returns an interview.
  rpc GetInterviewSyncState(GetInterviewSyncStateRequest) returns (GetInterviewSyncStateResponse);

  // Lists interviews a page at a time.
  rpc ListInterviewConflicts(ListInterviewConflictsRequest) returns (ListInterviewConflictsResponse);
}

// The request of `SyncInterviews`.
message SyncInterviewsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  Interview interview = 3;
  SyncInterviewsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncInterviews`.
message SyncInterviewsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interview interview = 1;
  SyncInterviewsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

