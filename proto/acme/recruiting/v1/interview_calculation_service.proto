syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewCalculationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Computes the figures of an interview, such as totals, taxes, and estimates.
service InterviewCalculationService {
  // Calculates an interview.
  rpc CalculateInterview(CalculateInterviewRequest) returns (CalculateInterviewResponse);

  // Estimates an interview.
  rpc EstimateInterview(EstimateInterviewRequest) returns (EstimateInterviewResponse);

  // Compares an interview.
  rpc CompareInterviewOptions(CompareInterviewOptionsRequest) returns (CompareInterviewOptionsResponse);

  // Recalculates an interview.
  rpc RecalculateInterviews(RecalculateInterviewsRequest) returns (RecalculateInterviewsResponse);

  // Simulates an interview.
  rpc SimulateInterview(SimulateInterviewRequest) returns (SimulateInterviewResponse);

  // Explains an interview.
  rpc ExplainInterviewCalculation(ExplainInterviewCalculationRequest) returns (ExplainInterviewCalculationResponse);

  // Returns an interview.
  rpc GetInterviewRates(GetInterviewRatesRequest) returns (GetInterviewRatesResponse);
}

// The request of `CalculateInterview`.
message CalculateInterviewRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  Interview interview = 3;
  CalculateInterviewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateInterview`.
message CalculateInterviewResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateInterviewResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Interview interview = 1;
  CalculateInterviewResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

