syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewLifecycleServiceProto";
option java_package = "com.acme.recruiting.v1";

// Moves an interview between the states of its lifecycle.
service InterviewLifecycleService {
  // Activates an interview.
  rpc ActivateInterview(ActivateInterviewRequest) returns (ActivateInterviewResponse);

  // Suspends an interview.
  rpc SuspendInterview(SuspendInterviewRequest) returns (SuspendInterviewResponse);

  // Terminates an interview.
  rpc TerminateInterview(TerminateInterviewRequest) returns (TerminateInterviewResponse);

  // Renews an interview.
  rpc RenewInterview(RenewInterviewRequest) returns (RenewInterviewResponse);

  // Expires an interview.
  rpc ExpireInterview(ExpireInterviewRequest) returns (ExpireInterviewResponse);

  // Returns an interview.
  rpc GetInterviewLifecycle(GetInterviewLifecycleRequest) returns (GetInterviewLifecycleResponse);

  // Schedules an interview.
  rpc ScheduleInterviewExpiry(ScheduleInterviewExpiryRequest) returns (ScheduleInterviewExpiryResponse);
}

// The request of `ActivateInterview`.
message ActivateInterviewRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  ActivateInterviewRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateInterview`.
message ActivateInterviewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interview interview = 1;
  ActivateInterviewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

