syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "JobOpeningApprovalServiceProto";
option java_package = "com.acme.recruiting.v1";

// Routes job openings through approval, with escalation and delegation.
service JobOpeningApprovalService {
  // Submits a job opening.
  rpc SubmitJobOpening(SubmitJobOpeningRequest) returns (SubmitJobOpeningResponse);

  // Approves a job opening.
  rpc ApproveJobOpening(ApproveJobOpeningRequest) returns (ApproveJobOpeningResponse);

  // Rejects a job opening.
  rpc RejectJobOpening(RejectJobOpeningRequest) returns (RejectJobOpeningResponse);

  // Escalates a job opening.
  rpc EscalateJobOpening(EscalateJobOpeningRequest) returns (EscalateJobOpeningResponse);

  // Lists job openings a page at a time.
  rpc ListPendingJobOpenings(ListPendingJobOpeningsRequest) returns (ListPendingJobOpeningsResponse);

  // Delegates a job opening.
  rpc DelegateJobOpeningApproval(DelegateJobOpeningApprovalRequest) returns (DelegateJobOpeningApprovalResponse);

  // Recalls a job opening.
  rpc RecallJobOpening(RecallJobOpeningRequest) returns (RecallJobOpeningResponse);

  // Returns a job opening.
  rpc GetJobOpeningApprovalStatus(GetJobOpeningApprovalStatusRequest) returns (GetJobOpeningApprovalStatusResponse);

  // Comments a job opening.
  rpc CommentJobOpeningApproval(CommentJobOpeningApprovalRequest) returns (CommentJobOpeningApprovalResponse);
}

// The request of `SubmitJobOpening`.
message SubmitJobOpeningRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  JobOpening job_opening = 3;
  SubmitJobOpeningRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitJobOpening`.
message SubmitJobOpeningResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JobOpening job_opening = 1;
  SubmitJobOpeningResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

