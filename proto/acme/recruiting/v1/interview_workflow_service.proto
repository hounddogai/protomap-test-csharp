syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewWorkflowServiceProto";
option java_package = "com.acme.recruiting.v1";

// Runs the long-lived workflow that takes an interview from start to finish.
service InterviewWorkflowService {
  // Starts an interview.
  rpc StartInterviewWorkflow(StartInterviewWorkflowRequest) returns (StartInterviewWorkflowResponse);

  // Advances an interview.
  rpc AdvanceInterviewWorkflow(AdvanceInterviewWorkflowRequest) returns (AdvanceInterviewWorkflowResponse);

  // Cancels an interview.
  rpc CancelInterviewWorkflow(CancelInterviewWorkflowRequest) returns (CancelInterviewWorkflowResponse);

  // Pauses an interview.
  rpc PauseInterviewWorkflow(PauseInterviewWorkflowRequest) returns (PauseInterviewWorkflowResponse);

  // Lists interviews a page at a time.
  rpc ListInterviewWorkflows(ListInterviewWorkflowsRequest) returns (ListInterviewWorkflowsResponse);

  // Signals an interview.
  rpc SignalInterviewWorkflow(SignalInterviewWorkflowRequest) returns (SignalInterviewWorkflowResponse);
}

// The request of `StartInterviewWorkflow`.
message StartInterviewWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  Interview interview = 3;
  StartInterviewWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartInterviewWorkflow`.
message StartInterviewWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interview interview = 1;
  StartInterviewWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

