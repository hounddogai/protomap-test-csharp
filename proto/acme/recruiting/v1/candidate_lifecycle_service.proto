syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "CandidateLifecycleServiceProto";
option java_package = "com.acme.recruiting.v1";

// Moves a candidate between the states of its lifecycle.
service CandidateLifecycleService {
  // Activates a candidate.
  rpc ActivateCandidate(ActivateCandidateRequest) returns (ActivateCandidateResponse);

  // Suspends a candidate.
  rpc SuspendCandidate(SuspendCandidateRequest) returns (SuspendCandidateResponse);

  // Reinstates a candidate.
  rpc ReinstateCandidate(ReinstateCandidateRequest) returns (ReinstateCandidateResponse);

  // Terminates a candidate.
  rpc TerminateCandidate(TerminateCandidateRequest) returns (TerminateCandidateResponse);

  // Renews a candidate.
  rpc RenewCandidate(RenewCandidateRequest) returns (RenewCandidateResponse);

  // Expires a candidate.
  rpc ExpireCandidate(ExpireCandidateRequest) returns (ExpireCandidateResponse);

  // Schedules a candidate.
  rpc ScheduleCandidateExpiry(ScheduleCandidateExpiryRequest) returns (ScheduleCandidateExpiryResponse);
}

// The request of `ActivateCandidate`.
message ActivateCandidateRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  ActivateCandidateRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCandidate`.
message ActivateCandidateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Candidate candidate = 1;
  ActivateCandidateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

