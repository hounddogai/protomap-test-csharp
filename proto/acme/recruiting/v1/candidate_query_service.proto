syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "CandidateQueryServiceProto";
option java_package = "com.acme.recruiting.v1";

// Answers read-only questions about candidates, for screens and reports.
service CandidateQueryService {
  // Returns a candidate.
  rpc LookupCandidate(LookupCandidateRequest) returns (LookupCandidateResponse);

  // Lists candidates a page at a time.
  rpc BrowseCandidates(BrowseCandidatesRequest) returns (BrowseCandidatesResponse);

  // Lists candidates a page at a time.
  rpc FindCandidates(FindCandidatesRequest) returns (FindCandidatesResponse);

  // Counts candidates by status.
  rpc CountCandidates(CountCandidatesRequest) returns (CountCandidatesResponse);

  // Returns several candidates at once.
  rpc ResolveCandidates(ResolveCandidatesRequest) returns (ResolveCandidatesResponse);

  // Streams every matching candidate.
  rpc ExportCandidates(ExportCandidatesRequest) returns (stream ExportCandidatesResponse);

  // Summarizes a candidate.
  rpc SummarizeCandidates(SummarizeCandidatesRequest) returns (SummarizeCandidatesResponse);

  // Lists candidates a page at a time.
  rpc SuggestCandidates(SuggestCandidatesRequest) returns (SuggestCandidatesResponse);

  // Returns a candidate.
  rpc PeekCandidate(PeekCandidateRequest) returns (PeekCandidateResponse);
}

// The request of `LookupCandidate`.
message LookupCandidateRequest {
  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupCandidate`.
message LookupCandidateResponse {
  Candidate candidate = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseCandidates`.
message BrowseCandidatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseCandidatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseCandidates`.
message BrowseCandidatesResponse {
  repeated Candidate candidates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindCandidates`.
message FindCandidatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindCandidatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindCandidates`.
message FindCandidatesResponse {
  repeated Candidate candidates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCandidates`.
message CountCandidatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCandidatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCandidates`.
message CountCandidatesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveCandidates`.
message ResolveCandidatesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string candidate_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveCandidates`.
message ResolveCandidatesResponse {
  repeated Candidate candidates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportCandidates`.
message ExportCandidatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportCandidatesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportCandidates`.
message ExportCandidatesResponse {
  Candidate candidate = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeCandidates`.
message SummarizeCandidatesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  SummarizeCandidatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeCandidates`.
message SummarizeCandidatesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestCandidates`.
message SuggestCandidatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestCandidatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestCandidates`.
message SuggestCandidatesResponse {
  repeated Candidate candidates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekCandidate`.
message PeekCandidateRequest {
  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekCandidate`.
message PeekCandidateResponse {
  Candidate candidate = 1;
  acme.common.v1.OperationResult result = 2;
}
