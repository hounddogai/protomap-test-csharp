syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewApprovalServiceProto";
option java_package = "com.acme.recruiting.v1";

// Routes interviews through approval, with escalation and delegation.
service InterviewApprovalService {
  // Submits an interview.
  rpc SubmitInterview(SubmitInterviewRequest) returns (SubmitInterviewResponse);

  // Approves an interview.
  rpc ApproveInterview(ApproveInterviewRequest) returns (ApproveInterviewResponse);

  // Rejects an interview.
  rpc RejectInterview(RejectInterviewRequest) returns (RejectInterviewResponse);

  // Escalates an interview.
  rpc EscalateInterview(EscalateInterviewRequest) returns (EscalateInterviewResponse);

  // Lists interviews a page at a time.
  rpc ListPendingInterviews(ListPendingInterviewsRequest) returns (ListPendingInterviewsResponse);

  // Delegates an interview.
  rpc DelegateInterviewApproval(DelegateInterviewApprovalRequest) returns (DelegateInterviewApprovalResponse);

  // Recalls an interview.
  rpc RecallInterview(RecallInterviewRequest) returns (RecallInterviewResponse);

  // Returns an interview.
  rpc GetInterviewApprovalStatus(GetInterviewApprovalStatusRequest) returns (GetInterviewApprovalStatusResponse);

  // Comments an interview.
  rpc CommentInterviewApproval(CommentInterviewApprovalRequest) returns (CommentInterviewApprovalResponse);
}

// The request of `SubmitInterview`.
message SubmitInterviewRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  Interview interview = 3;
  SubmitInterviewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitInterview`.
message SubmitInterviewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interview interview = 1;
  SubmitInterviewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

