syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "OfferValidationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Checks offers against the rules before anything acts on them.
service OfferValidationService {
  // Validates an offer.
  rpc ValidateOffer(ValidateOfferRequest) returns (ValidateOfferResponse);

  // Previews an offer.
  rpc PreviewOffer(PreviewOfferRequest) returns (PreviewOfferResponse);

  // Checks an offer.
  rpc CheckOfferEligibility(CheckOfferEligibilityRequest) returns (CheckOfferEligibilityResponse);

  // Normalizes an offer.
  rpc NormalizeOffer(NormalizeOfferRequest) returns (NormalizeOfferResponse);

  // Scores an offer.
  rpc ScoreOffer(ScoreOfferRequest) returns (ScoreOfferResponse);

  // Lints an offer.
  rpc LintOffers(LintOffersRequest) returns (LintOffersResponse);
}

// The request of `ValidateOffer`.
message ValidateOfferRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string offer_id = 2;
  Offer offer = 3;
  ValidateOfferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateOffer`.
message ValidateOfferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Offer offer = 1;
  ValidateOfferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

