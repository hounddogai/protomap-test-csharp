syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "OfferSyncServiceProto";
option java_package = "com.acme.recruiting.v1";

// Keeps offers in step with the systems of record in other regions.
service OfferSyncService {
  // Syncs an offer.
  rpc SyncOffers(SyncOffersRequest) returns (SyncOffersResponse);

  // Pushs an offer.
  rpc PushOffer(PushOfferRequest) returns (PushOfferResponse);

  // Pulls an offer.
  rpc PullOffers(PullOffersRequest) returns (PullOffersResponse);

  // Reconciles an offer.
  rpc ReconcileOffers(ReconcileOffersRequest) returns (ReconcileOffersResponse);

  // Exchanges changes of offers with a peer.
  rpc StreamOfferChanges(stream StreamOfferChangesRequest) returns (stream StreamOfferChangesResponse);

  // Resolves an offer.
  rpc ResolveOfferConflict(ResolveOfferConflictRequest) returns (ResolveOfferConflictResponse);

  // Returns an offer.
  rpc GetOfferSyncState(GetOfferSyncStateRequest) returns (GetOfferSyncStateResponse);

  // Lists offers a page at a time.
  rpc ListOfferConflicts(ListOfferConflictsRequest) returns (ListOfferConflictsResponse);
}

// The request of `SyncOffers`.
message SyncOffersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string offer_id = 2;
  Offer offer = 3;
  SyncOffersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncOffers`.
message SyncOffersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Offer offer = 1;
  SyncOffersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushOffer`.
message PushOfferRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
