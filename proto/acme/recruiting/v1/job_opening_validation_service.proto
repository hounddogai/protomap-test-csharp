syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "JobOpeningValidationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Checks job openings against the rules before anything acts on them.
service JobOpeningValidationService {
  // Validates a job opening.
  rpc ValidateJobOpening(ValidateJobOpeningRequest) returns (ValidateJobOpeningResponse);

  // Previews a job opening.
  rpc PreviewJobOpening(PreviewJobOpeningRequest) returns (PreviewJobOpeningResponse);

  // Checks a job opening.
  rpc CheckJobOpeningEligibility(CheckJobOpeningEligibilityRequest) returns (CheckJobOpeningEligibilityResponse);

  // Normalizes a job opening.
  rpc NormalizeJobOpening(NormalizeJobOpeningRequest) returns (NormalizeJobOpeningResponse);

  // Explains a job opening.
  rpc ExplainJobOpeningDecision(ExplainJobOpeningDecisionRequest) returns (ExplainJobOpeningDecisionResponse);

  // Scores a job opening.
  rpc ScoreJobOpening(ScoreJobOpeningRequest) returns (ScoreJobOpeningResponse);

  // Lints a job opening.
  rpc LintJobOpenings(LintJobOpeningsRequest) returns (LintJobOpeningsResponse);
}

// The request of `ValidateJobOpening`.
message ValidateJobOpeningRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  JobOpening job_opening = 3;
  ValidateJobOpeningRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateJobOpening`.
message ValidateJobOpeningResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JobOpening job_opening = 1;
  ValidateJobOpeningResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

