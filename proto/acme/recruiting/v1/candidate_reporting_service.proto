syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "CandidateReportingServiceProto";
option java_package = "com.acme.recruiting.v1";

// Builds and schedules reports about candidates.
service CandidateReportingService {
  // Generates a candidate.
  rpc GenerateCandidateReport(GenerateCandidateReportRequest) returns (GenerateCandidateReportResponse);

  // Returns a candidate.
  rpc FetchCandidateReport(FetchCandidateReportRequest) returns (FetchCandidateReportResponse);

  // Schedules a candidate.
  rpc ScheduleCandidateReport(ScheduleCandidateReportRequest) returns (ScheduleCandidateReportResponse);

  // Lists candidates a page at a time.
  rpc ListCandidateReports(ListCandidateReportsRequest) returns (ListCandidateReportsResponse);

  // Shares a candidate.
  rpc ShareCandidateReport(ShareCandidateReportRequest) returns (ShareCandidateReportResponse);

  // Counts candidates by status.
  rpc CountCandidateTotals(CountCandidateTotalsRequest) returns (CountCandidateTotalsResponse);

  // Deletes a candidate.
  rpc DeleteCandidateReport(DeleteCandidateReportRequest) returns (DeleteCandidateReportResponse);
}

// The request of `GenerateCandidateReport`.
message GenerateCandidateReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  GenerateCandidateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateCandidateReport`.
message GenerateCandidateReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchCandidateReport`.
message FetchCandidateReportRequest {
  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchCandidateReport`.
message FetchCandidateReportResponse {
  Candidate candidate = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleCandidateReport`.
message ScheduleCandidateReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  ScheduleCandidateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleCandidateReport`.
message ScheduleCandidateReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCandidateReports`.
message ListCandidateReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCandidateReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCandidateReports`.
message ListCandidateReportsResponse {
  repeated Candidate candidates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareCandidateReport`.
message ShareCandidateReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  ShareCandidateReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareCandidateReport`.
message ShareCandidateReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Candidate candidate = 1;
  ShareCandidateReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCandidateTotals`.
message CountCandidateTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CandidateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCandidateTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCandidateTotals`.
message CountCandidateTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteCandidateReport`.
message DeleteCandidateReportRequest {
  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCandidateReport`.
message DeleteCandidateReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
