syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "JobOpeningWorkflowServiceProto";
option java_package = "com.acme.recruiting.v1";

// Runs the long-lived workflow that takes a job opening from start to finish.
service JobOpeningWorkflowService {
  // Starts a job opening.
  rpc StartJobOpeningWorkflow(StartJobOpeningWorkflowRequest) returns (StartJobOpeningWorkflowResponse);

  // Advances a job opening.
  rpc AdvanceJobOpeningWorkflow(AdvanceJobOpeningWorkflowRequest) returns (AdvanceJobOpeningWorkflowResponse);

  // Cancels a job opening.
  rpc CancelJobOpeningWorkflow(CancelJobOpeningWorkflowRequest) returns (CancelJobOpeningWorkflowResponse);

  // Retrys a job opening.
  rpc RetryJobOpeningWorkflow(RetryJobOpeningWorkflowRequest) returns (RetryJobOpeningWorkflowResponse);

  // Pauses a job opening.
  rpc PauseJobOpeningWorkflow(PauseJobOpeningWorkflowRequest) returns (PauseJobOpeningWorkflowResponse);

  // Resumes a job opening.
  rpc ResumeJobOpeningWorkflow(ResumeJobOpeningWorkflowRequest) returns (ResumeJobOpeningWorkflowResponse);

  // Returns a job opening.
  rpc InspectJobOpeningWorkflow(InspectJobOpeningWorkflowRequest) returns (InspectJobOpeningWorkflowResponse);

  // Lists job openings a page at a time.
  rpc ListJobOpeningWorkflows(ListJobOpeningWorkflowsRequest) returns (ListJobOpeningWorkflowsResponse);

  // Signals a job opening.
  rpc SignalJobOpeningWorkflow(SignalJobOpeningWorkflowRequest) returns (SignalJobOpeningWorkflowResponse);
}

// The request of `StartJobOpeningWorkflow`.
message StartJobOpeningWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string job_opening_id = 2;
  JobOpening job_opening = 3;
  StartJobOpeningWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartJobOpeningWorkflow`.
message StartJobOpeningWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JobOpening job_opening = 1;
  StartJobOpeningWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

