syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "InterviewValidationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Checks interviews against the rules before anything acts on them.
service InterviewValidationService {
  // Validates an interview.
  rpc ValidateInterview(ValidateInterviewRequest) returns (ValidateInterviewResponse);

  // Previews an interview.
  rpc PreviewInterview(PreviewInterviewRequest) returns (PreviewInterviewResponse);

  // Checks an interview.
  rpc CheckInterviewEligibility(CheckInterviewEligibilityRequest) returns (CheckInterviewEligibilityResponse);

  // Normalizes an interview.
  rpc NormalizeInterview(NormalizeInterviewRequest) returns (NormalizeInterviewResponse);

  // Explains an interview.
  rpc ExplainInterviewDecision(ExplainInterviewDecisionRequest) returns (ExplainInterviewDecisionResponse);

  // Scores an interview.
  rpc ScoreInterview(ScoreInterviewRequest) returns (ScoreInterviewResponse);

  // Lints an interview.
  rpc LintInterviews(LintInterviewsRequest) returns (LintInterviewsResponse);

  // Returns an interview.
  rpc GetInterviewRules(GetInterviewRulesRequest) returns (GetInterviewRulesResponse);
}

// The request of `ValidateInterview`.
message ValidateInterviewRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string interview_id = 2;
  Interview interview = 3;
  ValidateInterviewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateInterview`.
message ValidateInterviewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interview interview = 1;
  ValidateInterviewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

