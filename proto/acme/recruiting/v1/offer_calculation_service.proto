syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "OfferCalculationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Computes the figures of an offer, such as totals, taxes, and estimates.
service OfferCalculationService {
  // Calculates an offer.
  rpc CalculateOffer(CalculateOfferRequest) returns (CalculateOfferResponse);

  // Estimates an offer.
  rpc EstimateOffer(EstimateOfferRequest) returns (EstimateOfferResponse);

  // Quotes an offer.
  rpc QuoteOffer(QuoteOfferRequest) returns (QuoteOfferResponse);

  // Recalculates an offer.
  rpc RecalculateOffers(RecalculateOffersRequest) returns (RecalculateOffersResponse);

  // Simulates an offer.
  rpc SimulateOffer(SimulateOfferRequest) returns (SimulateOfferResponse);

  // Explains an offer.
  rpc ExplainOfferCalculation(ExplainOfferCalculationRequest) returns (ExplainOfferCalculationResponse);
}

// The request of `CalculateOffer`.
message CalculateOfferRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string offer_id = 2;
  Offer offer = 3;
  CalculateOfferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateOffer`.
message CalculateOfferResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateOfferResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Offer offer = 1;
  CalculateOfferResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

