syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "CandidateCalculationServiceProto";
option java_package = "com.acme.recruiting.v1";

// Computes the figures of a candidate, such as totals, taxes, and estimates.
service CandidateCalculationService {
  // Calculates a candidate.
  rpc CalculateCandidate(CalculateCandidateRequest) returns (CalculateCandidateResponse);

  // Estimates a candidate.
  rpc EstimateCandidate(EstimateCandidateRequest) returns (EstimateCandidateResponse);

  // Quotes a candidate.
  rpc QuoteCandidate(QuoteCandidateRequest) returns (QuoteCandidateResponse);

  // Compares a candidate.
  rpc CompareCandidateOptions(CompareCandidateOptionsRequest) returns (CompareCandidateOptionsResponse);

  // Recalculates a candidate.
  rpc RecalculateCandidates(RecalculateCandidatesRequest) returns (RecalculateCandidatesResponse);

  // Simulates a candidate.
  rpc SimulateCandidate(SimulateCandidateRequest) returns (SimulateCandidateResponse);

  // Explains a candidate.
  rpc ExplainCandidateCalculation(ExplainCandidateCalculationRequest) returns (ExplainCandidateCalculationResponse);

  // Returns a candidate.
  rpc GetCandidateRates(GetCandidateRatesRequest) returns (GetCandidateRatesResponse);
}

// The request of `CalculateCandidate`.
message CalculateCandidateRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  Candidate candidate = 3;
  CalculateCandidateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCandidate`.
message CalculateCandidateResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCandidateResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Candidate candidate = 1;
  CalculateCandidateResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

