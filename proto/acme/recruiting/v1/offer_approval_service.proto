syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "OfferApprovalServiceProto";
option java_package = "com.acme.recruiting.v1";

// Routes offers through approval, with escalation and delegation.
service OfferApprovalService {
  // Submits an offer.
  rpc SubmitOffer(SubmitOfferRequest) returns (SubmitOfferResponse);

  // Approves an offer.
  rpc ApproveOffer(ApproveOfferRequest) returns (ApproveOfferResponse);

  // Rejects an offer.
  rpc RejectOffer(RejectOfferRequest) returns (RejectOfferResponse);

  // Escalates an offer.
  rpc EscalateOffer(EscalateOfferRequest) returns (EscalateOfferResponse);

  // Lists offers a page at a time.
  rpc ListPendingOffers(ListPendingOffersRequest) returns (ListPendingOffersResponse);

  // Delegates an offer.
  rpc DelegateOfferApproval(DelegateOfferApprovalRequest) returns (DelegateOfferApprovalResponse);

  // Recalls an offer.
  rpc RecallOffer(RecallOfferRequest) returns (RecallOfferResponse);

  // Returns an offer.
  rpc GetOfferApprovalStatus(GetOfferApprovalStatusRequest) returns (GetOfferApprovalStatusResponse);
}

// The request of `SubmitOffer`.
message SubmitOfferRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string offer_id = 2;
  Offer offer = 3;
  SubmitOfferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitOffer`.
message SubmitOfferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Offer offer = 1;
  SubmitOfferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

