syntax = "proto3";

package acme.recruiting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recruiting/v1/recruiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recruiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recruiting/v1;recruitingv1";
option java_multiple_files = true;
option java_outer_classname = "CandidateApprovalServiceProto";
option java_package = "com.acme.recruiting.v1";

// Routes candidates through approval, with escalation and delegation.
service CandidateApprovalService {
  // Submits a candidate.
  rpc SubmitCandidate(SubmitCandidateRequest) returns (SubmitCandidateResponse);

  // Approves a candidate.
  rpc ApproveCandidate(ApproveCandidateRequest) returns (ApproveCandidateResponse);

  // Rejects a candidate.
  rpc RejectCandidate(RejectCandidateRequest) returns (RejectCandidateResponse);

  // Escalates a candidate.
  rpc EscalateCandidate(EscalateCandidateRequest) returns (EscalateCandidateResponse);

  // Lists candidates a page at a time.
  rpc ListPendingCandidates(ListPendingCandidatesRequest) returns (ListPendingCandidatesResponse);

  // Recalls a candidate.
  rpc RecallCandidate(RecallCandidateRequest) returns (RecallCandidateResponse);

  // Returns a candidate.
  rpc GetCandidateApprovalStatus(GetCandidateApprovalStatusRequest) returns (GetCandidateApprovalStatusResponse);
}

// The request of `SubmitCandidate`.
message SubmitCandidateRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  Candidate candidate = 3;
  SubmitCandidateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCandidate`.
message SubmitCandidateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Candidate candidate = 1;
  SubmitCandidateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCandidate`.
message ApproveCandidateRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
