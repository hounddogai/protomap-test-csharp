// The request of `GetCandidateApprovalStatus`.
message GetCandidateApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string candidate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCandidateApprovalStatus`.
message GetCandidateApprovalStatusResponse {
  Candidate candidate = 1;
  acme.common.v1.OperationResult result = 2;
}
