syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "AvailabilityWindowValidationServiceProto";
option java_package = "com.acme.scheduling.v1";

// Checks availability windows against the rules before anything acts on them.
service AvailabilityWindowValidationService {
  // Validates an availability window.
  rpc ValidateAvailabilityWindow(ValidateAvailabilityWindowRequest) returns (ValidateAvailabilityWindowResponse);

  // Previews an availability window.
  rpc PreviewAvailabilityWindow(PreviewAvailabilityWindowRequest) returns (PreviewAvailabilityWindowResponse);

  // Checks an availability window.
  rpc CheckAvailabilityWindowEligibility(CheckAvailabilityWindowEligibilityRequest) returns (CheckAvailabilityWindowEligibilityResponse);

  // Explains an availability window.
  rpc ExplainAvailabilityWindowDecision(ExplainAvailabilityWindowDecisionRequest) returns (ExplainAvailabilityWindowDecisionResponse);

  // Scores an availability window.
  rpc ScoreAvailabilityWindow(ScoreAvailabilityWindowRequest) returns (ScoreAvailabilityWindowResponse);

  // Lints an availability window.
  rpc LintAvailabilityWindows(LintAvailabilityWindowsRequest) returns (LintAvailabilityWindowsResponse);

  // Returns an availability window.
  rpc GetAvailabilityWindowRules(GetAvailabilityWindowRulesRequest) returns (GetAvailabilityWindowRulesResponse);
}

// The request of `ValidateAvailabilityWindow`.
message ValidateAvailabilityWindowRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string availability_window_id = 2;
  AvailabilityWindow availability_window = 3;
  ValidateAvailabilityWindowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAvailabilityWindow`.
message ValidateAvailabilityWindowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AvailabilityWindow availability_window = 1;
  ValidateAvailabilityWindowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

