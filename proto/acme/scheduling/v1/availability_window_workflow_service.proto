option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "AvailabilityWindowWorkflowServiceProto";
option java_package = "com.acme.scheduling.v1";

// Runs the long-lived workflow that takes an availability window from start to finish.
service AvailabilityWindowWorkflowService {
  // Starts an availability window.
  rpc StartAvailabilityWindowWorkflow(StartAvailabilityWindowWorkflowRequest) returns (StartAvailabilityWindowWorkflowResponse);

  // Advances an availability window.
  rpc AdvanceAvailabilityWindowWorkflow(AdvanceAvailabilityWindowWorkflowRequest) returns (AdvanceAvailabilityWindowWorkflowResponse);

  // Cancels an availability window.
  rpc CancelAvailabilityWindowWorkflow(CancelAvailabilityWindowWorkflowRequest) returns (CancelAvailabilityWindowWorkflowResponse);

  // Retrys an availability window.
  rpc RetryAvailabilityWindowWorkflow(RetryAvailabilityWindowWorkflowRequest) returns (RetryAvailabilityWindowWorkflowResponse);

  // Pauses an availability window.
  rpc PauseAvailabilityWindowWorkflow(PauseAvailabilityWindowWorkflowRequest) returns (PauseAvailabilityWindowWorkflowResponse);

  // Resumes an availability window.
  rpc ResumeAvailabilityWindowWorkflow(ResumeAvailabilityWindowWorkflowRequest) returns (ResumeAvailabilityWindowWorkflowResponse);

  // Returns an availability window.
  rpc InspectAvailabilityWindowWorkflow(InspectAvailabilityWindowWorkflowRequest) returns (InspectAvailabilityWindowWorkflowResponse);

  // Lists availability windows a page at a time.
  rpc ListAvailabilityWindowWorkflows(ListAvailabilityWindowWorkflowsRequest) returns (ListAvailabilityWindowWorkflowsResponse);

  // Signals an availability window.
  rpc SignalAvailabilityWindowWorkflow(SignalAvailabilityWindowWorkflowRequest) returns (SignalAvailabilityWindowWorkflowResponse);
}

// The request of `StartAvailabilityWindowWorkflow`.
message StartAvailabilityWindowWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string availability_window_id = 2;
  AvailabilityWindow availability_window = 3;
  StartAvailabilityWindowWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAvailabilityWindowWorkflow`.
message StartAvailabilityWindowWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AvailabilityWindow availability_window = 1;
  StartAvailabilityWindowWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

