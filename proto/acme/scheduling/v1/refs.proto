syntax = "proto3";

package acme.scheduling.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.scheduling.v1";

// A reference to a shift of the scheduling domain.
message ShiftRef {
  string shift_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a roster of the scheduling domain.
message RosterRef {
  string roster_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to an availability window of the scheduling domain.
message AvailabilityWindowRef {
  string availability_window_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a swap request of the scheduling domain.
message SwapRequestRef {
  string swap_request_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
