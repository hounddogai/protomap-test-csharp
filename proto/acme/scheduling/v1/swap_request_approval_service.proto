syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "SwapRequestApprovalServiceProto";
option java_package = "com.acme.scheduling.v1";

// Routes swap requests through approval, with escalation and delegation.
service SwapRequestApprovalService {
  // Submits a swap request.
  rpc SubmitSwapRequest(SubmitSwapRequestRequest) returns (SubmitSwapRequestResponse);

  // Approves a swap request.
  rpc ApproveSwapRequest(ApproveSwapRequestRequest) returns (ApproveSwapRequestResponse);

  // Rejects a swap request.
  rpc RejectSwapRequest(RejectSwapRequestRequest) returns (RejectSwapRequestResponse);

  // Escalates a swap request.
  rpc EscalateSwapRequest(EscalateSwapRequestRequest) returns (EscalateSwapRequestResponse);

  // Delegates a swap request.
  rpc DelegateSwapRequestApproval(DelegateSwapRequestApprovalRequest) returns (DelegateSwapRequestApprovalResponse);

  // Recalls a swap request.
  rpc RecallSwapRequest(RecallSwapRequestRequest) returns (RecallSwapRequestResponse);

  // Comments a swap request.
  rpc CommentSwapRequestApproval(CommentSwapRequestApprovalRequest) returns (CommentSwapRequestApprovalResponse);
}

// The request of `SubmitSwapRequest`.
message SubmitSwapRequestRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string swap_request_id = 2;
  SwapRequest swap_request = 3;
  SubmitSwapRequestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSwapRequest`.
message SubmitSwapRequestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SwapRequest swap_request = 1;
  SubmitSwapRequestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

