syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "AvailabilityWindowCalculationServiceProto";
option java_package = "com.acme.scheduling.v1";

// Computes the figures of an availability window, such as totals, taxes, and estimates.
service AvailabilityWindowCalculationService {
  // Calculates an availability window.
  rpc CalculateAvailabilityWindow(CalculateAvailabilityWindowRequest) returns (CalculateAvailabilityWindowResponse);

  // Estimates an availability window.
  rpc EstimateAvailabilityWindow(EstimateAvailabilityWindowRequest) returns (EstimateAvailabilityWindowResponse);

  // Quotes an availability window.
  rpc QuoteAvailabilityWindow(QuoteAvailabilityWindowRequest) returns (QuoteAvailabilityWindowResponse);

  // Compares an availability window.
  rpc CompareAvailabilityWindowOptions(CompareAvailabilityWindowOptionsRequest) returns (CompareAvailabilityWindowOptionsResponse);

  // Recalculates an availability window.
  rpc RecalculateAvailabilityWindows(RecalculateAvailabilityWindowsRequest) returns (RecalculateAvailabilityWindowsResponse);

  // Simulates an availability window.
  rpc SimulateAvailabilityWindow(SimulateAvailabilityWindowRequest) returns (SimulateAvailabilityWindowResponse);

  // Explains an availability window.
  rpc ExplainAvailabilityWindowCalculation(ExplainAvailabilityWindowCalculationRequest) returns (ExplainAvailabilityWindowCalculationResponse);

  // Returns an availability window.
  rpc GetAvailabilityWindowRates(GetAvailabilityWindowRatesRequest) returns (GetAvailabilityWindowRatesResponse);
}

// The request of `CalculateAvailabilityWindow`.
message CalculateAvailabilityWindowRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string availability_window_id = 2;
  AvailabilityWindow availability_window = 3;
  CalculateAvailabilityWindowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAvailabilityWindow`.
message CalculateAvailabilityWindowResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAvailabilityWindowResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  AvailabilityWindow availability_window = 1;
  CalculateAvailabilityWindowResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

