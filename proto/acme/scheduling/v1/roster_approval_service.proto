syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "RosterApprovalServiceProto";
option java_package = "com.acme.scheduling.v1";

// Routes rosters through approval, with escalation and delegation.
service RosterApprovalService {
  // Submits a roster.
  rpc SubmitRoster(SubmitRosterRequest) returns (SubmitRosterResponse);

  // Approves a roster.
  rpc ApproveRoster(ApproveRosterRequest) returns (ApproveRosterResponse);

  // Rejects a roster.
  rpc RejectRoster(RejectRosterRequest) returns (RejectRosterResponse);

  // Escalates a roster.
  rpc EscalateRoster(EscalateRosterRequest) returns (EscalateRosterResponse);

  // Lists rosters a page at a time.
  rpc ListPendingRosters(ListPendingRostersRequest) returns (ListPendingRostersResponse);

  // Delegates a roster.
  rpc DelegateRosterApproval(DelegateRosterApprovalRequest) returns (DelegateRosterApprovalResponse);

  // Recalls a roster.
  rpc RecallRoster(RecallRosterRequest) returns (RecallRosterResponse);

  // Returns a roster.
  rpc GetRosterApprovalStatus(GetRosterApprovalStatusRequest) returns (GetRosterApprovalStatusResponse);

  // Comments a roster.
  rpc CommentRosterApproval(CommentRosterApprovalRequest) returns (CommentRosterApprovalResponse);
}

// The request of `SubmitRoster`.
message SubmitRosterRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string roster_id = 2;
  Roster roster = 3;
  SubmitRosterRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRoster`.
message SubmitRosterResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Roster roster = 1;
  SubmitRosterResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

