// The request of `ListPendingAvailabilityWindows`.
message ListPendingAvailabilityWindowsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AvailabilityWindowStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingAvailabilityWindowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingAvailabilityWindows`.
message ListPendingAvailabilityWindowsResponse {
  repeated AvailabilityWindow availability_windows = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

