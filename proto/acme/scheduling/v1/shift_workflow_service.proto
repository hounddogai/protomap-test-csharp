syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "ShiftWorkflowServiceProto";
option java_package = "com.acme.scheduling.v1";

// Runs the long-lived workflow that takes a shift from start to finish.
service ShiftWorkflowService {
  // Starts a shift.
  rpc StartShiftWorkflow(StartShiftWorkflowRequest) returns (StartShiftWorkflowResponse);

  // Advances a shift.
  rpc AdvanceShiftWorkflow(AdvanceShiftWorkflowRequest) returns (AdvanceShiftWorkflowResponse);

  // Cancels a shift.
  rpc CancelShiftWorkflow(CancelShiftWorkflowRequest) returns (CancelShiftWorkflowResponse);

  // Retrys a shift.
  rpc RetryShiftWorkflow(RetryShiftWorkflowRequest) returns (RetryShiftWorkflowResponse);

  // Lists shifts a page at a time.
  rpc ListShiftWorkflows(ListShiftWorkflowsRequest) returns (ListShiftWorkflowsResponse);

  // Signals a shift.
  rpc SignalShiftWorkflow(SignalShiftWorkflowRequest) returns (SignalShiftWorkflowResponse);
}

// The request of `StartShiftWorkflow`.
message StartShiftWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string shift_id = 2;
  Shift shift = 3;
  StartShiftWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartShiftWorkflow`.
message StartShiftWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Shift shift = 1;
  StartShiftWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

