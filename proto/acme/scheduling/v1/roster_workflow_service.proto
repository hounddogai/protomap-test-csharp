syntax = "proto3";

package acme.scheduling.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/scheduling/v1/scheduling.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Scheduling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/scheduling/v1;schedulingv1";
option java_multiple_files = true;
option java_outer_classname = "RosterWorkflowServiceProto";
option java_package = "com.acme.scheduling.v1";

// Runs the long-lived workflow that takes a roster from start to finish.
service RosterWorkflowService {
  // Starts a roster.
  rpc StartRosterWorkflow(StartRosterWorkflowRequest) returns (StartRosterWorkflowResponse);

  // Advances a roster.
  rpc AdvanceRosterWorkflow(AdvanceRosterWorkflowRequest) returns (AdvanceRosterWorkflowResponse);

  // Cancels a roster.
  rpc CancelRosterWorkflow(CancelRosterWorkflowRequest) returns (CancelRosterWorkflowResponse);

  // Retrys a roster.
  rpc RetryRosterWorkflow(RetryRosterWorkflowRequest) returns (RetryRosterWorkflowResponse);

  // Pauses a roster.
  rpc PauseRosterWorkflow(PauseRosterWorkflowRequest) returns (PauseRosterWorkflowResponse);

  // Returns a roster.
  rpc InspectRosterWorkflow(InspectRosterWorkflowRequest) returns (InspectRosterWorkflowResponse);

  // Lists rosters a page at a time.
  rpc ListRosterWorkflows(ListRosterWorkflowsRequest) returns (ListRosterWorkflowsResponse);

  // Signals a roster.
  rpc SignalRosterWorkflow(SignalRosterWorkflowRequest) returns (SignalRosterWorkflowResponse);
}

// The request of `StartRosterWorkflow`.
message StartRosterWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string roster_id = 2;
  Roster roster = 3;
  StartRosterWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRosterWorkflow`.
message StartRosterWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Roster roster = 1;
  StartRosterWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

