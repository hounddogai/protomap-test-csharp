// The request of `RelayAnnouncementMessages`.
message RelayAnnouncementMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Announcement change = 2;
    RelayAnnouncementMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayAnnouncementMessages`.
message RelayAnnouncementMessagesResponse {
  Announcement announcement = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListAnnouncementSources`.
message ListAnnouncementSourcesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnouncementStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAnnouncementSourcesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAnnouncementSources`.
message ListAnnouncementSourcesResponse {
  repeated Announcement announcements = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

