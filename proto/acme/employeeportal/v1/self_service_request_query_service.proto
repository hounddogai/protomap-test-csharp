syntax = "proto3";

package acme.employeeportal.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employeeportal/v1/employeeportal.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employeeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employeeportal/v1;employeeportalv1";
option java_multiple_files = true;
option java_outer_classname = "SelfServiceRequestQueryServiceProto";
option java_package = "com.acme.employeeportal.v1";

// Answers read-only questions about self service requests, for screens and reports.
service SelfServiceRequestQueryService {
  // Returns a self service request.
  rpc LookupSelfServiceRequest(LookupSelfServiceRequestRequest) returns (LookupSelfServiceRequestResponse);

  // Lists self service requests a page at a time.
  rpc BrowseSelfServiceRequests(BrowseSelfServiceRequestsRequest) returns (BrowseSelfServiceRequestsResponse);

  // Lists self service requests a page at a time.
  rpc FindSelfServiceRequests(FindSelfServiceRequestsRequest) returns (FindSelfServiceRequestsResponse);

  // Returns several self service requests at once.
  rpc ResolveSelfServiceRequests(ResolveSelfServiceRequestsRequest) returns (ResolveSelfServiceRequestsResponse);

  // Streams every matching self service request.
  rpc ExportSelfServiceRequests(ExportSelfServiceRequestsRequest) returns (stream ExportSelfServiceRequestsResponse);

  // Summarizes a self service request.
  rpc SummarizeSelfServiceRequests(SummarizeSelfServiceRequestsRequest) returns (SummarizeSelfServiceRequestsResponse);

  // Lists self service requests a page at a time.
  rpc SuggestSelfServiceRequests(SuggestSelfServiceRequestsRequest) returns (SuggestSelfServiceRequestsResponse);
}

// The request of `LookupSelfServiceRequest`.
message LookupSelfServiceRequestRequest {
  acme.common.v1.RequestContext context = 1;
  string self_service_request_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSelfServiceRequest`.
message LookupSelfServiceRequestResponse {
  SelfServiceRequest self_service_request = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSelfServiceRequests`.
message BrowseSelfServiceRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SelfServiceRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSelfServiceRequestsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSelfServiceRequests`.
message BrowseSelfServiceRequestsResponse {
  repeated SelfServiceRequest self_service_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSelfServiceRequests`.
message FindSelfServiceRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SelfServiceRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSelfServiceRequestsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSelfServiceRequests`.
message FindSelfServiceRequestsResponse {
  repeated SelfServiceRequest self_service_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSelfServiceRequests`.
message ResolveSelfServiceRequestsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string self_service_request_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSelfServiceRequests`.
message ResolveSelfServiceRequestsResponse {
  repeated SelfServiceRequest self_service_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSelfServiceRequests`.
message ExportSelfServiceRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SelfServiceRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSelfServiceRequestsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSelfServiceRequests`.
message ExportSelfServiceRequestsResponse {
  SelfServiceRequest self_service_request = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSelfServiceRequests`.
message SummarizeSelfServiceRequestsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string self_service_request_id = 2;
  SummarizeSelfServiceRequestsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSelfServiceRequests`.
message SummarizeSelfServiceRequestsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSelfServiceRequests`.
message SuggestSelfServiceRequestsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SelfServiceRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSelfServiceRequestsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSelfServiceRequests`.
message SuggestSelfServiceRequestsResponse {
  repeated SelfServiceRequest self_service_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
