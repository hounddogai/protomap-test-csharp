    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SelfServiceRequest self_service_request = 1;
  NotifySelfServiceRequestWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListSelfServiceRequestSubscriptions`.
message ListSelfServiceRequestSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SelfServiceRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSelfServiceRequestSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSelfServiceRequestSubscriptions`.
message ListSelfServiceRequestSubscriptionsResponse {
  repeated SelfServiceRequest self_service_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

