// The request of `StreamSelfServiceRequestNotices`.
message StreamSelfServiceRequestNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SelfServiceRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSelfServiceRequestNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSelfServiceRequestNotices`.
message StreamSelfServiceRequestNoticesResponse {
  SelfServiceRequest self_service_request = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
