syntax = "proto3";

package acme.employeeportal.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employeeportal/v1/employeeportal.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employeeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employeeportal/v1;employeeportalv1";
option java_multiple_files = true;
option java_outer_classname = "SelfServiceRequestNotificationServiceProto";
option java_package = "com.acme.employeeportal.v1";

// Tells the people who follow a self service request what changed.
service SelfServiceRequestNotificationService {
  // Subscribes a self service request.
  rpc SubscribeSelfServiceRequestUpdates(SubscribeSelfServiceRequestUpdatesRequest) returns (SubscribeSelfServiceRequestUpdatesResponse);

  // Unsubscribes a self service request.
  rpc UnsubscribeSelfServiceRequestUpdates(UnsubscribeSelfServiceRequestUpdatesRequest) returns (UnsubscribeSelfServiceRequestUpdatesResponse);

  // Notifys a self service request.
  rpc NotifySelfServiceRequestWatchers(NotifySelfServiceRequestWatchersRequest) returns (NotifySelfServiceRequestWatchersResponse);

  // Lists self service requests a page at a time.
  rpc ListSelfServiceRequestSubscriptions(ListSelfServiceRequestSubscriptionsRequest) returns (ListSelfServiceRequestSubscriptionsResponse);

  // Sends a self service request.
  rpc SendSelfServiceRequestTestNotice(SendSelfServiceRequestTestNoticeRequest) returns (SendSelfServiceRequestTestNoticeResponse);

  // Returns a self service request.
  rpc GetSelfServiceRequestPreferences(GetSelfServiceRequestPreferencesRequest) returns (GetSelfServiceRequestPreferencesResponse);

  // Streams the changes of self service requests as they happen.
  rpc StreamSelfServiceRequestNotices(StreamSelfServiceRequestNoticesRequest) returns (stream StreamSelfServiceRequestNoticesResponse);
}

// The request of `SubscribeSelfServiceRequestUpdates`.
message SubscribeSelfServiceRequestUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string self_service_request_id = 2;
  SubscribeSelfServiceRequestUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeSelfServiceRequestUpdates`.
message SubscribeSelfServiceRequestUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SelfServiceRequest self_service_request = 1;
  SubscribeSelfServiceRequestUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeSelfServiceRequestUpdates`.
message UnsubscribeSelfServiceRequestUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string self_service_request_id = 2;
  UnsubscribeSelfServiceRequestUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeSelfServiceRequestUpdates`.
message UnsubscribeSelfServiceRequestUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SelfServiceRequest self_service_request = 1;
  UnsubscribeSelfServiceRequestUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifySelfServiceRequestWatchers`.
message NotifySelfServiceRequestWatchersRequest {
  // What the operation needs besides the record.
