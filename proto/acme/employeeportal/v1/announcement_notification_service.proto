// The request of `GetAnnouncementPreferences`.
message GetAnnouncementPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string announcement_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAnnouncementPreferences`.
message GetAnnouncementPreferencesResponse {
  Announcement announcement = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamAnnouncementNotices`.
message StreamAnnouncementNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnouncementStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAnnouncementNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAnnouncementNotices`.
message StreamAnnouncementNoticesResponse {
  Announcement announcement = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
