syntax = "proto3";

package acme.employeeportal.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employeeportal/v1/employeeportal.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employeeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employeeportal/v1;employeeportalv1";
option java_multiple_files = true;
option java_outer_classname = "AnnouncementNotificationServiceProto";
option java_package = "com.acme.employeeportal.v1";

// Tells the people who follow an announcement what changed.
service AnnouncementNotificationService {
  // Subscribes an announcement.
  rpc SubscribeAnnouncementUpdates(SubscribeAnnouncementUpdatesRequest) returns (SubscribeAnnouncementUpdatesResponse);

  // Unsubscribes an announcement.
  rpc UnsubscribeAnnouncementUpdates(UnsubscribeAnnouncementUpdatesRequest) returns (UnsubscribeAnnouncementUpdatesResponse);

  // Notifys an announcement.
  rpc NotifyAnnouncementWatchers(NotifyAnnouncementWatchersRequest) returns (NotifyAnnouncementWatchersResponse);

  // Lists announcements a page at a time.
  rpc ListAnnouncementSubscriptions(ListAnnouncementSubscriptionsRequest) returns (ListAnnouncementSubscriptionsResponse);

  // Sends an announcement.
  rpc SendAnnouncementTestNotice(SendAnnouncementTestNoticeRequest) returns (SendAnnouncementTestNoticeResponse);

  // Returns an announcement.
  rpc GetAnnouncementPreferences(GetAnnouncementPreferencesRequest) returns (GetAnnouncementPreferencesResponse);

  // Streams the changes of announcements as they happen.
  rpc StreamAnnouncementNotices(StreamAnnouncementNoticesRequest) returns (stream StreamAnnouncementNoticesResponse);
}

// The request of `SubscribeAnnouncementUpdates`.
message SubscribeAnnouncementUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string announcement_id = 2;
  SubscribeAnnouncementUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeAnnouncementUpdates`.
message SubscribeAnnouncementUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Announcement announcement = 1;
  SubscribeAnnouncementUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeAnnouncementUpdates`.
message UnsubscribeAnnouncementUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string announcement_id = 2;
  UnsubscribeAnnouncementUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeAnnouncementUpdates`.
message UnsubscribeAnnouncementUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Announcement announcement = 1;
  UnsubscribeAnnouncementUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyAnnouncementWatchers`.
message NotifyAnnouncementWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
