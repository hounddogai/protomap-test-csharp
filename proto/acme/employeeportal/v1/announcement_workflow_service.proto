option csharp_namespace = "Acme.Employeeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employeeportal/v1;employeeportalv1";
option java_multiple_files = true;
option java_outer_classname = "AnnouncementWorkflowServiceProto";
option java_package = "com.acme.employeeportal.v1";

// Runs the long-lived workflow that takes an announcement from start to finish.
service AnnouncementWorkflowService {
  // Starts an announcement.
  rpc StartAnnouncementWorkflow(StartAnnouncementWorkflowRequest) returns (StartAnnouncementWorkflowResponse);

  // Advances an announcement.
  rpc AdvanceAnnouncementWorkflow(AdvanceAnnouncementWorkflowRequest) returns (AdvanceAnnouncementWorkflowResponse);

  // Cancels an announcement.
  rpc CancelAnnouncementWorkflow(CancelAnnouncementWorkflowRequest) returns (CancelAnnouncementWorkflowResponse);

  // Retrys an announcement.
  rpc RetryAnnouncementWorkflow(RetryAnnouncementWorkflowRequest) returns (RetryAnnouncementWorkflowResponse);

  // Pauses an announcement.
  rpc PauseAnnouncementWorkflow(PauseAnnouncementWorkflowRequest) returns (PauseAnnouncementWorkflowResponse);

  // Returns an announcement.
  rpc InspectAnnouncementWorkflow(InspectAnnouncementWorkflowRequest) returns (InspectAnnouncementWorkflowResponse);

  // Lists announcements a page at a time.
  rpc ListAnnouncementWorkflows(ListAnnouncementWorkflowsRequest) returns (ListAnnouncementWorkflowsResponse);

  // Signals an announcement.
  rpc SignalAnnouncementWorkflow(SignalAnnouncementWorkflowRequest) returns (SignalAnnouncementWorkflowResponse);
}

// The request of `StartAnnouncementWorkflow`.
message StartAnnouncementWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string announcement_id = 2;
  Announcement announcement = 3;
  StartAnnouncementWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAnnouncementWorkflow`.
message StartAnnouncementWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Announcement announcement = 1;
  StartAnnouncementWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

