// The request of `UploadPortalHomeAttachments`.
message UploadPortalHomeAttachmentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    UploadPortalHomeAttachmentsRequest.StreamHeader header = 2;
    PortalHome record = 3;
  }
  int64 sequence = 4;
}

// The response of `UploadPortalHomeAttachments`.
message UploadPortalHomeAttachmentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string portal_home_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated UploadPortalHomeAttachmentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetPortalHomeSummary`.
message GetPortalHomeSummaryRequest {
  acme.common.v1.RequestContext context = 1;
  string portal_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPortalHomeSummary`.
message GetPortalHomeSummaryResponse {
  PortalHome portal_home = 1;
  acme.common.v1.OperationResult result = 2;
}
