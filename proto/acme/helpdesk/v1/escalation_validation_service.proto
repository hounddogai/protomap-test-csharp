syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "EscalationValidationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Checks escalations against the rules before anything acts on them.
service EscalationValidationService {
  // Validates an escalation.
  rpc ValidateEscalation(ValidateEscalationRequest) returns (ValidateEscalationResponse);

  // Previews an escalation.
  rpc PreviewEscalation(PreviewEscalationRequest) returns (PreviewEscalationResponse);

  // Checks an escalation.
  rpc CheckEscalationEligibility(CheckEscalationEligibilityRequest) returns (CheckEscalationEligibilityResponse);

  // Normalizes an escalation.
  rpc NormalizeEscalation(NormalizeEscalationRequest) returns (NormalizeEscalationResponse);

  // Scores an escalation.
  rpc ScoreEscalation(ScoreEscalationRequest) returns (ScoreEscalationResponse);

  // Lints an escalation.
  rpc LintEscalations(LintEscalationsRequest) returns (LintEscalationsResponse);

  // Returns an escalation.
  rpc GetEscalationRules(GetEscalationRulesRequest) returns (GetEscalationRulesResponse);
}

// The request of `ValidateEscalation`.
message ValidateEscalationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  Escalation escalation = 3;
  ValidateEscalationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateEscalation`.
message ValidateEscalationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Escalation escalation = 1;
  ValidateEscalationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewEscalation`.
message PreviewEscalationRequest {
  // What the operation needs besides the record.
  message Details {
