syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "SlaPolicyLifecycleServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Moves a sla policy between the states of its lifecycle.
service SlaPolicyLifecycleService {
  // Activates a sla policy.
  rpc ActivateSlaPolicy(ActivateSlaPolicyRequest) returns (ActivateSlaPolicyResponse);

  // Suspends a sla policy.
  rpc SuspendSlaPolicy(SuspendSlaPolicyRequest) returns (SuspendSlaPolicyResponse);

  // Reinstates a sla policy.
  rpc ReinstateSlaPolicy(ReinstateSlaPolicyRequest) returns (ReinstateSlaPolicyResponse);

  // Terminates a sla policy.
  rpc TerminateSlaPolicy(TerminateSlaPolicyRequest) returns (TerminateSlaPolicyResponse);

  // Renews a sla policy.
  rpc RenewSlaPolicy(RenewSlaPolicyRequest) returns (RenewSlaPolicyResponse);

  // Expires a sla policy.
  rpc ExpireSlaPolicy(ExpireSlaPolicyRequest) returns (ExpireSlaPolicyResponse);

  // Returns a sla policy.
  rpc GetSlaPolicyLifecycle(GetSlaPolicyLifecycleRequest) returns (GetSlaPolicyLifecycleResponse);

  // Schedules a sla policy.
  rpc ScheduleSlaPolicyExpiry(ScheduleSlaPolicyExpiryRequest) returns (ScheduleSlaPolicyExpiryResponse);
}

// The request of `ActivateSlaPolicy`.
message ActivateSlaPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string sla_policy_id = 2;
  ActivateSlaPolicyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSlaPolicy`.
message ActivateSlaPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SlaPolicy sla_policy = 1;
  ActivateSlaPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

