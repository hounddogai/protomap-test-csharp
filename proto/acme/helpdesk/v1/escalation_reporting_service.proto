syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "EscalationReportingServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Builds and schedules reports about escalations.
service EscalationReportingService {
  // Generates an escalation.
  rpc GenerateEscalationReport(GenerateEscalationReportRequest) returns (GenerateEscalationReportResponse);

  // Returns an escalation.
  rpc FetchEscalationReport(FetchEscalationReportRequest) returns (FetchEscalationReportResponse);

  // Schedules an escalation.
  rpc ScheduleEscalationReport(ScheduleEscalationReportRequest) returns (ScheduleEscalationReportResponse);

  // Streams the changes of escalations as they happen.
  rpc StreamEscalationMetrics(StreamEscalationMetricsRequest) returns (stream StreamEscalationMetricsResponse);

  // Lists escalations a page at a time.
  rpc ListEscalationReports(ListEscalationReportsRequest) returns (ListEscalationReportsResponse);

  // Shares an escalation.
  rpc ShareEscalationReport(ShareEscalationReportRequest) returns (ShareEscalationReportResponse);

  // Counts escalations by status.
  rpc CountEscalationTotals(CountEscalationTotalsRequest) returns (CountEscalationTotalsResponse);

  // Deletes an escalation.
  rpc DeleteEscalationReport(DeleteEscalationReportRequest) returns (DeleteEscalationReportResponse);
}

// The request of `GenerateEscalationReport`.
message GenerateEscalationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  GenerateEscalationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateEscalationReport`.
message GenerateEscalationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchEscalationReport`.
message FetchEscalationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchEscalationReport`.
message FetchEscalationReportResponse {
  Escalation escalation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleEscalationReport`.
message ScheduleEscalationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  ScheduleEscalationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleEscalationReport`.
message ScheduleEscalationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamEscalationMetrics`.
message StreamEscalationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EscalationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamEscalationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamEscalationMetrics`.
message StreamEscalationMetricsResponse {
  Escalation escalation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListEscalationReports`.
message ListEscalationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EscalationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListEscalationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListEscalationReports`.
message ListEscalationReportsResponse {
  repeated Escalation escalations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareEscalationReport`.
message ShareEscalationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  ShareEscalationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareEscalationReport`.
message ShareEscalationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Escalation escalation = 1;
  ShareEscalationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountEscalationTotals`.
message CountEscalationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EscalationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountEscalationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountEscalationTotals`.
message CountEscalationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteEscalationReport`.
message DeleteEscalationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteEscalationReport`.
message DeleteEscalationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
