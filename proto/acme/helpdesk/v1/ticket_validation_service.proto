syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "TicketValidationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Checks tickets against the rules before anything acts on them.
service TicketValidationService {
  // Validates a ticket.
  rpc ValidateTicket(ValidateTicketRequest) returns (ValidateTicketResponse);

  // Previews a ticket.
  rpc PreviewTicket(PreviewTicketRequest) returns (PreviewTicketResponse);

  // Checks a ticket.
  rpc CheckTicketEligibility(CheckTicketEligibilityRequest) returns (CheckTicketEligibilityResponse);

  // Normalizes a ticket.
  rpc NormalizeTicket(NormalizeTicketRequest) returns (NormalizeTicketResponse);

  // Explains a ticket.
  rpc ExplainTicketDecision(ExplainTicketDecisionRequest) returns (ExplainTicketDecisionResponse);

  // Scores a ticket.
  rpc ScoreTicket(ScoreTicketRequest) returns (ScoreTicketResponse);

  // Lints a ticket.
  rpc LintTickets(LintTicketsRequest) returns (LintTicketsResponse);

  // Returns a ticket.
  rpc GetTicketRules(GetTicketRulesRequest) returns (GetTicketRulesResponse);
}

// The request of `ValidateTicket`.
message ValidateTicketRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_id = 2;
  Ticket ticket = 3;
  ValidateTicketRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTicket`.
message ValidateTicketResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Ticket ticket = 1;
  ValidateTicketResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

