syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "SlaPolicyCalculationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Computes the figures of a sla policy, such as totals, taxes, and estimates.
service SlaPolicyCalculationService {
  // Calculates a sla policy.
  rpc CalculateSlaPolicy(CalculateSlaPolicyRequest) returns (CalculateSlaPolicyResponse);

  // Estimates a sla policy.
  rpc EstimateSlaPolicy(EstimateSlaPolicyRequest) returns (EstimateSlaPolicyResponse);

  // Quotes a sla policy.
  rpc QuoteSlaPolicy(QuoteSlaPolicyRequest) returns (QuoteSlaPolicyResponse);

  // Compares a sla policy.
  rpc CompareSlaPolicyOptions(CompareSlaPolicyOptionsRequest) returns (CompareSlaPolicyOptionsResponse);

  // Simulates a sla policy.
  rpc SimulateSlaPolicy(SimulateSlaPolicyRequest) returns (SimulateSlaPolicyResponse);

  // Explains a sla policy.
  rpc ExplainSlaPolicyCalculation(ExplainSlaPolicyCalculationRequest) returns (ExplainSlaPolicyCalculationResponse);

  // Returns a sla policy.
  rpc GetSlaPolicyRates(GetSlaPolicyRatesRequest) returns (GetSlaPolicyRatesResponse);
}

// The request of `CalculateSlaPolicy`.
message CalculateSlaPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sla_policy_id = 2;
  SlaPolicy sla_policy = 3;
  CalculateSlaPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSlaPolicy`.
message CalculateSlaPolicyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSlaPolicyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SlaPolicy sla_policy = 1;
  CalculateSlaPolicyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

