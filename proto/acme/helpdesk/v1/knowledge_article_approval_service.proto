syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "KnowledgeArticleApprovalServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Routes knowledge articles through approval, with escalation and delegation.
service KnowledgeArticleApprovalService {
  // Submits a knowledge article.
  rpc SubmitKnowledgeArticle(SubmitKnowledgeArticleRequest) returns (SubmitKnowledgeArticleResponse);

  // Approves a knowledge article.
  rpc ApproveKnowledgeArticle(ApproveKnowledgeArticleRequest) returns (ApproveKnowledgeArticleResponse);

  // Escalates a knowledge article.
  rpc EscalateKnowledgeArticle(EscalateKnowledgeArticleRequest) returns (EscalateKnowledgeArticleResponse);

  // Lists knowledge articles a page at a time.
  rpc ListPendingKnowledgeArticles(ListPendingKnowledgeArticlesRequest) returns (ListPendingKnowledgeArticlesResponse);

  // Delegates a knowledge article.
  rpc DelegateKnowledgeArticleApproval(DelegateKnowledgeArticleApprovalRequest) returns (DelegateKnowledgeArticleApprovalResponse);

  // Recalls a knowledge article.
  rpc RecallKnowledgeArticle(RecallKnowledgeArticleRequest) returns (RecallKnowledgeArticleResponse);

  // Comments a knowledge article.
  rpc CommentKnowledgeArticleApproval(CommentKnowledgeArticleApprovalRequest) returns (CommentKnowledgeArticleApprovalResponse);
}

// The request of `SubmitKnowledgeArticle`.
message SubmitKnowledgeArticleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string knowledge_article_id = 2;
  KnowledgeArticle knowledge_article = 3;
  SubmitKnowledgeArticleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitKnowledgeArticle`.
message SubmitKnowledgeArticleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KnowledgeArticle knowledge_article = 1;
  SubmitKnowledgeArticleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

