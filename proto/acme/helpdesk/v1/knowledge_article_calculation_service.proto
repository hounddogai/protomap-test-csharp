syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "KnowledgeArticleCalculationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Computes the figures of a knowledge article, such as totals, taxes, and estimates.
service KnowledgeArticleCalculationService {
  // Calculates a knowledge article.
  rpc CalculateKnowledgeArticle(CalculateKnowledgeArticleRequest) returns (CalculateKnowledgeArticleResponse);

  // Estimates a knowledge article.
  rpc EstimateKnowledgeArticle(EstimateKnowledgeArticleRequest) returns (EstimateKnowledgeArticleResponse);

  // Quotes a knowledge article.
  rpc QuoteKnowledgeArticle(QuoteKnowledgeArticleRequest) returns (QuoteKnowledgeArticleResponse);

  // Compares a knowledge article.
  rpc CompareKnowledgeArticleOptions(CompareKnowledgeArticleOptionsRequest) returns (CompareKnowledgeArticleOptionsResponse);

  // Recalculates a knowledge article.
  rpc RecalculateKnowledgeArticles(RecalculateKnowledgeArticlesRequest) returns (RecalculateKnowledgeArticlesResponse);

  // Simulates a knowledge article.
  rpc SimulateKnowledgeArticle(SimulateKnowledgeArticleRequest) returns (SimulateKnowledgeArticleResponse);

  // Explains a knowledge article.
  rpc ExplainKnowledgeArticleCalculation(ExplainKnowledgeArticleCalculationRequest) returns (ExplainKnowledgeArticleCalculationResponse);
}

// The request of `CalculateKnowledgeArticle`.
message CalculateKnowledgeArticleRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string knowledge_article_id = 2;
  KnowledgeArticle knowledge_article = 3;
  CalculateKnowledgeArticleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateKnowledgeArticle`.
message CalculateKnowledgeArticleResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateKnowledgeArticleResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  KnowledgeArticle knowledge_article = 1;
  CalculateKnowledgeArticleResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

