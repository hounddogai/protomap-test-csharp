syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "TicketWorkflowServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Runs the long-lived workflow that takes a ticket from start to finish.
service TicketWorkflowService {
  // Starts a ticket.
  rpc StartTicketWorkflow(StartTicketWorkflowRequest) returns (StartTicketWorkflowResponse);

  // Advances a ticket.
  rpc AdvanceTicketWorkflow(AdvanceTicketWorkflowRequest) returns (AdvanceTicketWorkflowResponse);

  // Cancels a ticket.
  rpc CancelTicketWorkflow(CancelTicketWorkflowRequest) returns (CancelTicketWorkflowResponse);

  // Resumes a ticket.
  rpc ResumeTicketWorkflow(ResumeTicketWorkflowRequest) returns (ResumeTicketWorkflowResponse);

  // Returns a ticket.
  rpc InspectTicketWorkflow(InspectTicketWorkflowRequest) returns (InspectTicketWorkflowResponse);

  // Lists tickets a page at a time.
  rpc ListTicketWorkflows(ListTicketWorkflowsRequest) returns (ListTicketWorkflowsResponse);

  // Signals a ticket.
  rpc SignalTicketWorkflow(SignalTicketWorkflowRequest) returns (SignalTicketWorkflowResponse);
}

// The request of `StartTicketWorkflow`.
message StartTicketWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_id = 2;
  Ticket ticket = 3;
  StartTicketWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTicketWorkflow`.
message StartTicketWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Ticket ticket = 1;
  StartTicketWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

