syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "SlaPolicyWorkflowServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Runs the long-lived workflow that takes a sla policy from start to finish.
service SlaPolicyWorkflowService {
  // Starts a sla policy.
  rpc StartSlaPolicyWorkflow(StartSlaPolicyWorkflowRequest) returns (StartSlaPolicyWorkflowResponse);

  // Advances a sla policy.
  rpc AdvanceSlaPolicyWorkflow(AdvanceSlaPolicyWorkflowRequest) returns (AdvanceSlaPolicyWorkflowResponse);

  // Cancels a sla policy.
  rpc CancelSlaPolicyWorkflow(CancelSlaPolicyWorkflowRequest) returns (CancelSlaPolicyWorkflowResponse);

  // Retrys a sla policy.
  rpc RetrySlaPolicyWorkflow(RetrySlaPolicyWorkflowRequest) returns (RetrySlaPolicyWorkflowResponse);

  // Pauses a sla policy.
  rpc PauseSlaPolicyWorkflow(PauseSlaPolicyWorkflowRequest) returns (PauseSlaPolicyWorkflowResponse);

  // Resumes a sla policy.
  rpc ResumeSlaPolicyWorkflow(ResumeSlaPolicyWorkflowRequest) returns (ResumeSlaPolicyWorkflowResponse);

  // Returns a sla policy.
  rpc InspectSlaPolicyWorkflow(InspectSlaPolicyWorkflowRequest) returns (InspectSlaPolicyWorkflowResponse);

  // Lists sla policies a page at a time.
  rpc ListSlaPolicyWorkflows(ListSlaPolicyWorkflowsRequest) returns (ListSlaPolicyWorkflowsResponse);

  // Signals a sla policy.
  rpc SignalSlaPolicyWorkflow(SignalSlaPolicyWorkflowRequest) returns (SignalSlaPolicyWorkflowResponse);
}

// The request of `StartSlaPolicyWorkflow`.
message StartSlaPolicyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sla_policy_id = 2;
  SlaPolicy sla_policy = 3;
  StartSlaPolicyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSlaPolicyWorkflow`.
message StartSlaPolicyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SlaPolicy sla_policy = 1;
  StartSlaPolicyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

