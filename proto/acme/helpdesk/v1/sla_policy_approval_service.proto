syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "SlaPolicyApprovalServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Routes sla policies through approval, with escalation and delegation.
service SlaPolicyApprovalService {
  // Submits a sla policy.
  rpc SubmitSlaPolicy(SubmitSlaPolicyRequest) returns (SubmitSlaPolicyResponse);

  // Approves a sla policy.
  rpc ApproveSlaPolicy(ApproveSlaPolicyRequest) returns (ApproveSlaPolicyResponse);

  // Rejects a sla policy.
  rpc RejectSlaPolicy(RejectSlaPolicyRequest) returns (RejectSlaPolicyResponse);

  // Escalates a sla policy.
  rpc EscalateSlaPolicy(EscalateSlaPolicyRequest) returns (EscalateSlaPolicyResponse);

  // Lists sla policies a page at a time.
  rpc ListPendingSlaPolicies(ListPendingSlaPoliciesRequest) returns (ListPendingSlaPoliciesResponse);

  // Delegates a sla policy.
  rpc DelegateSlaPolicyApproval(DelegateSlaPolicyApprovalRequest) returns (DelegateSlaPolicyApprovalResponse);

  // Recalls a sla policy.
  rpc RecallSlaPolicy(RecallSlaPolicyRequest) returns (RecallSlaPolicyResponse);

  // Returns a sla policy.
  rpc GetSlaPolicyApprovalStatus(GetSlaPolicyApprovalStatusRequest) returns (GetSlaPolicyApprovalStatusResponse);

  // Comments a sla policy.
  rpc CommentSlaPolicyApproval(CommentSlaPolicyApprovalRequest) returns (CommentSlaPolicyApprovalResponse);
}

// The request of `SubmitSlaPolicy`.
message SubmitSlaPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sla_policy_id = 2;
  SlaPolicy sla_policy = 3;
  SubmitSlaPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSlaPolicy`.
message SubmitSlaPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SlaPolicy sla_policy = 1;
  SubmitSlaPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

