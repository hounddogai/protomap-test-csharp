syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "TicketApprovalServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Routes tickets through approval, with escalation and delegation.
service TicketApprovalService {
  // Submits a ticket.
  rpc SubmitTicket(SubmitTicketRequest) returns (SubmitTicketResponse);

  // Approves a ticket.
  rpc ApproveTicket(ApproveTicketRequest) returns (ApproveTicketResponse);

  // Rejects a ticket.
  rpc RejectTicket(RejectTicketRequest) returns (RejectTicketResponse);

  // Escalates a ticket.
  rpc EscalateTicket(EscalateTicketRequest) returns (EscalateTicketResponse);

  // Lists tickets a page at a time.
  rpc ListPendingTickets(ListPendingTicketsRequest) returns (ListPendingTicketsResponse);

  // Delegates a ticket.
  rpc DelegateTicketApproval(DelegateTicketApprovalRequest) returns (DelegateTicketApprovalResponse);

  // Recalls a ticket.
  rpc RecallTicket(RecallTicketRequest) returns (RecallTicketResponse);

  // Returns a ticket.
  rpc GetTicketApprovalStatus(GetTicketApprovalStatusRequest) returns (GetTicketApprovalStatusResponse);
}

// The request of `SubmitTicket`.
message SubmitTicketRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ticket_id = 2;
  Ticket ticket = 3;
  SubmitTicketRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTicket`.
message SubmitTicketResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Ticket ticket = 1;
  SubmitTicketResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

