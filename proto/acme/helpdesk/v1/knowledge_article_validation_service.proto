syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "KnowledgeArticleValidationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Checks knowledge articles against the rules before anything acts on them.
service KnowledgeArticleValidationService {
  // Validates a knowledge article.
  rpc ValidateKnowledgeArticle(ValidateKnowledgeArticleRequest) returns (ValidateKnowledgeArticleResponse);

  // Previews a knowledge article.
  rpc PreviewKnowledgeArticle(PreviewKnowledgeArticleRequest) returns (PreviewKnowledgeArticleResponse);

  // Checks a knowledge article.
  rpc CheckKnowledgeArticleEligibility(CheckKnowledgeArticleEligibilityRequest) returns (CheckKnowledgeArticleEligibilityResponse);

  // Normalizes a knowledge article.
  rpc NormalizeKnowledgeArticle(NormalizeKnowledgeArticleRequest) returns (NormalizeKnowledgeArticleResponse);

  // Explains a knowledge article.
  rpc ExplainKnowledgeArticleDecision(ExplainKnowledgeArticleDecisionRequest) returns (ExplainKnowledgeArticleDecisionResponse);

  // Scores a knowledge article.
  rpc ScoreKnowledgeArticle(ScoreKnowledgeArticleRequest) returns (ScoreKnowledgeArticleResponse);

  // Lints a knowledge article.
  rpc LintKnowledgeArticles(LintKnowledgeArticlesRequest) returns (LintKnowledgeArticlesResponse);

  // Returns a knowledge article.
  rpc GetKnowledgeArticleRules(GetKnowledgeArticleRulesRequest) returns (GetKnowledgeArticleRulesResponse);
}

// The request of `ValidateKnowledgeArticle`.
message ValidateKnowledgeArticleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string knowledge_article_id = 2;
  KnowledgeArticle knowledge_article = 3;
  ValidateKnowledgeArticleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateKnowledgeArticle`.
message ValidateKnowledgeArticleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KnowledgeArticle knowledge_article = 1;
  ValidateKnowledgeArticleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

