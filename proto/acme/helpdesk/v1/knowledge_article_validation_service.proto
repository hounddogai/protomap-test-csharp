// The request of `ScoreKnowledgeArticle`.
message ScoreKnowledgeArticleRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string knowledge_article_id = 2;
  KnowledgeArticle knowledge_article = 3;
  ScoreKnowledgeArticleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreKnowledgeArticle`.
message ScoreKnowledgeArticleResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreKnowledgeArticleResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  KnowledgeArticle knowledge_article = 1;
  ScoreKnowledgeArticleResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

