// The request of `InspectKnowledgeArticleWorkflow`.
message InspectKnowledgeArticleWorkflowRequest {
  acme.common.v1.RequestContext context = 1;
  string knowledge_article_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectKnowledgeArticleWorkflow`.
message InspectKnowledgeArticleWorkflowResponse {
  KnowledgeArticle knowledge_article = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListKnowledgeArticleWorkflows`.
message ListKnowledgeArticleWorkflowsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated KnowledgeArticleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListKnowledgeArticleWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListKnowledgeArticleWorkflows`.
message ListKnowledgeArticleWorkflowsResponse {
  repeated KnowledgeArticle knowledge_articles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

