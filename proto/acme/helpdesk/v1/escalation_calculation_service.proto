syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "EscalationCalculationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Computes the figures of an escalation, such as totals, taxes, and estimates.
service EscalationCalculationService {
  // Calculates an escalation.
  rpc CalculateEscalation(CalculateEscalationRequest) returns (CalculateEscalationResponse);

  // Estimates an escalation.
  rpc EstimateEscalation(EstimateEscalationRequest) returns (EstimateEscalationResponse);

  // Quotes an escalation.
  rpc QuoteEscalation(QuoteEscalationRequest) returns (QuoteEscalationResponse);

  // Compares an escalation.
  rpc CompareEscalationOptions(CompareEscalationOptionsRequest) returns (CompareEscalationOptionsResponse);

  // Recalculates an escalation.
  rpc RecalculateEscalations(RecalculateEscalationsRequest) returns (RecalculateEscalationsResponse);

  // Simulates an escalation.
  rpc SimulateEscalation(SimulateEscalationRequest) returns (SimulateEscalationResponse);

  // Explains an escalation.
  rpc ExplainEscalationCalculation(ExplainEscalationCalculationRequest) returns (ExplainEscalationCalculationResponse);

  // Returns an escalation.
  rpc GetEscalationRates(GetEscalationRatesRequest) returns (GetEscalationRatesResponse);
}

// The request of `CalculateEscalation`.
message CalculateEscalationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  Escalation escalation = 3;
  CalculateEscalationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateEscalation`.
message CalculateEscalationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateEscalationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Escalation escalation = 1;
  CalculateEscalationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

