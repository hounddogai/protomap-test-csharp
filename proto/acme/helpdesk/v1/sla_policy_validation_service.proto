syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "SlaPolicyValidationServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Checks sla policies against the rules before anything acts on them.
service SlaPolicyValidationService {
  // Validates a sla policy.
  rpc ValidateSlaPolicy(ValidateSlaPolicyRequest) returns (ValidateSlaPolicyResponse);

  // Previews a sla policy.
  rpc PreviewSlaPolicy(PreviewSlaPolicyRequest) returns (PreviewSlaPolicyResponse);

  // Checks a sla policy.
  rpc CheckSlaPolicyEligibility(CheckSlaPolicyEligibilityRequest) returns (CheckSlaPolicyEligibilityResponse);

  // Normalizes a sla policy.
  rpc NormalizeSlaPolicy(NormalizeSlaPolicyRequest) returns (NormalizeSlaPolicyResponse);

  // Explains a sla policy.
  rpc ExplainSlaPolicyDecision(ExplainSlaPolicyDecisionRequest) returns (ExplainSlaPolicyDecisionResponse);

  // Scores a sla policy.
  rpc ScoreSlaPolicy(ScoreSlaPolicyRequest) returns (ScoreSlaPolicyResponse);

  // Returns a sla policy.
  rpc GetSlaPolicyRules(GetSlaPolicyRulesRequest) returns (GetSlaPolicyRulesResponse);
}

// The request of `ValidateSlaPolicy`.
message ValidateSlaPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string sla_policy_id = 2;
  SlaPolicy sla_policy = 3;
  ValidateSlaPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSlaPolicy`.
message ValidateSlaPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SlaPolicy sla_policy = 1;
  ValidateSlaPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

