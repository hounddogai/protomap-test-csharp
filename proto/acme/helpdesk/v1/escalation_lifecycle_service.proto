syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "EscalationLifecycleServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Moves an escalation between the states of its lifecycle.
service EscalationLifecycleService {
  // Activates an escalation.
  rpc ActivateEscalation(ActivateEscalationRequest) returns (ActivateEscalationResponse);

  // Suspends an escalation.
  rpc SuspendEscalation(SuspendEscalationRequest) returns (SuspendEscalationResponse);

  // Terminates an escalation.
  rpc TerminateEscalation(TerminateEscalationRequest) returns (TerminateEscalationResponse);

  // Renews an escalation.
  rpc RenewEscalation(RenewEscalationRequest) returns (RenewEscalationResponse);

  // Expires an escalation.
  rpc ExpireEscalation(ExpireEscalationRequest) returns (ExpireEscalationResponse);

  // Schedules an escalation.
  rpc ScheduleEscalationExpiry(ScheduleEscalationExpiryRequest) returns (ScheduleEscalationExpiryResponse);
}

// The request of `ActivateEscalation`.
message ActivateEscalationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  ActivateEscalationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateEscalation`.
message ActivateEscalationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Escalation escalation = 1;
  ActivateEscalationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

