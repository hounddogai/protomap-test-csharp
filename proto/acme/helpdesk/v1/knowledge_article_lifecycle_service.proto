syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "KnowledgeArticleLifecycleServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Moves a knowledge article between the states of its lifecycle.
service KnowledgeArticleLifecycleService {
  // Activates a knowledge article.
  rpc ActivateKnowledgeArticle(ActivateKnowledgeArticleRequest) returns (ActivateKnowledgeArticleResponse);

  // Suspends a knowledge article.
  rpc SuspendKnowledgeArticle(SuspendKnowledgeArticleRequest) returns (SuspendKnowledgeArticleResponse);

  // Reinstates a knowledge article.
  rpc ReinstateKnowledgeArticle(ReinstateKnowledgeArticleRequest) returns (ReinstateKnowledgeArticleResponse);

  // Terminates a knowledge article.
  rpc TerminateKnowledgeArticle(TerminateKnowledgeArticleRequest) returns (TerminateKnowledgeArticleResponse);

  // Renews a knowledge article.
  rpc RenewKnowledgeArticle(RenewKnowledgeArticleRequest) returns (RenewKnowledgeArticleResponse);

  // Returns a knowledge article.
  rpc GetKnowledgeArticleLifecycle(GetKnowledgeArticleLifecycleRequest) returns (GetKnowledgeArticleLifecycleResponse);

  // Schedules a knowledge article.
  rpc ScheduleKnowledgeArticleExpiry(ScheduleKnowledgeArticleExpiryRequest) returns (ScheduleKnowledgeArticleExpiryResponse);
}

// The request of `ActivateKnowledgeArticle`.
message ActivateKnowledgeArticleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string knowledge_article_id = 2;
  ActivateKnowledgeArticleRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateKnowledgeArticle`.
message ActivateKnowledgeArticleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  KnowledgeArticle knowledge_article = 1;
  ActivateKnowledgeArticleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

