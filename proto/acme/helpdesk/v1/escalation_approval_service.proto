syntax = "proto3";

package acme.helpdesk.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/helpdesk/v1/helpdesk.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "EscalationApprovalServiceProto";
option java_package = "com.acme.helpdesk.v1";

// Routes escalations through approval, with escalation and delegation.
service EscalationApprovalService {
  // Submits an escalation.
  rpc SubmitEscalation(SubmitEscalationRequest) returns (SubmitEscalationResponse);

  // Approves an escalation.
  rpc ApproveEscalation(ApproveEscalationRequest) returns (ApproveEscalationResponse);

  // Rejects an escalation.
  rpc RejectEscalation(RejectEscalationRequest) returns (RejectEscalationResponse);

  // Escalates an escalation.
  rpc EscalateEscalation(EscalateEscalationRequest) returns (EscalateEscalationResponse);

  // Lists escalations a page at a time.
  rpc ListPendingEscalations(ListPendingEscalationsRequest) returns (ListPendingEscalationsResponse);

  // Delegates an escalation.
  rpc DelegateEscalationApproval(DelegateEscalationApprovalRequest) returns (DelegateEscalationApprovalResponse);

  // Recalls an escalation.
  rpc RecallEscalation(RecallEscalationRequest) returns (RecallEscalationResponse);

  // Comments an escalation.
  rpc CommentEscalationApproval(CommentEscalationApprovalRequest) returns (CommentEscalationApprovalResponse);
}

// The request of `SubmitEscalation`.
message SubmitEscalationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string escalation_id = 2;
  Escalation escalation = 3;
  SubmitEscalationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEscalation`.
message SubmitEscalationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Escalation escalation = 1;
  SubmitEscalationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

