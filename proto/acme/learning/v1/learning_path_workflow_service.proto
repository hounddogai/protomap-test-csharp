syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "LearningPathWorkflowServiceProto";
option java_package = "com.acme.learning.v1";

// Runs the long-lived workflow that takes a learning path from start to finish.
service LearningPathWorkflowService {
  // Starts a learning path.
  rpc StartLearningPathWorkflow(StartLearningPathWorkflowRequest) returns (StartLearningPathWorkflowResponse);

  // Advances a learning path.
  rpc AdvanceLearningPathWorkflow(AdvanceLearningPathWorkflowRequest) returns (AdvanceLearningPathWorkflowResponse);

  // Cancels a learning path.
  rpc CancelLearningPathWorkflow(CancelLearningPathWorkflowRequest) returns (CancelLearningPathWorkflowResponse);

  // Retrys a learning path.
  rpc RetryLearningPathWorkflow(RetryLearningPathWorkflowRequest) returns (RetryLearningPathWorkflowResponse);

  // Pauses a learning path.
  rpc PauseLearningPathWorkflow(PauseLearningPathWorkflowRequest) returns (PauseLearningPathWorkflowResponse);

  // Resumes a learning path.
  rpc ResumeLearningPathWorkflow(ResumeLearningPathWorkflowRequest) returns (ResumeLearningPathWorkflowResponse);

  // Returns a learning path.
  rpc InspectLearningPathWorkflow(InspectLearningPathWorkflowRequest) returns (InspectLearningPathWorkflowResponse);

  // Lists learning paths a page at a time.
  rpc ListLearningPathWorkflows(ListLearningPathWorkflowsRequest) returns (ListLearningPathWorkflowsResponse);
}

// The request of `StartLearningPathWorkflow`.
message StartLearningPathWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string learning_path_id = 2;
  LearningPath learning_path = 3;
  StartLearningPathWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLearningPathWorkflow`.
message StartLearningPathWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LearningPath learning_path = 1;
  StartLearningPathWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

