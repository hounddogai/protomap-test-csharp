syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CertificationValidationServiceProto";
option java_package = "com.acme.learning.v1";

// Checks certifications against the rules before anything acts on them.
service CertificationValidationService {
  // Validates a certification.
  rpc ValidateCertification(ValidateCertificationRequest) returns (ValidateCertificationResponse);

  // Previews a certification.
  rpc PreviewCertification(PreviewCertificationRequest) returns (PreviewCertificationResponse);

  // Checks a certification.
  rpc CheckCertificationEligibility(CheckCertificationEligibilityRequest) returns (CheckCertificationEligibilityResponse);

  // Normalizes a certification.
  rpc NormalizeCertification(NormalizeCertificationRequest) returns (NormalizeCertificationResponse);

  // Explains a certification.
  rpc ExplainCertificationDecision(ExplainCertificationDecisionRequest) returns (ExplainCertificationDecisionResponse);

  // Scores a certification.
  rpc ScoreCertification(ScoreCertificationRequest) returns (ScoreCertificationResponse);

  // Lints a certification.
  rpc LintCertifications(LintCertificationsRequest) returns (LintCertificationsResponse);

  // Returns a certification.
  rpc GetCertificationRules(GetCertificationRulesRequest) returns (GetCertificationRulesResponse);
}

// The request of `ValidateCertification`.
message ValidateCertificationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string certification_id = 2;
  Certification certification = 3;
  ValidateCertificationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCertification`.
message ValidateCertificationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Certification certification = 1;
  ValidateCertificationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

