syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CourseEnrollmentCalculationServiceProto";
option java_package = "com.acme.learning.v1";

// Computes the figures of a course enrollment, such as totals, taxes, and estimates.
service CourseEnrollmentCalculationService {
  // Calculates a course enrollment.
  rpc CalculateCourseEnrollment(CalculateCourseEnrollmentRequest) returns (CalculateCourseEnrollmentResponse);

  // Estimates a course enrollment.
  rpc EstimateCourseEnrollment(EstimateCourseEnrollmentRequest) returns (EstimateCourseEnrollmentResponse);

  // Quotes a course enrollment.
  rpc QuoteCourseEnrollment(QuoteCourseEnrollmentRequest) returns (QuoteCourseEnrollmentResponse);

  // Compares a course enrollment.
  rpc CompareCourseEnrollmentOptions(CompareCourseEnrollmentOptionsRequest) returns (CompareCourseEnrollmentOptionsResponse);

  // Recalculates a course enrollment.
  rpc RecalculateCourseEnrollments(RecalculateCourseEnrollmentsRequest) returns (RecalculateCourseEnrollmentsResponse);

  // Explains a course enrollment.
  rpc ExplainCourseEnrollmentCalculation(ExplainCourseEnrollmentCalculationRequest) returns (ExplainCourseEnrollmentCalculationResponse);

  // Returns a course enrollment.
  rpc GetCourseEnrollmentRates(GetCourseEnrollmentRatesRequest) returns (GetCourseEnrollmentRatesResponse);
}

// The request of `CalculateCourseEnrollment`.
message CalculateCourseEnrollmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string course_enrollment_id = 2;
  CourseEnrollment course_enrollment = 3;
  CalculateCourseEnrollmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCourseEnrollment`.
message CalculateCourseEnrollmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCourseEnrollmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CourseEnrollment course_enrollment = 1;
  CalculateCourseEnrollmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

