    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CourseEnrollment course_enrollment = 1;
  ExplainCourseEnrollmentCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetCourseEnrollmentRates`.
