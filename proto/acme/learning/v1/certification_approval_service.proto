syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CertificationApprovalServiceProto";
option java_package = "com.acme.learning.v1";

// Routes certifications through approval, with escalation and delegation.
service CertificationApprovalService {
  // Submits a certification.
  rpc SubmitCertification(SubmitCertificationRequest) returns (SubmitCertificationResponse);

  // Approves a certification.
  rpc ApproveCertification(ApproveCertificationRequest) returns (ApproveCertificationResponse);

  // Rejects a certification.
  rpc RejectCertification(RejectCertificationRequest) returns (RejectCertificationResponse);

  // Escalates a certification.
  rpc EscalateCertification(EscalateCertificationRequest) returns (EscalateCertificationResponse);

  // Lists certifications a page at a time.
  rpc ListPendingCertifications(ListPendingCertificationsRequest) returns (ListPendingCertificationsResponse);

  // Delegates a certification.
  rpc DelegateCertificationApproval(DelegateCertificationApprovalRequest) returns (DelegateCertificationApprovalResponse);

  // Recalls a certification.
  rpc RecallCertification(RecallCertificationRequest) returns (RecallCertificationResponse);

  // Returns a certification.
  rpc GetCertificationApprovalStatus(GetCertificationApprovalStatusRequest) returns (GetCertificationApprovalStatusResponse);

  // Comments a certification.
  rpc CommentCertificationApproval(CommentCertificationApprovalRequest) returns (CommentCertificationApprovalResponse);
}

// The request of `SubmitCertification`.
message SubmitCertificationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certification_id = 2;
  Certification certification = 3;
  SubmitCertificationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCertification`.
message SubmitCertificationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Certification certification = 1;
  SubmitCertificationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

