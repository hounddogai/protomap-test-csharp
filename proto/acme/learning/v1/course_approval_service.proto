syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CourseApprovalServiceProto";
option java_package = "com.acme.learning.v1";

// Routes courses through approval, with escalation and delegation.
service CourseApprovalService {
  // Submits a course.
  rpc SubmitCourse(SubmitCourseRequest) returns (SubmitCourseResponse);

  // Approves a course.
  rpc ApproveCourse(ApproveCourseRequest) returns (ApproveCourseResponse);

  // Rejects a course.
  rpc RejectCourse(RejectCourseRequest) returns (RejectCourseResponse);

  // Escalates a course.
  rpc EscalateCourse(EscalateCourseRequest) returns (EscalateCourseResponse);

  // Delegates a course.
  rpc DelegateCourseApproval(DelegateCourseApprovalRequest) returns (DelegateCourseApprovalResponse);

  // Recalls a course.
  rpc RecallCourse(RecallCourseRequest) returns (RecallCourseResponse);

  // Comments a course.
  rpc CommentCourseApproval(CommentCourseApprovalRequest) returns (CommentCourseApprovalResponse);
}

// The request of `SubmitCourse`.
message SubmitCourseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string course_id = 2;
  Course course = 3;
  SubmitCourseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCourse`.
message SubmitCourseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Course course = 1;
  SubmitCourseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

