syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CourseEnrollmentApprovalServiceProto";
option java_package = "com.acme.learning.v1";

// Routes course enrollments through approval, with escalation and delegation.
service CourseEnrollmentApprovalService {
  // Submits a course enrollment.
  rpc SubmitCourseEnrollment(SubmitCourseEnrollmentRequest) returns (SubmitCourseEnrollmentResponse);

  // Approves a course enrollment.
  rpc ApproveCourseEnrollment(ApproveCourseEnrollmentRequest) returns (ApproveCourseEnrollmentResponse);

  // Rejects a course enrollment.
  rpc RejectCourseEnrollment(RejectCourseEnrollmentRequest) returns (RejectCourseEnrollmentResponse);

  // Lists course enrollments a page at a time.
  rpc ListPendingCourseEnrollments(ListPendingCourseEnrollmentsRequest) returns (ListPendingCourseEnrollmentsResponse);

  // Delegates a course enrollment.
  rpc DelegateCourseEnrollmentApproval(DelegateCourseEnrollmentApprovalRequest) returns (DelegateCourseEnrollmentApprovalResponse);

  // Recalls a course enrollment.
  rpc RecallCourseEnrollment(RecallCourseEnrollmentRequest) returns (RecallCourseEnrollmentResponse);

  // Comments a course enrollment.
  rpc CommentCourseEnrollmentApproval(CommentCourseEnrollmentApprovalRequest) returns (CommentCourseEnrollmentApprovalResponse);
}

// The request of `SubmitCourseEnrollment`.
message SubmitCourseEnrollmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string course_enrollment_id = 2;
  CourseEnrollment course_enrollment = 3;
  SubmitCourseEnrollmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCourseEnrollment`.
message SubmitCourseEnrollmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CourseEnrollment course_enrollment = 1;
  SubmitCourseEnrollmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

