syntax = "proto3";

package acme.learning.v1;

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.learning.v1";

// A reference to a course of the learning domain.
message CourseRef {
  string course_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a learning path of the learning domain.
message LearningPathRef {
  string learning_path_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a certification of the learning domain.
message CertificationRef {
  string certification_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a course enrollment of the learning domain.
message CourseEnrollmentRef {
  string course_enrollment_id = 1;
  string display_name = 2;
  string currency_code = 3;
}
