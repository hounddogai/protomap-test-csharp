syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "LearningPathCalculationServiceProto";
option java_package = "com.acme.learning.v1";

// Computes the figures of a learning path, such as totals, taxes, and estimates.
service LearningPathCalculationService {
  // Calculates a learning path.
  rpc CalculateLearningPath(CalculateLearningPathRequest) returns (CalculateLearningPathResponse);

  // Estimates a learning path.
  rpc EstimateLearningPath(EstimateLearningPathRequest) returns (EstimateLearningPathResponse);

  // Compares a learning path.
  rpc CompareLearningPathOptions(CompareLearningPathOptionsRequest) returns (CompareLearningPathOptionsResponse);

  // Recalculates a learning path.
  rpc RecalculateLearningPaths(RecalculateLearningPathsRequest) returns (RecalculateLearningPathsResponse);

  // Simulates a learning path.
  rpc SimulateLearningPath(SimulateLearningPathRequest) returns (SimulateLearningPathResponse);

  // Explains a learning path.
  rpc ExplainLearningPathCalculation(ExplainLearningPathCalculationRequest) returns (ExplainLearningPathCalculationResponse);

  // Returns a learning path.
  rpc GetLearningPathRates(GetLearningPathRatesRequest) returns (GetLearningPathRatesResponse);
}

// The request of `CalculateLearningPath`.
message CalculateLearningPathRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string learning_path_id = 2;
  LearningPath learning_path = 3;
  CalculateLearningPathRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLearningPath`.
message CalculateLearningPathResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLearningPathResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LearningPath learning_path = 1;
  CalculateLearningPathResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

