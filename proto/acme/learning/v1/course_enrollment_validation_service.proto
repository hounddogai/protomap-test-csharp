syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CourseEnrollmentValidationServiceProto";
option java_package = "com.acme.learning.v1";

// Checks course enrollments against the rules before anything acts on them.
service CourseEnrollmentValidationService {
  // Validates a course enrollment.
  rpc ValidateCourseEnrollment(ValidateCourseEnrollmentRequest) returns (ValidateCourseEnrollmentResponse);

  // Previews a course enrollment.
  rpc PreviewCourseEnrollment(PreviewCourseEnrollmentRequest) returns (PreviewCourseEnrollmentResponse);

  // Checks a course enrollment.
  rpc CheckCourseEnrollmentEligibility(CheckCourseEnrollmentEligibilityRequest) returns (CheckCourseEnrollmentEligibilityResponse);

  // Normalizes a course enrollment.
  rpc NormalizeCourseEnrollment(NormalizeCourseEnrollmentRequest) returns (NormalizeCourseEnrollmentResponse);

  // Explains a course enrollment.
  rpc ExplainCourseEnrollmentDecision(ExplainCourseEnrollmentDecisionRequest) returns (ExplainCourseEnrollmentDecisionResponse);

  // Scores a course enrollment.
  rpc ScoreCourseEnrollment(ScoreCourseEnrollmentRequest) returns (ScoreCourseEnrollmentResponse);

  // Lints a course enrollment.
  rpc LintCourseEnrollments(LintCourseEnrollmentsRequest) returns (LintCourseEnrollmentsResponse);

  // Returns a course enrollment.
  rpc GetCourseEnrollmentRules(GetCourseEnrollmentRulesRequest) returns (GetCourseEnrollmentRulesResponse);
}

// The request of `ValidateCourseEnrollment`.
message ValidateCourseEnrollmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string course_enrollment_id = 2;
  CourseEnrollment course_enrollment = 3;
  ValidateCourseEnrollmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCourseEnrollment`.
message ValidateCourseEnrollmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CourseEnrollment course_enrollment = 1;
  ValidateCourseEnrollmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

