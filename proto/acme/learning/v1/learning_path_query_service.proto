syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "LearningPathQueryServiceProto";
option java_package = "com.acme.learning.v1";

// Answers read-only questions about learning paths, for screens and reports.
service LearningPathQueryService {
  // Returns a learning path.
  rpc LookupLearningPath(LookupLearningPathRequest) returns (LookupLearningPathResponse);

  // Lists learning paths a page at a time.
  rpc BrowseLearningPaths(BrowseLearningPathsRequest) returns (BrowseLearningPathsResponse);

  // Lists learning paths a page at a time.
  rpc FindLearningPaths(FindLearningPathsRequest) returns (FindLearningPathsResponse);

  // Returns several learning paths at once.
  rpc ResolveLearningPaths(ResolveLearningPathsRequest) returns (ResolveLearningPathsResponse);

  // Streams every matching learning path.
  rpc ExportLearningPaths(ExportLearningPathsRequest) returns (stream ExportLearningPathsResponse);

  // Summarizes a learning path.
  rpc SummarizeLearningPaths(SummarizeLearningPathsRequest) returns (SummarizeLearningPathsResponse);

  // Lists learning paths a page at a time.
  rpc SuggestLearningPaths(SuggestLearningPathsRequest) returns (SuggestLearningPathsResponse);
}

// The request of `LookupLearningPath`.
message LookupLearningPathRequest {
  acme.common.v1.RequestContext context = 1;
  string learning_path_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupLearningPath`.
message LookupLearningPathResponse {
  LearningPath learning_path = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseLearningPaths`.
message BrowseLearningPathsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LearningPathStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseLearningPathsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseLearningPaths`.
message BrowseLearningPathsResponse {
  repeated LearningPath learning_paths = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindLearningPaths`.
message FindLearningPathsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LearningPathStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindLearningPathsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindLearningPaths`.
message FindLearningPathsResponse {
  repeated LearningPath learning_paths = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveLearningPaths`.
message ResolveLearningPathsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string learning_path_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveLearningPaths`.
message ResolveLearningPathsResponse {
  repeated LearningPath learning_paths = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportLearningPaths`.
message ExportLearningPathsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LearningPathStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportLearningPathsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportLearningPaths`.
message ExportLearningPathsResponse {
  LearningPath learning_path = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeLearningPaths`.
message SummarizeLearningPathsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string learning_path_id = 2;
  SummarizeLearningPathsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeLearningPaths`.
message SummarizeLearningPathsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestLearningPaths`.
message SuggestLearningPathsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LearningPathStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestLearningPathsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestLearningPaths`.
message SuggestLearningPathsResponse {
  repeated LearningPath learning_paths = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
