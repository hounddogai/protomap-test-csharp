syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "LearningPathApprovalServiceProto";
option java_package = "com.acme.learning.v1";

// Routes learning paths through approval, with escalation and delegation.
service LearningPathApprovalService {
  // Submits a learning path.
  rpc SubmitLearningPath(SubmitLearningPathRequest) returns (SubmitLearningPathResponse);

  // Approves a learning path.
  rpc ApproveLearningPath(ApproveLearningPathRequest) returns (ApproveLearningPathResponse);

  // Rejects a learning path.
  rpc RejectLearningPath(RejectLearningPathRequest) returns (RejectLearningPathResponse);

  // Escalates a learning path.
  rpc EscalateLearningPath(EscalateLearningPathRequest) returns (EscalateLearningPathResponse);

  // Lists learning paths a page at a time.
  rpc ListPendingLearningPaths(ListPendingLearningPathsRequest) returns (ListPendingLearningPathsResponse);

  // Delegates a learning path.
  rpc DelegateLearningPathApproval(DelegateLearningPathApprovalRequest) returns (DelegateLearningPathApprovalResponse);

  // Recalls a learning path.
  rpc RecallLearningPath(RecallLearningPathRequest) returns (RecallLearningPathResponse);

  // Returns a learning path.
  rpc GetLearningPathApprovalStatus(GetLearningPathApprovalStatusRequest) returns (GetLearningPathApprovalStatusResponse);

  // Comments a learning path.
  rpc CommentLearningPathApproval(CommentLearningPathApprovalRequest) returns (CommentLearningPathApprovalResponse);
}

// The request of `SubmitLearningPath`.
message SubmitLearningPathRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string learning_path_id = 2;
  LearningPath learning_path = 3;
  SubmitLearningPathRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitLearningPath`.
message SubmitLearningPathResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LearningPath learning_path = 1;
  SubmitLearningPathResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

