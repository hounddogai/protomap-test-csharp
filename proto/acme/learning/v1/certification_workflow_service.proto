option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "CertificationWorkflowServiceProto";
option java_package = "com.acme.learning.v1";

// Runs the long-lived workflow that takes a certification from start to finish.
service CertificationWorkflowService {
  // Starts a certification.
  rpc StartCertificationWorkflow(StartCertificationWorkflowRequest) returns (StartCertificationWorkflowResponse);

  // Advances a certification.
  rpc AdvanceCertificationWorkflow(AdvanceCertificationWorkflowRequest) returns (AdvanceCertificationWorkflowResponse);

  // Cancels a certification.
  rpc CancelCertificationWorkflow(CancelCertificationWorkflowRequest) returns (CancelCertificationWorkflowResponse);

  // Retrys a certification.
  rpc RetryCertificationWorkflow(RetryCertificationWorkflowRequest) returns (RetryCertificationWorkflowResponse);

  // Pauses a certification.
  rpc PauseCertificationWorkflow(PauseCertificationWorkflowRequest) returns (PauseCertificationWorkflowResponse);

  // Resumes a certification.
  rpc ResumeCertificationWorkflow(ResumeCertificationWorkflowRequest) returns (ResumeCertificationWorkflowResponse);

  // Returns a certification.
  rpc InspectCertificationWorkflow(InspectCertificationWorkflowRequest) returns (InspectCertificationWorkflowResponse);

  // Lists certifications a page at a time.
  rpc ListCertificationWorkflows(ListCertificationWorkflowsRequest) returns (ListCertificationWorkflowsResponse);

  // Signals a certification.
  rpc SignalCertificationWorkflow(SignalCertificationWorkflowRequest) returns (SignalCertificationWorkflowResponse);
}

// The request of `StartCertificationWorkflow`.
message StartCertificationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certification_id = 2;
  Certification certification = 3;
  StartCertificationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCertificationWorkflow`.
message StartCertificationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Certification certification = 1;
  StartCertificationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

