syntax = "proto3";

package acme.learning.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/learning/v1/learning.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Learning.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/learning/v1;learningv1";
option java_multiple_files = true;
option java_outer_classname = "LearningPathValidationServiceProto";
option java_package = "com.acme.learning.v1";

// Checks learning paths against the rules before anything acts on them.
service LearningPathValidationService {
  // Validates a learning path.
  rpc ValidateLearningPath(ValidateLearningPathRequest) returns (ValidateLearningPathResponse);

  // Previews a learning path.
  rpc PreviewLearningPath(PreviewLearningPathRequest) returns (PreviewLearningPathResponse);

  // Checks a learning path.
  rpc CheckLearningPathEligibility(CheckLearningPathEligibilityRequest) returns (CheckLearningPathEligibilityResponse);

  // Normalizes a learning path.
  rpc NormalizeLearningPath(NormalizeLearningPathRequest) returns (NormalizeLearningPathResponse);

  // Scores a learning path.
  rpc ScoreLearningPath(ScoreLearningPathRequest) returns (ScoreLearningPathResponse);

  // Returns a learning path.
  rpc GetLearningPathRules(GetLearningPathRulesRequest) returns (GetLearningPathRulesResponse);
}

// The request of `ValidateLearningPath`.
message ValidateLearningPathRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string learning_path_id = 2;
  LearningPath learning_path = 3;
  ValidateLearningPathRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLearningPath`.
message ValidateLearningPathResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LearningPath learning_path = 1;
  ValidateLearningPathResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewLearningPath`.
message PreviewLearningPathRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
