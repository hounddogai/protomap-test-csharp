syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ChangeRequestValidationServiceProto";
option java_package = "com.acme.itsm.v1";

// Checks change requests against the rules before anything acts on them.
service ChangeRequestValidationService {
  // Validates a change request.
  rpc ValidateChangeRequest(ValidateChangeRequestRequest) returns (ValidateChangeRequestResponse);

  // Previews a change request.
  rpc PreviewChangeRequest(PreviewChangeRequestRequest) returns (PreviewChangeRequestResponse);

  // Checks a change request.
  rpc CheckChangeRequestEligibility(CheckChangeRequestEligibilityRequest) returns (CheckChangeRequestEligibilityResponse);

  // Normalizes a change request.
  rpc NormalizeChangeRequest(NormalizeChangeRequestRequest) returns (NormalizeChangeRequestResponse);

  // Explains a change request.
  rpc ExplainChangeRequestDecision(ExplainChangeRequestDecisionRequest) returns (ExplainChangeRequestDecisionResponse);

  // Scores a change request.
  rpc ScoreChangeRequest(ScoreChangeRequestRequest) returns (ScoreChangeRequestResponse);

  // Lints a change request.
  rpc LintChangeRequests(LintChangeRequestsRequest) returns (LintChangeRequestsResponse);

  // Returns a change request.
  rpc GetChangeRequestRules(GetChangeRequestRulesRequest) returns (GetChangeRequestRulesResponse);
}

// The request of `ValidateChangeRequest`.
message ValidateChangeRequestRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  ChangeRequest change_request = 3;
  ValidateChangeRequestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateChangeRequest`.
message ValidateChangeRequestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChangeRequest change_request = 1;
  ValidateChangeRequestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

