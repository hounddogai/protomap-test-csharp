syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ServiceAssetApprovalServiceProto";
option java_package = "com.acme.itsm.v1";

// Routes service assets through approval, with escalation and delegation.
service ServiceAssetApprovalService {
  // Submits a service asset.
  rpc SubmitServiceAsset(SubmitServiceAssetRequest) returns (SubmitServiceAssetResponse);

  // Approves a service asset.
  rpc ApproveServiceAsset(ApproveServiceAssetRequest) returns (ApproveServiceAssetResponse);

  // Rejects a service asset.
  rpc RejectServiceAsset(RejectServiceAssetRequest) returns (RejectServiceAssetResponse);

  // Escalates a service asset.
  rpc EscalateServiceAsset(EscalateServiceAssetRequest) returns (EscalateServiceAssetResponse);

  // Lists service assets a page at a time.
  rpc ListPendingServiceAssets(ListPendingServiceAssetsRequest) returns (ListPendingServiceAssetsResponse);

  // Delegates a service asset.
  rpc DelegateServiceAssetApproval(DelegateServiceAssetApprovalRequest) returns (DelegateServiceAssetApprovalResponse);

  // Comments a service asset.
  rpc CommentServiceAssetApproval(CommentServiceAssetApprovalRequest) returns (CommentServiceAssetApprovalResponse);
}

// The request of `SubmitServiceAsset`.
message SubmitServiceAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  ServiceAsset service_asset = 3;
  SubmitServiceAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitServiceAsset`.
message SubmitServiceAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceAsset service_asset = 1;
  SubmitServiceAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

