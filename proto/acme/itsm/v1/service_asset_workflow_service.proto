option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ServiceAssetWorkflowServiceProto";
option java_package = "com.acme.itsm.v1";

// Runs the long-lived workflow that takes a service asset from start to finish.
service ServiceAssetWorkflowService {
  // Starts a service asset.
  rpc StartServiceAssetWorkflow(StartServiceAssetWorkflowRequest) returns (StartServiceAssetWorkflowResponse);

  // Advances a service asset.
  rpc AdvanceServiceAssetWorkflow(AdvanceServiceAssetWorkflowRequest) returns (AdvanceServiceAssetWorkflowResponse);

  // Cancels a service asset.
  rpc CancelServiceAssetWorkflow(CancelServiceAssetWorkflowRequest) returns (CancelServiceAssetWorkflowResponse);

  // Retrys a service asset.
  rpc RetryServiceAssetWorkflow(RetryServiceAssetWorkflowRequest) returns (RetryServiceAssetWorkflowResponse);

  // Pauses a service asset.
  rpc PauseServiceAssetWorkflow(PauseServiceAssetWorkflowRequest) returns (PauseServiceAssetWorkflowResponse);

  // Resumes a service asset.
  rpc ResumeServiceAssetWorkflow(ResumeServiceAssetWorkflowRequest) returns (ResumeServiceAssetWorkflowResponse);

  // Returns a service asset.
  rpc InspectServiceAssetWorkflow(InspectServiceAssetWorkflowRequest) returns (InspectServiceAssetWorkflowResponse);

  // Lists service assets a page at a time.
  rpc ListServiceAssetWorkflows(ListServiceAssetWorkflowsRequest) returns (ListServiceAssetWorkflowsResponse);

  // Signals a service asset.
  rpc SignalServiceAssetWorkflow(SignalServiceAssetWorkflowRequest) returns (SignalServiceAssetWorkflowResponse);
}

// The request of `StartServiceAssetWorkflow`.
message StartServiceAssetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  ServiceAsset service_asset = 3;
  StartServiceAssetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartServiceAssetWorkflow`.
message StartServiceAssetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceAsset service_asset = 1;
  StartServiceAssetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

