syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ChangeRequestReportingServiceProto";
option java_package = "com.acme.itsm.v1";

// Builds and schedules reports about change requests.
service ChangeRequestReportingService {
  // Generates a change request.
  rpc GenerateChangeRequestReport(GenerateChangeRequestReportRequest) returns (GenerateChangeRequestReportResponse);

  // Returns a change request.
  rpc FetchChangeRequestReport(FetchChangeRequestReportRequest) returns (FetchChangeRequestReportResponse);

  // Schedules a change request.
  rpc ScheduleChangeRequestReport(ScheduleChangeRequestReportRequest) returns (ScheduleChangeRequestReportResponse);

  // Streams the changes of change requests as they happen.
  rpc StreamChangeRequestMetrics(StreamChangeRequestMetricsRequest) returns (stream StreamChangeRequestMetricsResponse);

  // Lists change requests a page at a time.
  rpc ListChangeRequestReports(ListChangeRequestReportsRequest) returns (ListChangeRequestReportsResponse);

  // Shares a change request.
  rpc ShareChangeRequestReport(ShareChangeRequestReportRequest) returns (ShareChangeRequestReportResponse);

  // Counts change requests by status.
  rpc CountChangeRequestTotals(CountChangeRequestTotalsRequest) returns (CountChangeRequestTotalsResponse);

  // Deletes a change request.
  rpc DeleteChangeRequestReport(DeleteChangeRequestReportRequest) returns (DeleteChangeRequestReportResponse);
}

// The request of `GenerateChangeRequestReport`.
message GenerateChangeRequestReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  GenerateChangeRequestReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateChangeRequestReport`.
message GenerateChangeRequestReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchChangeRequestReport`.
message FetchChangeRequestReportRequest {
  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchChangeRequestReport`.
message FetchChangeRequestReportResponse {
  ChangeRequest change_request = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleChangeRequestReport`.
message ScheduleChangeRequestReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  ScheduleChangeRequestReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleChangeRequestReport`.
message ScheduleChangeRequestReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamChangeRequestMetrics`.
message StreamChangeRequestMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChangeRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamChangeRequestMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamChangeRequestMetrics`.
message StreamChangeRequestMetricsResponse {
  ChangeRequest change_request = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListChangeRequestReports`.
message ListChangeRequestReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChangeRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListChangeRequestReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListChangeRequestReports`.
message ListChangeRequestReportsResponse {
  repeated ChangeRequest change_requests = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareChangeRequestReport`.
message ShareChangeRequestReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  ShareChangeRequestReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareChangeRequestReport`.
message ShareChangeRequestReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChangeRequest change_request = 1;
  ShareChangeRequestReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountChangeRequestTotals`.
message CountChangeRequestTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChangeRequestStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountChangeRequestTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountChangeRequestTotals`.
message CountChangeRequestTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteChangeRequestReport`.
message DeleteChangeRequestReportRequest {
  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteChangeRequestReport`.
message DeleteChangeRequestReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
