option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ChangeRequestWorkflowServiceProto";
option java_package = "com.acme.itsm.v1";

// Runs the long-lived workflow that takes a change request from start to finish.
service ChangeRequestWorkflowService {
  // Starts a change request.
  rpc StartChangeRequestWorkflow(StartChangeRequestWorkflowRequest) returns (StartChangeRequestWorkflowResponse);

  // Advances a change request.
  rpc AdvanceChangeRequestWorkflow(AdvanceChangeRequestWorkflowRequest) returns (AdvanceChangeRequestWorkflowResponse);

  // Cancels a change request.
  rpc CancelChangeRequestWorkflow(CancelChangeRequestWorkflowRequest) returns (CancelChangeRequestWorkflowResponse);

  // Retrys a change request.
  rpc RetryChangeRequestWorkflow(RetryChangeRequestWorkflowRequest) returns (RetryChangeRequestWorkflowResponse);

  // Pauses a change request.
  rpc PauseChangeRequestWorkflow(PauseChangeRequestWorkflowRequest) returns (PauseChangeRequestWorkflowResponse);

  // Resumes a change request.
  rpc ResumeChangeRequestWorkflow(ResumeChangeRequestWorkflowRequest) returns (ResumeChangeRequestWorkflowResponse);

  // Returns a change request.
  rpc InspectChangeRequestWorkflow(InspectChangeRequestWorkflowRequest) returns (InspectChangeRequestWorkflowResponse);

  // Lists change requests a page at a time.
  rpc ListChangeRequestWorkflows(ListChangeRequestWorkflowsRequest) returns (ListChangeRequestWorkflowsResponse);

  // Signals a change request.
  rpc SignalChangeRequestWorkflow(SignalChangeRequestWorkflowRequest) returns (SignalChangeRequestWorkflowResponse);
}

// The request of `StartChangeRequestWorkflow`.
message StartChangeRequestWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string change_request_id = 2;
  ChangeRequest change_request = 3;
  StartChangeRequestWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartChangeRequestWorkflow`.
message StartChangeRequestWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChangeRequest change_request = 1;
  StartChangeRequestWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

