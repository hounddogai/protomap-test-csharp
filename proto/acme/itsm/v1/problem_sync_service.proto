syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ProblemSyncServiceProto";
option java_package = "com.acme.itsm.v1";

// Keeps problems in step with the systems of record in other regions.
service ProblemSyncService {
  // Syncs a problem.
  rpc SyncProblems(SyncProblemsRequest) returns (SyncProblemsResponse);

  // Pushs a problem.
  rpc PushProblem(PushProblemRequest) returns (PushProblemResponse);

  // Pulls a problem.
  rpc PullProblems(PullProblemsRequest) returns (PullProblemsResponse);

  // Reconciles a problem.
  rpc ReconcileProblems(ReconcileProblemsRequest) returns (ReconcileProblemsResponse);

  // Exchanges changes of problems with a peer.
  rpc StreamProblemChanges(stream StreamProblemChangesRequest) returns (stream StreamProblemChangesResponse);

  // Resolves a problem.
  rpc ResolveProblemConflict(ResolveProblemConflictRequest) returns (ResolveProblemConflictResponse);

  // Returns a problem.
  rpc GetProblemSyncState(GetProblemSyncStateRequest) returns (GetProblemSyncStateResponse);

  // Lists problems a page at a time.
  rpc ListProblemConflicts(ListProblemConflictsRequest) returns (ListProblemConflictsResponse);
}

// The request of `SyncProblems`.
message SyncProblemsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string problem_id = 2;
  Problem problem = 3;
  SyncProblemsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncProblems`.
message SyncProblemsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Problem problem = 1;
  SyncProblemsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushProblem`.
message PushProblemRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
