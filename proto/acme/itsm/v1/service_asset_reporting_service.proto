syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ServiceAssetReportingServiceProto";
option java_package = "com.acme.itsm.v1";

// Builds and schedules reports about service assets.
service ServiceAssetReportingService {
  // Generates a service asset.
  rpc GenerateServiceAssetReport(GenerateServiceAssetReportRequest) returns (GenerateServiceAssetReportResponse);

  // Returns a service asset.
  rpc FetchServiceAssetReport(FetchServiceAssetReportRequest) returns (FetchServiceAssetReportResponse);

  // Schedules a service asset.
  rpc ScheduleServiceAssetReport(ScheduleServiceAssetReportRequest) returns (ScheduleServiceAssetReportResponse);

  // Streams the changes of service assets as they happen.
  rpc StreamServiceAssetMetrics(StreamServiceAssetMetricsRequest) returns (stream StreamServiceAssetMetricsResponse);

  // Lists service assets a page at a time.
  rpc ListServiceAssetReports(ListServiceAssetReportsRequest) returns (ListServiceAssetReportsResponse);

  // Shares a service asset.
  rpc ShareServiceAssetReport(ShareServiceAssetReportRequest) returns (ShareServiceAssetReportResponse);

  // Counts service assets by status.
  rpc CountServiceAssetTotals(CountServiceAssetTotalsRequest) returns (CountServiceAssetTotalsResponse);

  // Deletes a service asset.
  rpc DeleteServiceAssetReport(DeleteServiceAssetReportRequest) returns (DeleteServiceAssetReportResponse);
}

// The request of `GenerateServiceAssetReport`.
message GenerateServiceAssetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  GenerateServiceAssetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateServiceAssetReport`.
message GenerateServiceAssetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchServiceAssetReport`.
message FetchServiceAssetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchServiceAssetReport`.
message FetchServiceAssetReportResponse {
  ServiceAsset service_asset = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleServiceAssetReport`.
message ScheduleServiceAssetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  ScheduleServiceAssetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleServiceAssetReport`.
message ScheduleServiceAssetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamServiceAssetMetrics`.
message StreamServiceAssetMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamServiceAssetMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamServiceAssetMetrics`.
message StreamServiceAssetMetricsResponse {
  ServiceAsset service_asset = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListServiceAssetReports`.
message ListServiceAssetReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListServiceAssetReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListServiceAssetReports`.
message ListServiceAssetReportsResponse {
  repeated ServiceAsset service_assets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareServiceAssetReport`.
message ShareServiceAssetReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  ShareServiceAssetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareServiceAssetReport`.
message ShareServiceAssetReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceAsset service_asset = 1;
  ShareServiceAssetReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountServiceAssetTotals`.
message CountServiceAssetTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ServiceAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountServiceAssetTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountServiceAssetTotals`.
message CountServiceAssetTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteServiceAssetReport`.
message DeleteServiceAssetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteServiceAssetReport`.
message DeleteServiceAssetReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
