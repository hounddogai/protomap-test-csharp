syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ProblemApprovalServiceProto";
option java_package = "com.acme.itsm.v1";

// Routes problems through approval, with escalation and delegation.
service ProblemApprovalService {
  // Submits a problem.
  rpc SubmitProblem(SubmitProblemRequest) returns (SubmitProblemResponse);

  // Approves a problem.
  rpc ApproveProblem(ApproveProblemRequest) returns (ApproveProblemResponse);

  // Rejects a problem.
  rpc RejectProblem(RejectProblemRequest) returns (RejectProblemResponse);

  // Lists problems a page at a time.
  rpc ListPendingProblems(ListPendingProblemsRequest) returns (ListPendingProblemsResponse);

  // Delegates a problem.
  rpc DelegateProblemApproval(DelegateProblemApprovalRequest) returns (DelegateProblemApprovalResponse);

  // Recalls a problem.
  rpc RecallProblem(RecallProblemRequest) returns (RecallProblemResponse);

  // Returns a problem.
  rpc GetProblemApprovalStatus(GetProblemApprovalStatusRequest) returns (GetProblemApprovalStatusResponse);

  // Comments a problem.
  rpc CommentProblemApproval(CommentProblemApprovalRequest) returns (CommentProblemApprovalResponse);
}

// The request of `SubmitProblem`.
message SubmitProblemRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string problem_id = 2;
  Problem problem = 3;
  SubmitProblemRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitProblem`.
message SubmitProblemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Problem problem = 1;
  SubmitProblemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

