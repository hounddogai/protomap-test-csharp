syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "IncidentLifecycleServiceProto";
option java_package = "com.acme.itsm.v1";

// Moves an incident between the states of its lifecycle.
service IncidentLifecycleService {
  // Activates an incident.
  rpc ActivateIncident(ActivateIncidentRequest) returns (ActivateIncidentResponse);

  // Suspends an incident.
  rpc SuspendIncident(SuspendIncidentRequest) returns (SuspendIncidentResponse);

  // Reinstates an incident.
  rpc ReinstateIncident(ReinstateIncidentRequest) returns (ReinstateIncidentResponse);

  // Terminates an incident.
  rpc TerminateIncident(TerminateIncidentRequest) returns (TerminateIncidentResponse);

  // Renews an incident.
  rpc RenewIncident(RenewIncidentRequest) returns (RenewIncidentResponse);

  // Expires an incident.
  rpc ExpireIncident(ExpireIncidentRequest) returns (ExpireIncidentResponse);

  // Returns an incident.
  rpc GetIncidentLifecycle(GetIncidentLifecycleRequest) returns (GetIncidentLifecycleResponse);

  // Schedules an incident.
  rpc ScheduleIncidentExpiry(ScheduleIncidentExpiryRequest) returns (ScheduleIncidentExpiryResponse);
}

// The request of `ActivateIncident`.
message ActivateIncidentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  ActivateIncidentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateIncident`.
message ActivateIncidentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Incident incident = 1;
  ActivateIncidentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

