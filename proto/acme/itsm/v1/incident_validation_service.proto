syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "IncidentValidationServiceProto";
option java_package = "com.acme.itsm.v1";

// Checks incidents against the rules before anything acts on them.
service IncidentValidationService {
  // Validates an incident.
  rpc ValidateIncident(ValidateIncidentRequest) returns (ValidateIncidentResponse);

  // Previews an incident.
  rpc PreviewIncident(PreviewIncidentRequest) returns (PreviewIncidentResponse);

  // Checks an incident.
  rpc CheckIncidentEligibility(CheckIncidentEligibilityRequest) returns (CheckIncidentEligibilityResponse);

  // Normalizes an incident.
  rpc NormalizeIncident(NormalizeIncidentRequest) returns (NormalizeIncidentResponse);

  // Explains an incident.
  rpc ExplainIncidentDecision(ExplainIncidentDecisionRequest) returns (ExplainIncidentDecisionResponse);

  // Scores an incident.
  rpc ScoreIncident(ScoreIncidentRequest) returns (ScoreIncidentResponse);

  // Lints an incident.
  rpc LintIncidents(LintIncidentsRequest) returns (LintIncidentsResponse);

  // Returns an incident.
  rpc GetIncidentRules(GetIncidentRulesRequest) returns (GetIncidentRulesResponse);
}

// The request of `ValidateIncident`.
message ValidateIncidentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  Incident incident = 3;
  ValidateIncidentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateIncident`.
message ValidateIncidentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Incident incident = 1;
  ValidateIncidentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

