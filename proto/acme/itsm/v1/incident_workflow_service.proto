option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "IncidentWorkflowServiceProto";
option java_package = "com.acme.itsm.v1";

// Runs the long-lived workflow that takes an incident from start to finish.
service IncidentWorkflowService {
  // Starts an incident.
  rpc StartIncidentWorkflow(StartIncidentWorkflowRequest) returns (StartIncidentWorkflowResponse);

  // Advances an incident.
  rpc AdvanceIncidentWorkflow(AdvanceIncidentWorkflowRequest) returns (AdvanceIncidentWorkflowResponse);

  // Cancels an incident.
  rpc CancelIncidentWorkflow(CancelIncidentWorkflowRequest) returns (CancelIncidentWorkflowResponse);

  // Retrys an incident.
  rpc RetryIncidentWorkflow(RetryIncidentWorkflowRequest) returns (RetryIncidentWorkflowResponse);

  // Pauses an incident.
  rpc PauseIncidentWorkflow(PauseIncidentWorkflowRequest) returns (PauseIncidentWorkflowResponse);

  // Resumes an incident.
  rpc ResumeIncidentWorkflow(ResumeIncidentWorkflowRequest) returns (ResumeIncidentWorkflowResponse);

  // Returns an incident.
  rpc InspectIncidentWorkflow(InspectIncidentWorkflowRequest) returns (InspectIncidentWorkflowResponse);

  // Lists incidents a page at a time.
  rpc ListIncidentWorkflows(ListIncidentWorkflowsRequest) returns (ListIncidentWorkflowsResponse);

  // Signals an incident.
  rpc SignalIncidentWorkflow(SignalIncidentWorkflowRequest) returns (SignalIncidentWorkflowResponse);
}

// The request of `StartIncidentWorkflow`.
message StartIncidentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  Incident incident = 3;
  StartIncidentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartIncidentWorkflow`.
message StartIncidentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Incident incident = 1;
  StartIncidentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

