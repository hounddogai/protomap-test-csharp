syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ProblemValidationServiceProto";
option java_package = "com.acme.itsm.v1";

// Checks problems against the rules before anything acts on them.
service ProblemValidationService {
  // Validates a problem.
  rpc ValidateProblem(ValidateProblemRequest) returns (ValidateProblemResponse);

  // Previews a problem.
  rpc PreviewProblem(PreviewProblemRequest) returns (PreviewProblemResponse);

  // Checks a problem.
  rpc CheckProblemEligibility(CheckProblemEligibilityRequest) returns (CheckProblemEligibilityResponse);

  // Explains a problem.
  rpc ExplainProblemDecision(ExplainProblemDecisionRequest) returns (ExplainProblemDecisionResponse);

  // Scores a problem.
  rpc ScoreProblem(ScoreProblemRequest) returns (ScoreProblemResponse);

  // Lints a problem.
  rpc LintProblems(LintProblemsRequest) returns (LintProblemsResponse);

  // Returns a problem.
  rpc GetProblemRules(GetProblemRulesRequest) returns (GetProblemRulesResponse);
}

// The request of `ValidateProblem`.
message ValidateProblemRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string problem_id = 2;
  Problem problem = 3;
  ValidateProblemRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateProblem`.
message ValidateProblemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Problem problem = 1;
  ValidateProblemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

