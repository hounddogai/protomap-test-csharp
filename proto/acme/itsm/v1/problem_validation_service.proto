// The request of `GetProblemRules`.
message GetProblemRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string problem_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetProblemRules`.
message GetProblemRulesResponse {
