syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ServiceAssetValidationServiceProto";
option java_package = "com.acme.itsm.v1";

// Checks service assets against the rules before anything acts on them.
service ServiceAssetValidationService {
  // Validates a service asset.
  rpc ValidateServiceAsset(ValidateServiceAssetRequest) returns (ValidateServiceAssetResponse);

  // Previews a service asset.
  rpc PreviewServiceAsset(PreviewServiceAssetRequest) returns (PreviewServiceAssetResponse);

  // Checks a service asset.
  rpc CheckServiceAssetEligibility(CheckServiceAssetEligibilityRequest) returns (CheckServiceAssetEligibilityResponse);

  // Normalizes a service asset.
  rpc NormalizeServiceAsset(NormalizeServiceAssetRequest) returns (NormalizeServiceAssetResponse);

  // Explains a service asset.
  rpc ExplainServiceAssetDecision(ExplainServiceAssetDecisionRequest) returns (ExplainServiceAssetDecisionResponse);

  // Scores a service asset.
  rpc ScoreServiceAsset(ScoreServiceAssetRequest) returns (ScoreServiceAssetResponse);

  // Lints a service asset.
  rpc LintServiceAssets(LintServiceAssetsRequest) returns (LintServiceAssetsResponse);
}

// The request of `ValidateServiceAsset`.
message ValidateServiceAssetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string service_asset_id = 2;
  ServiceAsset service_asset = 3;
  ValidateServiceAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateServiceAsset`.
message ValidateServiceAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ServiceAsset service_asset = 1;
  ValidateServiceAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

