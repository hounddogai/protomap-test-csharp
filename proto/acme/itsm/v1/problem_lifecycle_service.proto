syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "ProblemLifecycleServiceProto";
option java_package = "com.acme.itsm.v1";

// Moves a problem between the states of its lifecycle.
service ProblemLifecycleService {
  // Activates a problem.
  rpc ActivateProblem(ActivateProblemRequest) returns (ActivateProblemResponse);

  // Suspends a problem.
  rpc SuspendProblem(SuspendProblemRequest) returns (SuspendProblemResponse);

  // Reinstates a problem.
  rpc ReinstateProblem(ReinstateProblemRequest) returns (ReinstateProblemResponse);

  // Terminates a problem.
  rpc TerminateProblem(TerminateProblemRequest) returns (TerminateProblemResponse);

  // Renews a problem.
  rpc RenewProblem(RenewProblemRequest) returns (RenewProblemResponse);

  // Expires a problem.
  rpc ExpireProblem(ExpireProblemRequest) returns (ExpireProblemResponse);

  // Returns a problem.
  rpc GetProblemLifecycle(GetProblemLifecycleRequest) returns (GetProblemLifecycleResponse);

  // Schedules a problem.
  rpc ScheduleProblemExpiry(ScheduleProblemExpiryRequest) returns (ScheduleProblemExpiryResponse);
}

// The request of `ActivateProblem`.
message ActivateProblemRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string problem_id = 2;
  ActivateProblemRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateProblem`.
message ActivateProblemResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Problem problem = 1;
  ActivateProblemResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

