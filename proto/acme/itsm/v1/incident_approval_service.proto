syntax = "proto3";

package acme.itsm.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/itsm/v1/itsm.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Itsm.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/itsm/v1;itsmv1";
option java_multiple_files = true;
option java_outer_classname = "IncidentApprovalServiceProto";
option java_package = "com.acme.itsm.v1";

// Routes incidents through approval, with escalation and delegation.
service IncidentApprovalService {
  // Submits an incident.
  rpc SubmitIncident(SubmitIncidentRequest) returns (SubmitIncidentResponse);

  // Approves an incident.
  rpc ApproveIncident(ApproveIncidentRequest) returns (ApproveIncidentResponse);

  // Rejects an incident.
  rpc RejectIncident(RejectIncidentRequest) returns (RejectIncidentResponse);

  // Escalates an incident.
  rpc EscalateIncident(EscalateIncidentRequest) returns (EscalateIncidentResponse);

  // Lists incidents a page at a time.
  rpc ListPendingIncidents(ListPendingIncidentsRequest) returns (ListPendingIncidentsResponse);

  // Delegates an incident.
  rpc DelegateIncidentApproval(DelegateIncidentApprovalRequest) returns (DelegateIncidentApprovalResponse);

  // Recalls an incident.
  rpc RecallIncident(RecallIncidentRequest) returns (RecallIncidentResponse);

  // Returns an incident.
  rpc GetIncidentApprovalStatus(GetIncidentApprovalStatusRequest) returns (GetIncidentApprovalStatusResponse);

  // Comments an incident.
  rpc CommentIncidentApproval(CommentIncidentApprovalRequest) returns (CommentIncidentApprovalResponse);
}

// The request of `SubmitIncident`.
message SubmitIncidentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string incident_id = 2;
  Incident incident = 3;
  SubmitIncidentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitIncident`.
message SubmitIncidentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Incident incident = 1;
  SubmitIncidentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

