syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "BuildingLifecycleServiceProto";
option java_package = "com.acme.workplaces.v1";

// Moves a building between the states of its lifecycle.
service BuildingLifecycleService {
  // Activates a building.
  rpc ActivateBuilding(ActivateBuildingRequest) returns (ActivateBuildingResponse);

  // Suspends a building.
  rpc SuspendBuilding(SuspendBuildingRequest) returns (SuspendBuildingResponse);

  // Reinstates a building.
  rpc ReinstateBuilding(ReinstateBuildingRequest) returns (ReinstateBuildingResponse);

  // Terminates a building.
  rpc TerminateBuilding(TerminateBuildingRequest) returns (TerminateBuildingResponse);

  // Renews a building.
  rpc RenewBuilding(RenewBuildingRequest) returns (RenewBuildingResponse);

  // Expires a building.
  rpc ExpireBuilding(ExpireBuildingRequest) returns (ExpireBuildingResponse);

  // Returns a building.
  rpc GetBuildingLifecycle(GetBuildingLifecycleRequest) returns (GetBuildingLifecycleResponse);

  // Schedules a building.
  rpc ScheduleBuildingExpiry(ScheduleBuildingExpiryRequest) returns (ScheduleBuildingExpiryResponse);
}

// The request of `ActivateBuilding`.
message ActivateBuildingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  ActivateBuildingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateBuilding`.
message ActivateBuildingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  ActivateBuildingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

