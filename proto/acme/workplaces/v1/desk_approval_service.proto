syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "DeskApprovalServiceProto";
option java_package = "com.acme.workplaces.v1";

// Routes desks through approval, with escalation and delegation.
service DeskApprovalService {
  // Submits a desk.
  rpc SubmitDesk(SubmitDeskRequest) returns (SubmitDeskResponse);

  // Approves a desk.
  rpc ApproveDesk(ApproveDeskRequest) returns (ApproveDeskResponse);

  // Rejects a desk.
  rpc RejectDesk(RejectDeskRequest) returns (RejectDeskResponse);

  // Delegates a desk.
  rpc DelegateDeskApproval(DelegateDeskApprovalRequest) returns (DelegateDeskApprovalResponse);

  // Recalls a desk.
  rpc RecallDesk(RecallDeskRequest) returns (RecallDeskResponse);

  // Returns a desk.
  rpc GetDeskApprovalStatus(GetDeskApprovalStatusRequest) returns (GetDeskApprovalStatusResponse);

  // Comments a desk.
  rpc CommentDeskApproval(CommentDeskApprovalRequest) returns (CommentDeskApprovalResponse);
}

// The request of `SubmitDesk`.
message SubmitDeskRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  Desk desk = 3;
  SubmitDeskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDesk`.
message SubmitDeskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Desk desk = 1;
  SubmitDeskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

