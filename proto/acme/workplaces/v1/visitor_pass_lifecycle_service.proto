option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "VisitorPassLifecycleServiceProto";
option java_package = "com.acme.workplaces.v1";

// Moves a visitor pass between the states of its lifecycle.
service VisitorPassLifecycleService {
  // Activates a visitor pass.
  rpc ActivateVisitorPass(ActivateVisitorPassRequest) returns (ActivateVisitorPassResponse);

  // Suspends a visitor pass.
  rpc SuspendVisitorPass(SuspendVisitorPassRequest) returns (SuspendVisitorPassResponse);

  // Reinstates a visitor pass.
  rpc ReinstateVisitorPass(ReinstateVisitorPassRequest) returns (ReinstateVisitorPassResponse);

  // Terminates a visitor pass.
  rpc TerminateVisitorPass(TerminateVisitorPassRequest) returns (TerminateVisitorPassResponse);

  // Renews a visitor pass.
  rpc RenewVisitorPass(RenewVisitorPassRequest) returns (RenewVisitorPassResponse);

  // Expires a visitor pass.
  rpc ExpireVisitorPass(ExpireVisitorPassRequest) returns (ExpireVisitorPassResponse);

  // Returns a visitor pass.
  rpc GetVisitorPassLifecycle(GetVisitorPassLifecycleRequest) returns (GetVisitorPassLifecycleResponse);

  // Schedules a visitor pass.
  rpc ScheduleVisitorPassExpiry(ScheduleVisitorPassExpiryRequest) returns (ScheduleVisitorPassExpiryResponse);
}

// The request of `ActivateVisitorPass`.
message ActivateVisitorPassRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  ActivateVisitorPassRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateVisitorPass`.
message ActivateVisitorPassResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitorPass visitor_pass = 1;
  ActivateVisitorPassResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

