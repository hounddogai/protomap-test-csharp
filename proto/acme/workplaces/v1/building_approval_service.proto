syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "BuildingApprovalServiceProto";
option java_package = "com.acme.workplaces.v1";

// Routes buildings through approval, with escalation and delegation.
service BuildingApprovalService {
  // Submits a building.
  rpc SubmitBuilding(SubmitBuildingRequest) returns (SubmitBuildingResponse);

  // Approves a building.
  rpc ApproveBuilding(ApproveBuildingRequest) returns (ApproveBuildingResponse);

  // Lists buildings a page at a time.
  rpc ListPendingBuildings(ListPendingBuildingsRequest) returns (ListPendingBuildingsResponse);

  // Delegates a building.
  rpc DelegateBuildingApproval(DelegateBuildingApprovalRequest) returns (DelegateBuildingApprovalResponse);

  // Returns a building.
  rpc GetBuildingApprovalStatus(GetBuildingApprovalStatusRequest) returns (GetBuildingApprovalStatusResponse);

  // Comments a building.
  rpc CommentBuildingApproval(CommentBuildingApprovalRequest) returns (CommentBuildingApprovalResponse);
}

// The request of `SubmitBuilding`.
message SubmitBuildingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  SubmitBuildingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBuilding`.
message SubmitBuildingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  SubmitBuildingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveBuilding`.
message ApproveBuildingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  ApproveBuildingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveBuilding`.
message ApproveBuildingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  ApproveBuildingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingBuildings`.
message ListPendingBuildingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BuildingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingBuildingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingBuildings`.
message ListPendingBuildingsResponse {
  repeated Building buildings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DelegateBuildingApproval`.
message DelegateBuildingApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  DelegateBuildingApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `DelegateBuildingApproval`.
message DelegateBuildingApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  DelegateBuildingApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetBuildingApprovalStatus`.
message GetBuildingApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetBuildingApprovalStatus`.
message GetBuildingApprovalStatusResponse {
  Building building = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CommentBuildingApproval`.
message CommentBuildingApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  CommentBuildingApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CommentBuildingApproval`.
message CommentBuildingApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  CommentBuildingApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
