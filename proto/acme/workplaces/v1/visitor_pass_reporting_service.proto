syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "VisitorPassReportingServiceProto";
option java_package = "com.acme.workplaces.v1";

// Builds and schedules reports about visitor passes.
service VisitorPassReportingService {
  // Generates a visitor pass.
  rpc GenerateVisitorPassReport(GenerateVisitorPassReportRequest) returns (GenerateVisitorPassReportResponse);

  // Returns a visitor pass.
  rpc FetchVisitorPassReport(FetchVisitorPassReportRequest) returns (FetchVisitorPassReportResponse);

  // Schedules a visitor pass.
  rpc ScheduleVisitorPassReport(ScheduleVisitorPassReportRequest) returns (ScheduleVisitorPassReportResponse);

  // Streams the changes of visitor passes as they happen.
  rpc StreamVisitorPassMetrics(StreamVisitorPassMetricsRequest) returns (stream StreamVisitorPassMetricsResponse);

  // Lists visitor passes a page at a time.
  rpc ListVisitorPassReports(ListVisitorPassReportsRequest) returns (ListVisitorPassReportsResponse);

  // Shares a visitor pass.
  rpc ShareVisitorPassReport(ShareVisitorPassReportRequest) returns (ShareVisitorPassReportResponse);

  // Counts visitor passes by status.
  rpc CountVisitorPassTotals(CountVisitorPassTotalsRequest) returns (CountVisitorPassTotalsResponse);

  // Deletes a visitor pass.
  rpc DeleteVisitorPassReport(DeleteVisitorPassReportRequest) returns (DeleteVisitorPassReportResponse);
}

// The request of `GenerateVisitorPassReport`.
message GenerateVisitorPassReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  GenerateVisitorPassReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateVisitorPassReport`.
message GenerateVisitorPassReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchVisitorPassReport`.
message FetchVisitorPassReportRequest {
  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchVisitorPassReport`.
message FetchVisitorPassReportResponse {
  VisitorPass visitor_pass = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleVisitorPassReport`.
message ScheduleVisitorPassReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  ScheduleVisitorPassReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVisitorPassReport`.
message ScheduleVisitorPassReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamVisitorPassMetrics`.
message StreamVisitorPassMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VisitorPassStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVisitorPassMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamVisitorPassMetrics`.
message StreamVisitorPassMetricsResponse {
  VisitorPass visitor_pass = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListVisitorPassReports`.
message ListVisitorPassReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VisitorPassStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVisitorPassReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVisitorPassReports`.
message ListVisitorPassReportsResponse {
  repeated VisitorPass visitor_passes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareVisitorPassReport`.
message ShareVisitorPassReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  ShareVisitorPassReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareVisitorPassReport`.
message ShareVisitorPassReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitorPass visitor_pass = 1;
  ShareVisitorPassReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountVisitorPassTotals`.
message CountVisitorPassTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VisitorPassStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountVisitorPassTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountVisitorPassTotals`.
message CountVisitorPassTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteVisitorPassReport`.
message DeleteVisitorPassReportRequest {
  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteVisitorPassReport`.
message DeleteVisitorPassReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
