syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RoomBookingApprovalServiceProto";
option java_package = "com.acme.workplaces.v1";

// Routes room bookings through approval, with escalation and delegation.
service RoomBookingApprovalService {
  // Submits a room booking.
  rpc SubmitRoomBooking(SubmitRoomBookingRequest) returns (SubmitRoomBookingResponse);

  // Approves a room booking.
  rpc ApproveRoomBooking(ApproveRoomBookingRequest) returns (ApproveRoomBookingResponse);

  // Escalates a room booking.
  rpc EscalateRoomBooking(EscalateRoomBookingRequest) returns (EscalateRoomBookingResponse);

  // Lists room bookings a page at a time.
  rpc ListPendingRoomBookings(ListPendingRoomBookingsRequest) returns (ListPendingRoomBookingsResponse);

  // Delegates a room booking.
  rpc DelegateRoomBookingApproval(DelegateRoomBookingApprovalRequest) returns (DelegateRoomBookingApprovalResponse);

  // Recalls a room booking.
  rpc RecallRoomBooking(RecallRoomBookingRequest) returns (RecallRoomBookingResponse);

  // Returns a room booking.
  rpc GetRoomBookingApprovalStatus(GetRoomBookingApprovalStatusRequest) returns (GetRoomBookingApprovalStatusResponse);

  // Comments a room booking.
  rpc CommentRoomBookingApproval(CommentRoomBookingApprovalRequest) returns (CommentRoomBookingApprovalResponse);
}

// The request of `SubmitRoomBooking`.
message SubmitRoomBookingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  RoomBooking room_booking = 3;
  SubmitRoomBookingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRoomBooking`.
message SubmitRoomBookingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoomBooking room_booking = 1;
  SubmitRoomBookingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

