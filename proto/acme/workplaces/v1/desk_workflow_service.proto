option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "DeskWorkflowServiceProto";
option java_package = "com.acme.workplaces.v1";

// Runs the long-lived workflow that takes a desk from start to finish.
service DeskWorkflowService {
  // Starts a desk.
  rpc StartDeskWorkflow(StartDeskWorkflowRequest) returns (StartDeskWorkflowResponse);

  // Advances a desk.
  rpc AdvanceDeskWorkflow(AdvanceDeskWorkflowRequest) returns (AdvanceDeskWorkflowResponse);

  // Cancels a desk.
  rpc CancelDeskWorkflow(CancelDeskWorkflowRequest) returns (CancelDeskWorkflowResponse);

  // Retrys a desk.
  rpc RetryDeskWorkflow(RetryDeskWorkflowRequest) returns (RetryDeskWorkflowResponse);

  // Pauses a desk.
  rpc PauseDeskWorkflow(PauseDeskWorkflowRequest) returns (PauseDeskWorkflowResponse);

  // Resumes a desk.
  rpc ResumeDeskWorkflow(ResumeDeskWorkflowRequest) returns (ResumeDeskWorkflowResponse);

  // Returns a desk.
  rpc InspectDeskWorkflow(InspectDeskWorkflowRequest) returns (InspectDeskWorkflowResponse);

  // Lists desks a page at a time.
  rpc ListDeskWorkflows(ListDeskWorkflowsRequest) returns (ListDeskWorkflowsResponse);

  // Signals a desk.
  rpc SignalDeskWorkflow(SignalDeskWorkflowRequest) returns (SignalDeskWorkflowResponse);
}

// The request of `StartDeskWorkflow`.
message StartDeskWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  Desk desk = 3;
  StartDeskWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDeskWorkflow`.
message StartDeskWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Desk desk = 1;
  StartDeskWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

