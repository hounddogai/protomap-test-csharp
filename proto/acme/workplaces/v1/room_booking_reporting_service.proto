syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RoomBookingReportingServiceProto";
option java_package = "com.acme.workplaces.v1";

// Builds and schedules reports about room bookings.
service RoomBookingReportingService {
  // Generates a room booking.
  rpc GenerateRoomBookingReport(GenerateRoomBookingReportRequest) returns (GenerateRoomBookingReportResponse);

  // Returns a room booking.
  rpc FetchRoomBookingReport(FetchRoomBookingReportRequest) returns (FetchRoomBookingReportResponse);

  // Schedules a room booking.
  rpc ScheduleRoomBookingReport(ScheduleRoomBookingReportRequest) returns (ScheduleRoomBookingReportResponse);

  // Streams the changes of room bookings as they happen.
  rpc StreamRoomBookingMetrics(StreamRoomBookingMetricsRequest) returns (stream StreamRoomBookingMetricsResponse);

  // Lists room bookings a page at a time.
  rpc ListRoomBookingReports(ListRoomBookingReportsRequest) returns (ListRoomBookingReportsResponse);

  // Shares a room booking.
  rpc ShareRoomBookingReport(ShareRoomBookingReportRequest) returns (ShareRoomBookingReportResponse);

  // Counts room bookings by status.
  rpc CountRoomBookingTotals(CountRoomBookingTotalsRequest) returns (CountRoomBookingTotalsResponse);
}

// The request of `GenerateRoomBookingReport`.
message GenerateRoomBookingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  GenerateRoomBookingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRoomBookingReport`.
message GenerateRoomBookingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRoomBookingReport`.
message FetchRoomBookingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRoomBookingReport`.
message FetchRoomBookingReportResponse {
  RoomBooking room_booking = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleRoomBookingReport`.
message ScheduleRoomBookingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  ScheduleRoomBookingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRoomBookingReport`.
message ScheduleRoomBookingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamRoomBookingMetrics`.
message StreamRoomBookingMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoomBookingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRoomBookingMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRoomBookingMetrics`.
message StreamRoomBookingMetricsResponse {
  RoomBooking room_booking = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRoomBookingReports`.
message ListRoomBookingReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoomBookingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRoomBookingReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRoomBookingReports`.
message ListRoomBookingReportsResponse {
  repeated RoomBooking room_bookings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRoomBookingReport`.
message ShareRoomBookingReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  ShareRoomBookingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRoomBookingReport`.
message ShareRoomBookingReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoomBooking room_booking = 1;
  ShareRoomBookingReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRoomBookingTotals`.
message CountRoomBookingTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RoomBookingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRoomBookingTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRoomBookingTotals`.
message CountRoomBookingTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
