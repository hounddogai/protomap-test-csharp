syntax = "proto3";

package acme.workplaces.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.workplaces.v1";

// A reference to a building of the workplaces domain.
message BuildingRef {
  string building_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a desk of the workplaces domain.
message DeskRef {
  string desk_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a room booking of the workplaces domain.
message RoomBookingRef {
  string room_booking_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a visitor pass of the workplaces domain.
message VisitorPassRef {
  string visitor_pass_id = 1;
  string display_name = 2;
  string number = 3;
}
