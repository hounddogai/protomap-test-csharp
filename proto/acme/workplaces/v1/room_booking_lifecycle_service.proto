option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RoomBookingLifecycleServiceProto";
option java_package = "com.acme.workplaces.v1";

// Moves a room booking between the states of its lifecycle.
service RoomBookingLifecycleService {
  // Activates a room booking.
  rpc ActivateRoomBooking(ActivateRoomBookingRequest) returns (ActivateRoomBookingResponse);

  // Suspends a room booking.
  rpc SuspendRoomBooking(SuspendRoomBookingRequest) returns (SuspendRoomBookingResponse);

  // Reinstates a room booking.
  rpc ReinstateRoomBooking(ReinstateRoomBookingRequest) returns (ReinstateRoomBookingResponse);

  // Terminates a room booking.
  rpc TerminateRoomBooking(TerminateRoomBookingRequest) returns (TerminateRoomBookingResponse);

  // Renews a room booking.
  rpc RenewRoomBooking(RenewRoomBookingRequest) returns (RenewRoomBookingResponse);

  // Expires a room booking.
  rpc ExpireRoomBooking(ExpireRoomBookingRequest) returns (ExpireRoomBookingResponse);

  // Returns a room booking.
  rpc GetRoomBookingLifecycle(GetRoomBookingLifecycleRequest) returns (GetRoomBookingLifecycleResponse);

  // Schedules a room booking.
  rpc ScheduleRoomBookingExpiry(ScheduleRoomBookingExpiryRequest) returns (ScheduleRoomBookingExpiryResponse);
}

// The request of `ActivateRoomBooking`.
message ActivateRoomBookingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  ActivateRoomBookingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRoomBooking`.
message ActivateRoomBookingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoomBooking room_booking = 1;
  ActivateRoomBookingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

