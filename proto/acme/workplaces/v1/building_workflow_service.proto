syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "BuildingWorkflowServiceProto";
option java_package = "com.acme.workplaces.v1";

// Runs the long-lived workflow that takes a building from start to finish.
service BuildingWorkflowService {
  // Starts a building.
  rpc StartBuildingWorkflow(StartBuildingWorkflowRequest) returns (StartBuildingWorkflowResponse);

  // Advances a building.
  rpc AdvanceBuildingWorkflow(AdvanceBuildingWorkflowRequest) returns (AdvanceBuildingWorkflowResponse);

  // Cancels a building.
  rpc CancelBuildingWorkflow(CancelBuildingWorkflowRequest) returns (CancelBuildingWorkflowResponse);

  // Pauses a building.
  rpc PauseBuildingWorkflow(PauseBuildingWorkflowRequest) returns (PauseBuildingWorkflowResponse);

  // Resumes a building.
  rpc ResumeBuildingWorkflow(ResumeBuildingWorkflowRequest) returns (ResumeBuildingWorkflowResponse);

  // Returns a building.
  rpc InspectBuildingWorkflow(InspectBuildingWorkflowRequest) returns (InspectBuildingWorkflowResponse);

  // Lists buildings a page at a time.
  rpc ListBuildingWorkflows(ListBuildingWorkflowsRequest) returns (ListBuildingWorkflowsResponse);

  // Signals a building.
  rpc SignalBuildingWorkflow(SignalBuildingWorkflowRequest) returns (SignalBuildingWorkflowResponse);
}

// The request of `StartBuildingWorkflow`.
message StartBuildingWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  StartBuildingWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBuildingWorkflow`.
message StartBuildingWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  StartBuildingWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

