option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RoomBookingWorkflowServiceProto";
option java_package = "com.acme.workplaces.v1";

// Runs the long-lived workflow that takes a room booking from start to finish.
service RoomBookingWorkflowService {
  // Starts a room booking.
  rpc StartRoomBookingWorkflow(StartRoomBookingWorkflowRequest) returns (StartRoomBookingWorkflowResponse);

  // Advances a room booking.
  rpc AdvanceRoomBookingWorkflow(AdvanceRoomBookingWorkflowRequest) returns (AdvanceRoomBookingWorkflowResponse);

  // Cancels a room booking.
  rpc CancelRoomBookingWorkflow(CancelRoomBookingWorkflowRequest) returns (CancelRoomBookingWorkflowResponse);

  // Pauses a room booking.
  rpc PauseRoomBookingWorkflow(PauseRoomBookingWorkflowRequest) returns (PauseRoomBookingWorkflowResponse);

  // Resumes a room booking.
  rpc ResumeRoomBookingWorkflow(ResumeRoomBookingWorkflowRequest) returns (ResumeRoomBookingWorkflowResponse);

  // Returns a room booking.
  rpc InspectRoomBookingWorkflow(InspectRoomBookingWorkflowRequest) returns (InspectRoomBookingWorkflowResponse);

  // Lists room bookings a page at a time.
  rpc ListRoomBookingWorkflows(ListRoomBookingWorkflowsRequest) returns (ListRoomBookingWorkflowsResponse);

  // Signals a room booking.
  rpc SignalRoomBookingWorkflow(SignalRoomBookingWorkflowRequest) returns (SignalRoomBookingWorkflowResponse);
}

// The request of `StartRoomBookingWorkflow`.
message StartRoomBookingWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  RoomBooking room_booking = 3;
  StartRoomBookingWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRoomBookingWorkflow`.
message StartRoomBookingWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoomBooking room_booking = 1;
  StartRoomBookingWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

