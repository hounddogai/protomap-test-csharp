  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  RoomBooking room_booking = 3;
  ExplainRoomBookingCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainRoomBookingCalculation`.
message ExplainRoomBookingCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoomBooking room_booking = 1;
  ExplainRoomBookingCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRoomBookingRates`.
message GetRoomBookingRatesRequest {
