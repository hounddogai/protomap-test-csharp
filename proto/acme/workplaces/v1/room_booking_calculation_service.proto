syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RoomBookingCalculationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Computes the figures of a room booking, such as totals, taxes, and estimates.
service RoomBookingCalculationService {
  // Calculates a room booking.
  rpc CalculateRoomBooking(CalculateRoomBookingRequest) returns (CalculateRoomBookingResponse);

  // Estimates a room booking.
  rpc EstimateRoomBooking(EstimateRoomBookingRequest) returns (EstimateRoomBookingResponse);

  // Compares a room booking.
  rpc CompareRoomBookingOptions(CompareRoomBookingOptionsRequest) returns (CompareRoomBookingOptionsResponse);

  // Recalculates a room booking.
  rpc RecalculateRoomBookings(RecalculateRoomBookingsRequest) returns (RecalculateRoomBookingsResponse);

  // Explains a room booking.
  rpc ExplainRoomBookingCalculation(ExplainRoomBookingCalculationRequest) returns (ExplainRoomBookingCalculationResponse);

  // Returns a room booking.
  rpc GetRoomBookingRates(GetRoomBookingRatesRequest) returns (GetRoomBookingRatesResponse);
}

// The request of `CalculateRoomBooking`.
message CalculateRoomBookingRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  RoomBooking room_booking = 3;
  CalculateRoomBookingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRoomBooking`.
message CalculateRoomBookingResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRoomBookingResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  RoomBooking room_booking = 1;
  CalculateRoomBookingResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

