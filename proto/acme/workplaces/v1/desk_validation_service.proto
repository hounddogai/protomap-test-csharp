syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "DeskValidationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Checks desks against the rules before anything acts on them.
service DeskValidationService {
  // Validates a desk.
  rpc ValidateDesk(ValidateDeskRequest) returns (ValidateDeskResponse);

  // Previews a desk.
  rpc PreviewDesk(PreviewDeskRequest) returns (PreviewDeskResponse);

  // Checks a desk.
  rpc CheckDeskEligibility(CheckDeskEligibilityRequest) returns (CheckDeskEligibilityResponse);

  // Normalizes a desk.
  rpc NormalizeDesk(NormalizeDeskRequest) returns (NormalizeDeskResponse);

  // Explains a desk.
  rpc ExplainDeskDecision(ExplainDeskDecisionRequest) returns (ExplainDeskDecisionResponse);

  // Scores a desk.
  rpc ScoreDesk(ScoreDeskRequest) returns (ScoreDeskResponse);

  // Lints a desk.
  rpc LintDesks(LintDesksRequest) returns (LintDesksResponse);

  // Returns a desk.
  rpc GetDeskRules(GetDeskRulesRequest) returns (GetDeskRulesResponse);
}

// The request of `ValidateDesk`.
message ValidateDeskRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  Desk desk = 3;
  ValidateDeskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDesk`.
message ValidateDeskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Desk desk = 1;
  ValidateDeskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

