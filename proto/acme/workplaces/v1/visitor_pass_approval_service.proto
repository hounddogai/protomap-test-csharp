syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "VisitorPassApprovalServiceProto";
option java_package = "com.acme.workplaces.v1";

// Routes visitor passes through approval, with escalation and delegation.
service VisitorPassApprovalService {
  // Submits a visitor pass.
  rpc SubmitVisitorPass(SubmitVisitorPassRequest) returns (SubmitVisitorPassResponse);

  // Approves a visitor pass.
  rpc ApproveVisitorPass(ApproveVisitorPassRequest) returns (ApproveVisitorPassResponse);

  // Lists visitor passes a page at a time.
  rpc ListPendingVisitorPasses(ListPendingVisitorPassesRequest) returns (ListPendingVisitorPassesResponse);

  // Delegates a visitor pass.
  rpc DelegateVisitorPassApproval(DelegateVisitorPassApprovalRequest) returns (DelegateVisitorPassApprovalResponse);

  // Recalls a visitor pass.
  rpc RecallVisitorPass(RecallVisitorPassRequest) returns (RecallVisitorPassResponse);

  // Returns a visitor pass.
  rpc GetVisitorPassApprovalStatus(GetVisitorPassApprovalStatusRequest) returns (GetVisitorPassApprovalStatusResponse);

  // Comments a visitor pass.
  rpc CommentVisitorPassApproval(CommentVisitorPassApprovalRequest) returns (CommentVisitorPassApprovalResponse);
}

// The request of `SubmitVisitorPass`.
message SubmitVisitorPassRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  VisitorPass visitor_pass = 3;
  SubmitVisitorPassRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVisitorPass`.
message SubmitVisitorPassResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitorPass visitor_pass = 1;
  SubmitVisitorPassResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveVisitorPass`.
message ApproveVisitorPassRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
