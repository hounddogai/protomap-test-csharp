syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "DeskCalculationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Computes the figures of a desk, such as totals, taxes, and estimates.
service DeskCalculationService {
  // Calculates a desk.
  rpc CalculateDesk(CalculateDeskRequest) returns (CalculateDeskResponse);

  // Estimates a desk.
  rpc EstimateDesk(EstimateDeskRequest) returns (EstimateDeskResponse);

  // Quotes a desk.
  rpc QuoteDesk(QuoteDeskRequest) returns (QuoteDeskResponse);

  // Compares a desk.
  rpc CompareDeskOptions(CompareDeskOptionsRequest) returns (CompareDeskOptionsResponse);

  // Recalculates a desk.
  rpc RecalculateDesks(RecalculateDesksRequest) returns (RecalculateDesksResponse);

  // Simulates a desk.
  rpc SimulateDesk(SimulateDeskRequest) returns (SimulateDeskResponse);

  // Explains a desk.
  rpc ExplainDeskCalculation(ExplainDeskCalculationRequest) returns (ExplainDeskCalculationResponse);

  // Returns a desk.
  rpc GetDeskRates(GetDeskRatesRequest) returns (GetDeskRatesResponse);
}

// The request of `CalculateDesk`.
message CalculateDeskRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  Desk desk = 3;
  CalculateDeskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDesk`.
message CalculateDeskResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDeskResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Desk desk = 1;
  CalculateDeskResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

