syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "DeskLifecycleServiceProto";
option java_package = "com.acme.workplaces.v1";

// Moves a desk between the states of its lifecycle.
service DeskLifecycleService {
  // Activates a desk.
  rpc ActivateDesk(ActivateDeskRequest) returns (ActivateDeskResponse);

  // Suspends a desk.
  rpc SuspendDesk(SuspendDeskRequest) returns (SuspendDeskResponse);

  // Reinstates a desk.
  rpc ReinstateDesk(ReinstateDeskRequest) returns (ReinstateDeskResponse);

  // Terminates a desk.
  rpc TerminateDesk(TerminateDeskRequest) returns (TerminateDeskResponse);

  // Renews a desk.
  rpc RenewDesk(RenewDeskRequest) returns (RenewDeskResponse);

  // Expires a desk.
  rpc ExpireDesk(ExpireDeskRequest) returns (ExpireDeskResponse);

  // Returns a desk.
  rpc GetDeskLifecycle(GetDeskLifecycleRequest) returns (GetDeskLifecycleResponse);

  // Schedules a desk.
  rpc ScheduleDeskExpiry(ScheduleDeskExpiryRequest) returns (ScheduleDeskExpiryResponse);
}

// The request of `ActivateDesk`.
message ActivateDeskRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  ActivateDeskRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDesk`.
message ActivateDeskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Desk desk = 1;
  ActivateDeskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

