syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "VisitorPassSyncServiceProto";
option java_package = "com.acme.workplaces.v1";

// Keeps visitor passes in step with the systems of record in other regions.
service VisitorPassSyncService {
  // Syncs a visitor pass.
  rpc SyncVisitorPasses(SyncVisitorPassesRequest) returns (SyncVisitorPassesResponse);

  // Pushs a visitor pass.
  rpc PushVisitorPass(PushVisitorPassRequest) returns (PushVisitorPassResponse);

  // Pulls a visitor pass.
  rpc PullVisitorPasses(PullVisitorPassesRequest) returns (PullVisitorPassesResponse);

  // Reconciles a visitor pass.
  rpc ReconcileVisitorPasses(ReconcileVisitorPassesRequest) returns (ReconcileVisitorPassesResponse);

  // Exchanges changes of visitor passes with a peer.
  rpc StreamVisitorPassChanges(stream StreamVisitorPassChangesRequest) returns (stream StreamVisitorPassChangesResponse);

  // Resolves a visitor pass.
  rpc ResolveVisitorPassConflict(ResolveVisitorPassConflictRequest) returns (ResolveVisitorPassConflictResponse);

  // Returns a visitor pass.
  rpc GetVisitorPassSyncState(GetVisitorPassSyncStateRequest) returns (GetVisitorPassSyncStateResponse);

  // Lists visitor passes a page at a time.
  rpc ListVisitorPassConflicts(ListVisitorPassConflictsRequest) returns (ListVisitorPassConflictsResponse);
}

// The request of `SyncVisitorPasses`.
message SyncVisitorPassesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  VisitorPass visitor_pass = 3;
  SyncVisitorPassesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncVisitorPasses`.
message SyncVisitorPassesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitorPass visitor_pass = 1;
  SyncVisitorPassesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushVisitorPass`.
message PushVisitorPassRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  VisitorPass visitor_pass = 3;
  PushVisitorPassRequest.Details details = 4;
