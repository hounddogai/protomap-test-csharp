syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "DeskQueryServiceProto";
option java_package = "com.acme.workplaces.v1";

// Answers read-only questions about desks, for screens and reports.
service DeskQueryService {
  // Returns a desk.
  rpc LookupDesk(LookupDeskRequest) returns (LookupDeskResponse);

  // Lists desks a page at a time.
  rpc BrowseDesks(BrowseDesksRequest) returns (BrowseDesksResponse);

  // Counts desks by status.
  rpc CountDesks(CountDesksRequest) returns (CountDesksResponse);

  // Returns several desks at once.
  rpc ResolveDesks(ResolveDesksRequest) returns (ResolveDesksResponse);

  // Streams every matching desk.
  rpc ExportDesks(ExportDesksRequest) returns (stream ExportDesksResponse);

  // Summarizes a desk.
  rpc SummarizeDesks(SummarizeDesksRequest) returns (SummarizeDesksResponse);

  // Lists desks a page at a time.
  rpc SuggestDesks(SuggestDesksRequest) returns (SuggestDesksResponse);

  // Returns a desk.
  rpc PeekDesk(PeekDeskRequest) returns (PeekDeskResponse);
}

// The request of `LookupDesk`.
message LookupDeskRequest {
  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDesk`.
message LookupDeskResponse {
  Desk desk = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDesks`.
message BrowseDesksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDesksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDesks`.
message BrowseDesksResponse {
  repeated Desk desks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDesks`.
message CountDesksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDesksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDesks`.
message CountDesksResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveDesks`.
message ResolveDesksRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string desk_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveDesks`.
message ResolveDesksResponse {
  repeated Desk desks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDesks`.
message ExportDesksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDesksRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDesks`.
message ExportDesksResponse {
  Desk desk = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDesks`.
message SummarizeDesksRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  SummarizeDesksRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDesks`.
message SummarizeDesksResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestDesks`.
message SuggestDesksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestDesksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestDesks`.
message SuggestDesksResponse {
  repeated Desk desks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekDesk`.
message PeekDeskRequest {
  acme.common.v1.RequestContext context = 1;
  string desk_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDesk`.
message PeekDeskResponse {
  Desk desk = 1;
  acme.common.v1.OperationResult result = 2;
}
