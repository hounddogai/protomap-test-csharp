syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "BuildingValidationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Checks buildings against the rules before anything acts on them.
service BuildingValidationService {
  // Validates a building.
  rpc ValidateBuilding(ValidateBuildingRequest) returns (ValidateBuildingResponse);

  // Previews a building.
  rpc PreviewBuilding(PreviewBuildingRequest) returns (PreviewBuildingResponse);

  // Checks a building.
  rpc CheckBuildingEligibility(CheckBuildingEligibilityRequest) returns (CheckBuildingEligibilityResponse);

  // Normalizes a building.
  rpc NormalizeBuilding(NormalizeBuildingRequest) returns (NormalizeBuildingResponse);

  // Explains a building.
  rpc ExplainBuildingDecision(ExplainBuildingDecisionRequest) returns (ExplainBuildingDecisionResponse);

  // Scores a building.
  rpc ScoreBuilding(ScoreBuildingRequest) returns (ScoreBuildingResponse);

  // Lints a building.
  rpc LintBuildings(LintBuildingsRequest) returns (LintBuildingsResponse);

  // Returns a building.
  rpc GetBuildingRules(GetBuildingRulesRequest) returns (GetBuildingRulesResponse);
}

// The request of `ValidateBuilding`.
message ValidateBuildingRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string building_id = 2;
  Building building = 3;
  ValidateBuildingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBuilding`.
message ValidateBuildingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Building building = 1;
  ValidateBuildingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

