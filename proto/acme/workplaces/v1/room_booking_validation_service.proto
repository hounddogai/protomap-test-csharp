syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "RoomBookingValidationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Checks room bookings against the rules before anything acts on them.
service RoomBookingValidationService {
  // Validates a room booking.
  rpc ValidateRoomBooking(ValidateRoomBookingRequest) returns (ValidateRoomBookingResponse);

  // Previews a room booking.
  rpc PreviewRoomBooking(PreviewRoomBookingRequest) returns (PreviewRoomBookingResponse);

  // Checks a room booking.
  rpc CheckRoomBookingEligibility(CheckRoomBookingEligibilityRequest) returns (CheckRoomBookingEligibilityResponse);

  // Normalizes a room booking.
  rpc NormalizeRoomBooking(NormalizeRoomBookingRequest) returns (NormalizeRoomBookingResponse);

  // Explains a room booking.
  rpc ExplainRoomBookingDecision(ExplainRoomBookingDecisionRequest) returns (ExplainRoomBookingDecisionResponse);

  // Scores a room booking.
  rpc ScoreRoomBooking(ScoreRoomBookingRequest) returns (ScoreRoomBookingResponse);

  // Lints a room booking.
  rpc LintRoomBookings(LintRoomBookingsRequest) returns (LintRoomBookingsResponse);

  // Returns a room booking.
  rpc GetRoomBookingRules(GetRoomBookingRulesRequest) returns (GetRoomBookingRulesResponse);
}

// The request of `ValidateRoomBooking`.
message ValidateRoomBookingRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string room_booking_id = 2;
  RoomBooking room_booking = 3;
  ValidateRoomBookingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRoomBooking`.
message ValidateRoomBookingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RoomBooking room_booking = 1;
  ValidateRoomBookingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

