syntax = "proto3";

package acme.workplaces.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/workplaces/v1/workplaces.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Workplaces.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/workplaces/v1;workplacesv1";
option java_multiple_files = true;
option java_outer_classname = "VisitorPassValidationServiceProto";
option java_package = "com.acme.workplaces.v1";

// Checks visitor passes against the rules before anything acts on them.
service VisitorPassValidationService {
  // Validates a visitor pass.
  rpc ValidateVisitorPass(ValidateVisitorPassRequest) returns (ValidateVisitorPassResponse);

  // Previews a visitor pass.
  rpc PreviewVisitorPass(PreviewVisitorPassRequest) returns (PreviewVisitorPassResponse);

  // Checks a visitor pass.
  rpc CheckVisitorPassEligibility(CheckVisitorPassEligibilityRequest) returns (CheckVisitorPassEligibilityResponse);

  // Normalizes a visitor pass.
  rpc NormalizeVisitorPass(NormalizeVisitorPassRequest) returns (NormalizeVisitorPassResponse);

  // Explains a visitor pass.
  rpc ExplainVisitorPassDecision(ExplainVisitorPassDecisionRequest) returns (ExplainVisitorPassDecisionResponse);

  // Scores a visitor pass.
  rpc ScoreVisitorPass(ScoreVisitorPassRequest) returns (ScoreVisitorPassResponse);

  // Returns a visitor pass.
  rpc GetVisitorPassRules(GetVisitorPassRulesRequest) returns (GetVisitorPassRulesResponse);
}

// The request of `ValidateVisitorPass`.
message ValidateVisitorPassRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string visitor_pass_id = 2;
  VisitorPass visitor_pass = 3;
  ValidateVisitorPassRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVisitorPass`.
message ValidateVisitorPassResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitorPass visitor_pass = 1;
  ValidateVisitorPassResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

