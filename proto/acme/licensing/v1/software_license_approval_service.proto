syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "SoftwareLicenseApprovalServiceProto";
option java_package = "com.acme.licensing.v1";

// Routes software licenses through approval, with escalation and delegation.
service SoftwareLicenseApprovalService {
  // Submits a software license.
  rpc SubmitSoftwareLicense(SubmitSoftwareLicenseRequest) returns (SubmitSoftwareLicenseResponse);

  // Approves a software license.
  rpc ApproveSoftwareLicense(ApproveSoftwareLicenseRequest) returns (ApproveSoftwareLicenseResponse);

  // Rejects a software license.
  rpc RejectSoftwareLicense(RejectSoftwareLicenseRequest) returns (RejectSoftwareLicenseResponse);

  // Escalates a software license.
  rpc EscalateSoftwareLicense(EscalateSoftwareLicenseRequest) returns (EscalateSoftwareLicenseResponse);

  // Lists software licenses a page at a time.
  rpc ListPendingSoftwareLicenses(ListPendingSoftwareLicensesRequest) returns (ListPendingSoftwareLicensesResponse);

  // Recalls a software license.
  rpc RecallSoftwareLicense(RecallSoftwareLicenseRequest) returns (RecallSoftwareLicenseResponse);
}

// The request of `SubmitSoftwareLicense`.
message SubmitSoftwareLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string software_license_id = 2;
  SoftwareLicense software_license = 3;
  SubmitSoftwareLicenseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSoftwareLicense`.
message SubmitSoftwareLicenseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SoftwareLicense software_license = 1;
  SubmitSoftwareLicenseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

