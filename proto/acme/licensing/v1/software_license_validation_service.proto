syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "SoftwareLicenseValidationServiceProto";
option java_package = "com.acme.licensing.v1";

// Checks software licenses against the rules before anything acts on them.
service SoftwareLicenseValidationService {
  // Validates a software license.
  rpc ValidateSoftwareLicense(ValidateSoftwareLicenseRequest) returns (ValidateSoftwareLicenseResponse);

  // Previews a software license.
  rpc PreviewSoftwareLicense(PreviewSoftwareLicenseRequest) returns (PreviewSoftwareLicenseResponse);

  // Checks a software license.
  rpc CheckSoftwareLicenseEligibility(CheckSoftwareLicenseEligibilityRequest) returns (CheckSoftwareLicenseEligibilityResponse);

  // Normalizes a software license.
  rpc NormalizeSoftwareLicense(NormalizeSoftwareLicenseRequest) returns (NormalizeSoftwareLicenseResponse);

  // Explains a software license.
  rpc ExplainSoftwareLicenseDecision(ExplainSoftwareLicenseDecisionRequest) returns (ExplainSoftwareLicenseDecisionResponse);

  // Scores a software license.
  rpc ScoreSoftwareLicense(ScoreSoftwareLicenseRequest) returns (ScoreSoftwareLicenseResponse);

  // Lints a software license.
  rpc LintSoftwareLicenses(LintSoftwareLicensesRequest) returns (LintSoftwareLicensesResponse);

  // Returns a software license.
  rpc GetSoftwareLicenseRules(GetSoftwareLicenseRulesRequest) returns (GetSoftwareLicenseRulesResponse);
}

// The request of `ValidateSoftwareLicense`.
message ValidateSoftwareLicenseRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string software_license_id = 2;
  SoftwareLicense software_license = 3;
  ValidateSoftwareLicenseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSoftwareLicense`.
message ValidateSoftwareLicenseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SoftwareLicense software_license = 1;
  ValidateSoftwareLicenseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

