syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "LicenseAssignmentReportingServiceProto";
option java_package = "com.acme.licensing.v1";

// Builds and schedules reports about license assignments.
service LicenseAssignmentReportingService {
  // Generates a license assignment.
  rpc GenerateLicenseAssignmentReport(GenerateLicenseAssignmentReportRequest) returns (GenerateLicenseAssignmentReportResponse);

  // Returns a license assignment.
  rpc FetchLicenseAssignmentReport(FetchLicenseAssignmentReportRequest) returns (FetchLicenseAssignmentReportResponse);

  // Schedules a license assignment.
  rpc ScheduleLicenseAssignmentReport(ScheduleLicenseAssignmentReportRequest) returns (ScheduleLicenseAssignmentReportResponse);

  // Streams the changes of license assignments as they happen.
  rpc StreamLicenseAssignmentMetrics(StreamLicenseAssignmentMetricsRequest) returns (stream StreamLicenseAssignmentMetricsResponse);

  // Lists license assignments a page at a time.
  rpc ListLicenseAssignmentReports(ListLicenseAssignmentReportsRequest) returns (ListLicenseAssignmentReportsResponse);

  // Shares a license assignment.
  rpc ShareLicenseAssignmentReport(ShareLicenseAssignmentReportRequest) returns (ShareLicenseAssignmentReportResponse);

  // Counts license assignments by status.
  rpc CountLicenseAssignmentTotals(CountLicenseAssignmentTotalsRequest) returns (CountLicenseAssignmentTotalsResponse);

  // Deletes a license assignment.
  rpc DeleteLicenseAssignmentReport(DeleteLicenseAssignmentReportRequest) returns (DeleteLicenseAssignmentReportResponse);
}

// The request of `GenerateLicenseAssignmentReport`.
message GenerateLicenseAssignmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  GenerateLicenseAssignmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateLicenseAssignmentReport`.
message GenerateLicenseAssignmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchLicenseAssignmentReport`.
message FetchLicenseAssignmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchLicenseAssignmentReport`.
message FetchLicenseAssignmentReportResponse {
  LicenseAssignment license_assignment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleLicenseAssignmentReport`.
message ScheduleLicenseAssignmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  ScheduleLicenseAssignmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleLicenseAssignmentReport`.
message ScheduleLicenseAssignmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamLicenseAssignmentMetrics`.
message StreamLicenseAssignmentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LicenseAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamLicenseAssignmentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamLicenseAssignmentMetrics`.
message StreamLicenseAssignmentMetricsResponse {
  LicenseAssignment license_assignment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListLicenseAssignmentReports`.
message ListLicenseAssignmentReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LicenseAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLicenseAssignmentReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLicenseAssignmentReports`.
message ListLicenseAssignmentReportsResponse {
  repeated LicenseAssignment license_assignments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareLicenseAssignmentReport`.
message ShareLicenseAssignmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  ShareLicenseAssignmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareLicenseAssignmentReport`.
message ShareLicenseAssignmentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LicenseAssignment license_assignment = 1;
  ShareLicenseAssignmentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLicenseAssignmentTotals`.
message CountLicenseAssignmentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LicenseAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLicenseAssignmentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLicenseAssignmentTotals`.
message CountLicenseAssignmentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteLicenseAssignmentReport`.
message DeleteLicenseAssignmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteLicenseAssignmentReport`.
message DeleteLicenseAssignmentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
