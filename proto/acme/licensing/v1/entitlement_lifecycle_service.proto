syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "EntitlementLifecycleServiceProto";
option java_package = "com.acme.licensing.v1";

// Moves an entitlement between the states of its lifecycle.
service EntitlementLifecycleService {
  // Activates an entitlement.
  rpc ActivateEntitlement(ActivateEntitlementRequest) returns (ActivateEntitlementResponse);

  // Suspends an entitlement.
  rpc SuspendEntitlement(SuspendEntitlementRequest) returns (SuspendEntitlementResponse);

  // Terminates an entitlement.
  rpc TerminateEntitlement(TerminateEntitlementRequest) returns (TerminateEntitlementResponse);

  // Renews an entitlement.
  rpc RenewEntitlement(RenewEntitlementRequest) returns (RenewEntitlementResponse);

  // Expires an entitlement.
  rpc ExpireEntitlement(ExpireEntitlementRequest) returns (ExpireEntitlementResponse);

  // Schedules an entitlement.
  rpc ScheduleEntitlementExpiry(ScheduleEntitlementExpiryRequest) returns (ScheduleEntitlementExpiryResponse);
}

// The request of `ActivateEntitlement`.
message ActivateEntitlementRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string entitlement_id = 2;
  ActivateEntitlementRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateEntitlement`.
message ActivateEntitlementResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entitlement entitlement = 1;
  ActivateEntitlementResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

