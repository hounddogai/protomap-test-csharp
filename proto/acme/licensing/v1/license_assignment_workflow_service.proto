syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "LicenseAssignmentWorkflowServiceProto";
option java_package = "com.acme.licensing.v1";

// Runs the long-lived workflow that takes a license assignment from start to finish.
service LicenseAssignmentWorkflowService {
  // Starts a license assignment.
  rpc StartLicenseAssignmentWorkflow(StartLicenseAssignmentWorkflowRequest) returns (StartLicenseAssignmentWorkflowResponse);

  // Advances a license assignment.
  rpc AdvanceLicenseAssignmentWorkflow(AdvanceLicenseAssignmentWorkflowRequest) returns (AdvanceLicenseAssignmentWorkflowResponse);

  // Cancels a license assignment.
  rpc CancelLicenseAssignmentWorkflow(CancelLicenseAssignmentWorkflowRequest) returns (CancelLicenseAssignmentWorkflowResponse);

  // Retrys a license assignment.
  rpc RetryLicenseAssignmentWorkflow(RetryLicenseAssignmentWorkflowRequest) returns (RetryLicenseAssignmentWorkflowResponse);

  // Pauses a license assignment.
  rpc PauseLicenseAssignmentWorkflow(PauseLicenseAssignmentWorkflowRequest) returns (PauseLicenseAssignmentWorkflowResponse);

  // Resumes a license assignment.
  rpc ResumeLicenseAssignmentWorkflow(ResumeLicenseAssignmentWorkflowRequest) returns (ResumeLicenseAssignmentWorkflowResponse);

  // Returns a license assignment.
  rpc InspectLicenseAssignmentWorkflow(InspectLicenseAssignmentWorkflowRequest) returns (InspectLicenseAssignmentWorkflowResponse);

  // Lists license assignments a page at a time.
  rpc ListLicenseAssignmentWorkflows(ListLicenseAssignmentWorkflowsRequest) returns (ListLicenseAssignmentWorkflowsResponse);

  // Signals a license assignment.
  rpc SignalLicenseAssignmentWorkflow(SignalLicenseAssignmentWorkflowRequest) returns (SignalLicenseAssignmentWorkflowResponse);
}

// The request of `StartLicenseAssignmentWorkflow`.
message StartLicenseAssignmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  LicenseAssignment license_assignment = 3;
  StartLicenseAssignmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLicenseAssignmentWorkflow`.
message StartLicenseAssignmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LicenseAssignment license_assignment = 1;
  StartLicenseAssignmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

