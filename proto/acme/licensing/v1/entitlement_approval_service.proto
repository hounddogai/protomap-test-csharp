syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "EntitlementApprovalServiceProto";
option java_package = "com.acme.licensing.v1";

// Routes entitlements through approval, with escalation and delegation.
service EntitlementApprovalService {
  // Submits an entitlement.
  rpc SubmitEntitlement(SubmitEntitlementRequest) returns (SubmitEntitlementResponse);

  // Approves an entitlement.
  rpc ApproveEntitlement(ApproveEntitlementRequest) returns (ApproveEntitlementResponse);

  // Rejects an entitlement.
  rpc RejectEntitlement(RejectEntitlementRequest) returns (RejectEntitlementResponse);

  // Escalates an entitlement.
  rpc EscalateEntitlement(EscalateEntitlementRequest) returns (EscalateEntitlementResponse);

  // Delegates an entitlement.
  rpc DelegateEntitlementApproval(DelegateEntitlementApprovalRequest) returns (DelegateEntitlementApprovalResponse);

  // Recalls an entitlement.
  rpc RecallEntitlement(RecallEntitlementRequest) returns (RecallEntitlementResponse);

  // Returns an entitlement.
  rpc GetEntitlementApprovalStatus(GetEntitlementApprovalStatusRequest) returns (GetEntitlementApprovalStatusResponse);

  // Comments an entitlement.
  rpc CommentEntitlementApproval(CommentEntitlementApprovalRequest) returns (CommentEntitlementApprovalResponse);
}

// The request of `SubmitEntitlement`.
message SubmitEntitlementRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entitlement_id = 2;
  Entitlement entitlement = 3;
  SubmitEntitlementRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEntitlement`.
message SubmitEntitlementResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entitlement entitlement = 1;
  SubmitEntitlementResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

