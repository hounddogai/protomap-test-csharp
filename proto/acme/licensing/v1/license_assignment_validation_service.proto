syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "LicenseAssignmentValidationServiceProto";
option java_package = "com.acme.licensing.v1";

// Checks license assignments against the rules before anything acts on them.
service LicenseAssignmentValidationService {
  // Validates a license assignment.
  rpc ValidateLicenseAssignment(ValidateLicenseAssignmentRequest) returns (ValidateLicenseAssignmentResponse);

  // Previews a license assignment.
  rpc PreviewLicenseAssignment(PreviewLicenseAssignmentRequest) returns (PreviewLicenseAssignmentResponse);

  // Normalizes a license assignment.
  rpc NormalizeLicenseAssignment(NormalizeLicenseAssignmentRequest) returns (NormalizeLicenseAssignmentResponse);

  // Explains a license assignment.
  rpc ExplainLicenseAssignmentDecision(ExplainLicenseAssignmentDecisionRequest) returns (ExplainLicenseAssignmentDecisionResponse);

  // Scores a license assignment.
  rpc ScoreLicenseAssignment(ScoreLicenseAssignmentRequest) returns (ScoreLicenseAssignmentResponse);

  // Lints a license assignment.
  rpc LintLicenseAssignments(LintLicenseAssignmentsRequest) returns (LintLicenseAssignmentsResponse);

  // Returns a license assignment.
  rpc GetLicenseAssignmentRules(GetLicenseAssignmentRulesRequest) returns (GetLicenseAssignmentRulesResponse);
}

// The request of `ValidateLicenseAssignment`.
message ValidateLicenseAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  LicenseAssignment license_assignment = 3;
  ValidateLicenseAssignmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLicenseAssignment`.
message ValidateLicenseAssignmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LicenseAssignment license_assignment = 1;
  ValidateLicenseAssignmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

