import "acme/identity/v1/refs.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "LicenseAssignmentLifecycleServiceProto";
option java_package = "com.acme.licensing.v1";

// Moves a license assignment between the states of its lifecycle.
service LicenseAssignmentLifecycleService {
  // Activates a license assignment.
  rpc ActivateLicenseAssignment(ActivateLicenseAssignmentRequest) returns (ActivateLicenseAssignmentResponse);

  // Suspends a license assignment.
  rpc SuspendLicenseAssignment(SuspendLicenseAssignmentRequest) returns (SuspendLicenseAssignmentResponse);

  // Reinstates a license assignment.
  rpc ReinstateLicenseAssignment(ReinstateLicenseAssignmentRequest) returns (ReinstateLicenseAssignmentResponse);

  // Terminates a license assignment.
  rpc TerminateLicenseAssignment(TerminateLicenseAssignmentRequest) returns (TerminateLicenseAssignmentResponse);

  // Renews a license assignment.
  rpc RenewLicenseAssignment(RenewLicenseAssignmentRequest) returns (RenewLicenseAssignmentResponse);

  // Expires a license assignment.
  rpc ExpireLicenseAssignment(ExpireLicenseAssignmentRequest) returns (ExpireLicenseAssignmentResponse);

  // Returns a license assignment.
  rpc GetLicenseAssignmentLifecycle(GetLicenseAssignmentLifecycleRequest) returns (GetLicenseAssignmentLifecycleResponse);

  // Schedules a license assignment.
  rpc ScheduleLicenseAssignmentExpiry(ScheduleLicenseAssignmentExpiryRequest) returns (ScheduleLicenseAssignmentExpiryResponse);
}

// The request of `ActivateLicenseAssignment`.
message ActivateLicenseAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  ActivateLicenseAssignmentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLicenseAssignment`.
message ActivateLicenseAssignmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LicenseAssignment license_assignment = 1;
  ActivateLicenseAssignmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

