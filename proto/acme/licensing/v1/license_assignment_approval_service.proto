  message Filter {
    string query = 1;
    repeated LicenseAssignmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingLicenseAssignmentsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingLicenseAssignments`.
message ListPendingLicenseAssignmentsResponse {
  repeated LicenseAssignment license_assignments = 1;
