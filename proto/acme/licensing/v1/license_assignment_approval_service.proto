syntax = "proto3";

package acme.licensing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/licensing/v1/licensing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Licensing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/licensing/v1;licensingv1";
option java_multiple_files = true;
option java_outer_classname = "LicenseAssignmentApprovalServiceProto";
option java_package = "com.acme.licensing.v1";

// Routes license assignments through approval, with escalation and delegation.
service LicenseAssignmentApprovalService {
  // Submits a license assignment.
  rpc SubmitLicenseAssignment(SubmitLicenseAssignmentRequest) returns (SubmitLicenseAssignmentResponse);

  // Approves a license assignment.
  rpc ApproveLicenseAssignment(ApproveLicenseAssignmentRequest) returns (ApproveLicenseAssignmentResponse);

  // Rejects a license assignment.
  rpc RejectLicenseAssignment(RejectLicenseAssignmentRequest) returns (RejectLicenseAssignmentResponse);

  // Escalates a license assignment.
  rpc EscalateLicenseAssignment(EscalateLicenseAssignmentRequest) returns (EscalateLicenseAssignmentResponse);

  // Lists license assignments a page at a time.
  rpc ListPendingLicenseAssignments(ListPendingLicenseAssignmentsRequest) returns (ListPendingLicenseAssignmentsResponse);

  // Delegates a license assignment.
  rpc DelegateLicenseAssignmentApproval(DelegateLicenseAssignmentApprovalRequest) returns (DelegateLicenseAssignmentApprovalResponse);

  // Recalls a license assignment.
  rpc RecallLicenseAssignment(RecallLicenseAssignmentRequest) returns (RecallLicenseAssignmentResponse);

  // Returns a license assignment.
  rpc GetLicenseAssignmentApprovalStatus(GetLicenseAssignmentApprovalStatusRequest) returns (GetLicenseAssignmentApprovalStatusResponse);

  // Comments a license assignment.
  rpc CommentLicenseAssignmentApproval(CommentLicenseAssignmentApprovalRequest) returns (CommentLicenseAssignmentApprovalResponse);
}

// The request of `SubmitLicenseAssignment`.
message SubmitLicenseAssignmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string license_assignment_id = 2;
  LicenseAssignment license_assignment = 3;
  SubmitLicenseAssignmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitLicenseAssignment`.
message SubmitLicenseAssignmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LicenseAssignment license_assignment = 1;
  SubmitLicenseAssignmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

