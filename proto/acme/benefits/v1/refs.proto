syntax = "proto3";

package acme.benefits.v1;

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.benefits.v1";

// A reference to a benefit plan of the benefits domain.
message BenefitPlanRef {
  string benefit_plan_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an enrollment of the benefits domain.
message EnrollmentRef {
  string enrollment_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a dependent of the benefits domain.
message DependentRef {
  string dependent_id = 1;
  string display_name = 2;
  string email = 3;
}

// A reference to a life event of the benefits domain.
message LifeEventRef {
  string life_event_id = 1;
  string display_name = 2;
  string kind = 3;
}
