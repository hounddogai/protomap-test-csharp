syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "DependentValidationServiceProto";
option java_package = "com.acme.benefits.v1";

// Checks dependents against the rules before anything acts on them.
service DependentValidationService {
  // Validates a dependent.
  rpc ValidateDependent(ValidateDependentRequest) returns (ValidateDependentResponse);

  // Previews a dependent.
  rpc PreviewDependent(PreviewDependentRequest) returns (PreviewDependentResponse);

  // Checks a dependent.
  rpc CheckDependentEligibility(CheckDependentEligibilityRequest) returns (CheckDependentEligibilityResponse);

  // Normalizes a dependent.
  rpc NormalizeDependent(NormalizeDependentRequest) returns (NormalizeDependentResponse);

  // Explains a dependent.
  rpc ExplainDependentDecision(ExplainDependentDecisionRequest) returns (ExplainDependentDecisionResponse);

  // Scores a dependent.
  rpc ScoreDependent(ScoreDependentRequest) returns (ScoreDependentResponse);

  // Lints a dependent.
  rpc LintDependents(LintDependentsRequest) returns (LintDependentsResponse);

  // Returns a dependent.
  rpc GetDependentRules(GetDependentRulesRequest) returns (GetDependentRulesResponse);
}

// The request of `ValidateDependent`.
message ValidateDependentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dependent_id = 2;
  Dependent dependent = 3;
  ValidateDependentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDependent`.
message ValidateDependentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dependent dependent = 1;
  ValidateDependentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

