syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "EnrollmentWorkflowServiceProto";
option java_package = "com.acme.benefits.v1";

// Runs the long-lived workflow that takes an enrollment from start to finish.
service EnrollmentWorkflowService {
  // Starts an enrollment.
  rpc StartEnrollmentWorkflow(StartEnrollmentWorkflowRequest) returns (StartEnrollmentWorkflowResponse);

  // Advances an enrollment.
  rpc AdvanceEnrollmentWorkflow(AdvanceEnrollmentWorkflowRequest) returns (AdvanceEnrollmentWorkflowResponse);

  // Retrys an enrollment.
  rpc RetryEnrollmentWorkflow(RetryEnrollmentWorkflowRequest) returns (RetryEnrollmentWorkflowResponse);

  // Pauses an enrollment.
  rpc PauseEnrollmentWorkflow(PauseEnrollmentWorkflowRequest) returns (PauseEnrollmentWorkflowResponse);

  // Resumes an enrollment.
  rpc ResumeEnrollmentWorkflow(ResumeEnrollmentWorkflowRequest) returns (ResumeEnrollmentWorkflowResponse);

  // Returns an enrollment.
  rpc InspectEnrollmentWorkflow(InspectEnrollmentWorkflowRequest) returns (InspectEnrollmentWorkflowResponse);

  // Lists enrollments a page at a time.
  rpc ListEnrollmentWorkflows(ListEnrollmentWorkflowsRequest) returns (ListEnrollmentWorkflowsResponse);

  // Signals an enrollment.
  rpc SignalEnrollmentWorkflow(SignalEnrollmentWorkflowRequest) returns (SignalEnrollmentWorkflowResponse);
}

// The request of `StartEnrollmentWorkflow`.
message StartEnrollmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string enrollment_id = 2;
  Enrollment enrollment = 3;
  StartEnrollmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartEnrollmentWorkflow`.
message StartEnrollmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Enrollment enrollment = 1;
  StartEnrollmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

