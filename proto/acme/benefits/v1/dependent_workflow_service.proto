syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "DependentWorkflowServiceProto";
option java_package = "com.acme.benefits.v1";

// Runs the long-lived workflow that takes a dependent from start to finish.
service DependentWorkflowService {
  // Starts a dependent.
  rpc StartDependentWorkflow(StartDependentWorkflowRequest) returns (StartDependentWorkflowResponse);

  // Advances a dependent.
  rpc AdvanceDependentWorkflow(AdvanceDependentWorkflowRequest) returns (AdvanceDependentWorkflowResponse);

  // Cancels a dependent.
  rpc CancelDependentWorkflow(CancelDependentWorkflowRequest) returns (CancelDependentWorkflowResponse);

  // Retrys a dependent.
  rpc RetryDependentWorkflow(RetryDependentWorkflowRequest) returns (RetryDependentWorkflowResponse);

  // Pauses a dependent.
  rpc PauseDependentWorkflow(PauseDependentWorkflowRequest) returns (PauseDependentWorkflowResponse);

  // Resumes a dependent.
  rpc ResumeDependentWorkflow(ResumeDependentWorkflowRequest) returns (ResumeDependentWorkflowResponse);

  // Returns a dependent.
  rpc InspectDependentWorkflow(InspectDependentWorkflowRequest) returns (InspectDependentWorkflowResponse);

  // Lists dependents a page at a time.
  rpc ListDependentWorkflows(ListDependentWorkflowsRequest) returns (ListDependentWorkflowsResponse);

  // Signals a dependent.
  rpc SignalDependentWorkflow(SignalDependentWorkflowRequest) returns (SignalDependentWorkflowResponse);
}

// The request of `StartDependentWorkflow`.
message StartDependentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dependent_id = 2;
  Dependent dependent = 3;
  StartDependentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDependentWorkflow`.
message StartDependentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dependent dependent = 1;
  StartDependentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

