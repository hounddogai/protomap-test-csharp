syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "LifeEventValidationServiceProto";
option java_package = "com.acme.benefits.v1";

// Checks life events against the rules before anything acts on them.
service LifeEventValidationService {
  // Validates a life event.
  rpc ValidateLifeEvent(ValidateLifeEventRequest) returns (ValidateLifeEventResponse);

  // Previews a life event.
  rpc PreviewLifeEvent(PreviewLifeEventRequest) returns (PreviewLifeEventResponse);

  // Checks a life event.
  rpc CheckLifeEventEligibility(CheckLifeEventEligibilityRequest) returns (CheckLifeEventEligibilityResponse);

  // Normalizes a life event.
  rpc NormalizeLifeEvent(NormalizeLifeEventRequest) returns (NormalizeLifeEventResponse);

  // Explains a life event.
  rpc ExplainLifeEventDecision(ExplainLifeEventDecisionRequest) returns (ExplainLifeEventDecisionResponse);

  // Scores a life event.
  rpc ScoreLifeEvent(ScoreLifeEventRequest) returns (ScoreLifeEventResponse);

  // Lints a life event.
  rpc LintLifeEvents(LintLifeEventsRequest) returns (LintLifeEventsResponse);
}

// The request of `ValidateLifeEvent`.
message ValidateLifeEventRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string life_event_id = 2;
  LifeEvent life_event = 3;
  ValidateLifeEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLifeEvent`.
message ValidateLifeEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LifeEvent life_event = 1;
  ValidateLifeEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

