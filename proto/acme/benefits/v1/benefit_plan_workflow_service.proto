    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListBenefitPlanWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListBenefitPlanWorkflows`.
message ListBenefitPlanWorkflowsResponse {
