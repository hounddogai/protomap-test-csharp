syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "BenefitPlanApprovalServiceProto";
option java_package = "com.acme.benefits.v1";

// Routes benefit plans through approval, with escalation and delegation.
service BenefitPlanApprovalService {
  // Submits a benefit plan.
  rpc SubmitBenefitPlan(SubmitBenefitPlanRequest) returns (SubmitBenefitPlanResponse);

  // Approves a benefit plan.
  rpc ApproveBenefitPlan(ApproveBenefitPlanRequest) returns (ApproveBenefitPlanResponse);

  // Rejects a benefit plan.
  rpc RejectBenefitPlan(RejectBenefitPlanRequest) returns (RejectBenefitPlanResponse);

  // Escalates a benefit plan.
  rpc EscalateBenefitPlan(EscalateBenefitPlanRequest) returns (EscalateBenefitPlanResponse);

  // Lists benefit plans a page at a time.
  rpc ListPendingBenefitPlans(ListPendingBenefitPlansRequest) returns (ListPendingBenefitPlansResponse);

  // Delegates a benefit plan.
  rpc DelegateBenefitPlanApproval(DelegateBenefitPlanApprovalRequest) returns (DelegateBenefitPlanApprovalResponse);

  // Recalls a benefit plan.
  rpc RecallBenefitPlan(RecallBenefitPlanRequest) returns (RecallBenefitPlanResponse);

  // Returns a benefit plan.
  rpc GetBenefitPlanApprovalStatus(GetBenefitPlanApprovalStatusRequest) returns (GetBenefitPlanApprovalStatusResponse);
}

// The request of `SubmitBenefitPlan`.
message SubmitBenefitPlanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string benefit_plan_id = 2;
  BenefitPlan benefit_plan = 3;
  SubmitBenefitPlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBenefitPlan`.
message SubmitBenefitPlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BenefitPlan benefit_plan = 1;
  SubmitBenefitPlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

