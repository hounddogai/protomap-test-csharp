syntax = "proto3";

package acme.benefits.v1;

import "acme/benefits/v1/benefits.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Benefits.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/benefits/v1;benefitsv1";
option java_multiple_files = true;
option java_outer_classname = "LifeEventCalculationServiceProto";
option java_package = "com.acme.benefits.v1";

// Computes the figures of a life event, such as totals, taxes, and estimates.
service LifeEventCalculationService {
  // Calculates a life event.
  rpc CalculateLifeEvent(CalculateLifeEventRequest) returns (CalculateLifeEventResponse);

  // Estimates a life event.
  rpc EstimateLifeEvent(EstimateLifeEventRequest) returns (EstimateLifeEventResponse);

  // Quotes a life event.
  rpc QuoteLifeEvent(QuoteLifeEventRequest) returns (QuoteLifeEventResponse);

  // Compares a life event.
  rpc CompareLifeEventOptions(CompareLifeEventOptionsRequest) returns (CompareLifeEventOptionsResponse);

  // Recalculates a life event.
  rpc RecalculateLifeEvents(RecalculateLifeEventsRequest) returns (RecalculateLifeEventsResponse);

  // Simulates a life event.
  rpc SimulateLifeEvent(SimulateLifeEventRequest) returns (SimulateLifeEventResponse);

  // Explains a life event.
  rpc ExplainLifeEventCalculation(ExplainLifeEventCalculationRequest) returns (ExplainLifeEventCalculationResponse);

  // Returns a life event.
  rpc GetLifeEventRates(GetLifeEventRatesRequest) returns (GetLifeEventRatesResponse);
}

// The request of `CalculateLifeEvent`.
message CalculateLifeEventRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string life_event_id = 2;
  LifeEvent life_event = 3;
  CalculateLifeEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLifeEvent`.
message CalculateLifeEventResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLifeEventResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LifeEvent life_event = 1;
  CalculateLifeEventResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

