syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicyCalculationServiceProto";
option java_package = "com.acme.travel.v1";

// Computes the figures of a travel policy, such as totals, taxes, and estimates.
service TravelPolicyCalculationService {
  // Calculates a travel policy.
  rpc CalculateTravelPolicy(CalculateTravelPolicyRequest) returns (CalculateTravelPolicyResponse);

  // Estimates a travel policy.
  rpc EstimateTravelPolicy(EstimateTravelPolicyRequest) returns (EstimateTravelPolicyResponse);

  // Quotes a travel policy.
  rpc QuoteTravelPolicy(QuoteTravelPolicyRequest) returns (QuoteTravelPolicyResponse);

  // Compares a travel policy.
  rpc CompareTravelPolicyOptions(CompareTravelPolicyOptionsRequest) returns (CompareTravelPolicyOptionsResponse);

  // Recalculates a travel policy.
  rpc RecalculateTravelPolicies(RecalculateTravelPoliciesRequest) returns (RecalculateTravelPoliciesResponse);

  // Simulates a travel policy.
  rpc SimulateTravelPolicy(SimulateTravelPolicyRequest) returns (SimulateTravelPolicyResponse);

  // Explains a travel policy.
  rpc ExplainTravelPolicyCalculation(ExplainTravelPolicyCalculationRequest) returns (ExplainTravelPolicyCalculationResponse);

  // Returns a travel policy.
  rpc GetTravelPolicyRates(GetTravelPolicyRatesRequest) returns (GetTravelPolicyRatesResponse);
}

// The request of `CalculateTravelPolicy`.
message CalculateTravelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  TravelPolicy travel_policy = 3;
  CalculateTravelPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTravelPolicy`.
message CalculateTravelPolicyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTravelPolicyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TravelPolicy travel_policy = 1;
  CalculateTravelPolicyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

