syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicySyncServiceProto";
option java_package = "com.acme.travel.v1";

// Keeps travel policies in step with the systems of record in other regions.
service TravelPolicySyncService {
  // Syncs a travel policy.
  rpc SyncTravelPolicies(SyncTravelPoliciesRequest) returns (SyncTravelPoliciesResponse);

  // Pushs a travel policy.
  rpc PushTravelPolicy(PushTravelPolicyRequest) returns (PushTravelPolicyResponse);

  // Pulls a travel policy.
  rpc PullTravelPolicies(PullTravelPoliciesRequest) returns (PullTravelPoliciesResponse);

  // Reconciles a travel policy.
  rpc ReconcileTravelPolicies(ReconcileTravelPoliciesRequest) returns (ReconcileTravelPoliciesResponse);

  // Resolves a travel policy.
  rpc ResolveTravelPolicyConflict(ResolveTravelPolicyConflictRequest) returns (ResolveTravelPolicyConflictResponse);

  // Returns a travel policy.
  rpc GetTravelPolicySyncState(GetTravelPolicySyncStateRequest) returns (GetTravelPolicySyncStateResponse);

  // Lists travel policies a page at a time.
  rpc ListTravelPolicyConflicts(ListTravelPolicyConflictsRequest) returns (ListTravelPolicyConflictsResponse);
}

// The request of `SyncTravelPolicies`.
message SyncTravelPoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  TravelPolicy travel_policy = 3;
  SyncTravelPoliciesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncTravelPolicies`.
message SyncTravelPoliciesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelPolicy travel_policy = 1;
  SyncTravelPoliciesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

