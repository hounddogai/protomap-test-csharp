syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "ItineraryReportingServiceProto";
option java_package = "com.acme.travel.v1";

// Builds and schedules reports about itineraries.
service ItineraryReportingService {
  // Generates an itinerary.
  rpc GenerateItineraryReport(GenerateItineraryReportRequest) returns (GenerateItineraryReportResponse);

  // Returns an itinerary.
  rpc FetchItineraryReport(FetchItineraryReportRequest) returns (FetchItineraryReportResponse);

  // Schedules an itinerary.
  rpc ScheduleItineraryReport(ScheduleItineraryReportRequest) returns (ScheduleItineraryReportResponse);

  // Streams the changes of itineraries as they happen.
  rpc StreamItineraryMetrics(StreamItineraryMetricsRequest) returns (stream StreamItineraryMetricsResponse);

  // Lists itineraries a page at a time.
  rpc ListItineraryReports(ListItineraryReportsRequest) returns (ListItineraryReportsResponse);

  // Shares an itinerary.
  rpc ShareItineraryReport(ShareItineraryReportRequest) returns (ShareItineraryReportResponse);

  // Counts itineraries by status.
  rpc CountItineraryTotals(CountItineraryTotalsRequest) returns (CountItineraryTotalsResponse);

  // Deletes an itinerary.
  rpc DeleteItineraryReport(DeleteItineraryReportRequest) returns (DeleteItineraryReportResponse);
}

// The request of `GenerateItineraryReport`.
message GenerateItineraryReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  GenerateItineraryReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateItineraryReport`.
message GenerateItineraryReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchItineraryReport`.
message FetchItineraryReportRequest {
  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchItineraryReport`.
message FetchItineraryReportResponse {
  Itinerary itinerary = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleItineraryReport`.
message ScheduleItineraryReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  ScheduleItineraryReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleItineraryReport`.
message ScheduleItineraryReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamItineraryMetrics`.
message StreamItineraryMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ItineraryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamItineraryMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamItineraryMetrics`.
message StreamItineraryMetricsResponse {
  Itinerary itinerary = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListItineraryReports`.
message ListItineraryReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ItineraryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListItineraryReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListItineraryReports`.
message ListItineraryReportsResponse {
  repeated Itinerary itineraries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareItineraryReport`.
message ShareItineraryReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  ShareItineraryReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareItineraryReport`.
message ShareItineraryReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Itinerary itinerary = 1;
  ShareItineraryReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountItineraryTotals`.
message CountItineraryTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ItineraryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountItineraryTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountItineraryTotals`.
message CountItineraryTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteItineraryReport`.
message DeleteItineraryReportRequest {
  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteItineraryReport`.
message DeleteItineraryReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
