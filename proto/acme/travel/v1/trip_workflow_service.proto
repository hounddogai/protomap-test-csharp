syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TripWorkflowServiceProto";
option java_package = "com.acme.travel.v1";

// Runs the long-lived workflow that takes a trip from start to finish.
service TripWorkflowService {
  // Starts a trip.
  rpc StartTripWorkflow(StartTripWorkflowRequest) returns (StartTripWorkflowResponse);

  // Advances a trip.
  rpc AdvanceTripWorkflow(AdvanceTripWorkflowRequest) returns (AdvanceTripWorkflowResponse);

  // Cancels a trip.
  rpc CancelTripWorkflow(CancelTripWorkflowRequest) returns (CancelTripWorkflowResponse);

  // Retrys a trip.
  rpc RetryTripWorkflow(RetryTripWorkflowRequest) returns (RetryTripWorkflowResponse);

  // Pauses a trip.
  rpc PauseTripWorkflow(PauseTripWorkflowRequest) returns (PauseTripWorkflowResponse);

  // Resumes a trip.
  rpc ResumeTripWorkflow(ResumeTripWorkflowRequest) returns (ResumeTripWorkflowResponse);

  // Returns a trip.
  rpc InspectTripWorkflow(InspectTripWorkflowRequest) returns (InspectTripWorkflowResponse);

  // Lists trips a page at a time.
  rpc ListTripWorkflows(ListTripWorkflowsRequest) returns (ListTripWorkflowsResponse);

  // Signals a trip.
  rpc SignalTripWorkflow(SignalTripWorkflowRequest) returns (SignalTripWorkflowResponse);
}

// The request of `StartTripWorkflow`.
message StartTripWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_id = 2;
  Trip trip = 3;
  StartTripWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTripWorkflow`.
message StartTripWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Trip trip = 1;
  StartTripWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

