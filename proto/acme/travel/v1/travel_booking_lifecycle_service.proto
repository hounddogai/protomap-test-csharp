syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelBookingLifecycleServiceProto";
option java_package = "com.acme.travel.v1";

// Moves a travel booking between the states of its lifecycle.
service TravelBookingLifecycleService {
  // Activates a travel booking.
  rpc ActivateTravelBooking(ActivateTravelBookingRequest) returns (ActivateTravelBookingResponse);

  // Suspends a travel booking.
  rpc SuspendTravelBooking(SuspendTravelBookingRequest) returns (SuspendTravelBookingResponse);

  // Reinstates a travel booking.
  rpc ReinstateTravelBooking(ReinstateTravelBookingRequest) returns (ReinstateTravelBookingResponse);

  // Terminates a travel booking.
  rpc TerminateTravelBooking(TerminateTravelBookingRequest) returns (TerminateTravelBookingResponse);

  // Renews a travel booking.
  rpc RenewTravelBooking(RenewTravelBookingRequest) returns (RenewTravelBookingResponse);

  // Expires a travel booking.
  rpc ExpireTravelBooking(ExpireTravelBookingRequest) returns (ExpireTravelBookingResponse);

  // Returns a travel booking.
  rpc GetTravelBookingLifecycle(GetTravelBookingLifecycleRequest) returns (GetTravelBookingLifecycleResponse);

  // Schedules a travel booking.
  rpc ScheduleTravelBookingExpiry(ScheduleTravelBookingExpiryRequest) returns (ScheduleTravelBookingExpiryResponse);
}

// The request of `ActivateTravelBooking`.
message ActivateTravelBookingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  ActivateTravelBookingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTravelBooking`.
message ActivateTravelBookingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelBooking travel_booking = 1;
  ActivateTravelBookingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

