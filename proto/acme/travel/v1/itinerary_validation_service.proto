syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "ItineraryValidationServiceProto";
option java_package = "com.acme.travel.v1";

// Checks itineraries against the rules before anything acts on them.
service ItineraryValidationService {
  // Validates an itinerary.
  rpc ValidateItinerary(ValidateItineraryRequest) returns (ValidateItineraryResponse);

  // Previews an itinerary.
  rpc PreviewItinerary(PreviewItineraryRequest) returns (PreviewItineraryResponse);

  // Checks an itinerary.
  rpc CheckItineraryEligibility(CheckItineraryEligibilityRequest) returns (CheckItineraryEligibilityResponse);

  // Normalizes an itinerary.
  rpc NormalizeItinerary(NormalizeItineraryRequest) returns (NormalizeItineraryResponse);

  // Explains an itinerary.
  rpc ExplainItineraryDecision(ExplainItineraryDecisionRequest) returns (ExplainItineraryDecisionResponse);

  // Scores an itinerary.
  rpc ScoreItinerary(ScoreItineraryRequest) returns (ScoreItineraryResponse);

  // Lints an itinerary.
  rpc LintItineraries(LintItinerariesRequest) returns (LintItinerariesResponse);
}

// The request of `ValidateItinerary`.
message ValidateItineraryRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  Itinerary itinerary = 3;
  ValidateItineraryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateItinerary`.
message ValidateItineraryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Itinerary itinerary = 1;
  ValidateItineraryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

