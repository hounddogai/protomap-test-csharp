option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicyWorkflowServiceProto";
option java_package = "com.acme.travel.v1";

// Runs the long-lived workflow that takes a travel policy from start to finish.
service TravelPolicyWorkflowService {
  // Starts a travel policy.
  rpc StartTravelPolicyWorkflow(StartTravelPolicyWorkflowRequest) returns (StartTravelPolicyWorkflowResponse);

  // Advances a travel policy.
  rpc AdvanceTravelPolicyWorkflow(AdvanceTravelPolicyWorkflowRequest) returns (AdvanceTravelPolicyWorkflowResponse);

  // Cancels a travel policy.
  rpc CancelTravelPolicyWorkflow(CancelTravelPolicyWorkflowRequest) returns (CancelTravelPolicyWorkflowResponse);

  // Retrys a travel policy.
  rpc RetryTravelPolicyWorkflow(RetryTravelPolicyWorkflowRequest) returns (RetryTravelPolicyWorkflowResponse);

  // Pauses a travel policy.
  rpc PauseTravelPolicyWorkflow(PauseTravelPolicyWorkflowRequest) returns (PauseTravelPolicyWorkflowResponse);

  // Resumes a travel policy.
  rpc ResumeTravelPolicyWorkflow(ResumeTravelPolicyWorkflowRequest) returns (ResumeTravelPolicyWorkflowResponse);

  // Returns a travel policy.
  rpc InspectTravelPolicyWorkflow(InspectTravelPolicyWorkflowRequest) returns (InspectTravelPolicyWorkflowResponse);

  // Lists travel policies a page at a time.
  rpc ListTravelPolicyWorkflows(ListTravelPolicyWorkflowsRequest) returns (ListTravelPolicyWorkflowsResponse);

  // Signals a travel policy.
  rpc SignalTravelPolicyWorkflow(SignalTravelPolicyWorkflowRequest) returns (SignalTravelPolicyWorkflowResponse);
}

// The request of `StartTravelPolicyWorkflow`.
message StartTravelPolicyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  TravelPolicy travel_policy = 3;
  StartTravelPolicyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTravelPolicyWorkflow`.
message StartTravelPolicyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelPolicy travel_policy = 1;
  StartTravelPolicyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

