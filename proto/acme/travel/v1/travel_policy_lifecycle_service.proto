syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicyLifecycleServiceProto";
option java_package = "com.acme.travel.v1";

// Moves a travel policy between the states of its lifecycle.
service TravelPolicyLifecycleService {
  // Activates a travel policy.
  rpc ActivateTravelPolicy(ActivateTravelPolicyRequest) returns (ActivateTravelPolicyResponse);

  // Suspends a travel policy.
  rpc SuspendTravelPolicy(SuspendTravelPolicyRequest) returns (SuspendTravelPolicyResponse);

  // Reinstates a travel policy.
  rpc ReinstateTravelPolicy(ReinstateTravelPolicyRequest) returns (ReinstateTravelPolicyResponse);

  // Renews a travel policy.
  rpc RenewTravelPolicy(RenewTravelPolicyRequest) returns (RenewTravelPolicyResponse);

  // Expires a travel policy.
  rpc ExpireTravelPolicy(ExpireTravelPolicyRequest) returns (ExpireTravelPolicyResponse);

  // Returns a travel policy.
  rpc GetTravelPolicyLifecycle(GetTravelPolicyLifecycleRequest) returns (GetTravelPolicyLifecycleResponse);
}

// The request of `ActivateTravelPolicy`.
message ActivateTravelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  ActivateTravelPolicyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTravelPolicy`.
message ActivateTravelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelPolicy travel_policy = 1;
  ActivateTravelPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

