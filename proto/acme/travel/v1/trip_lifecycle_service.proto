syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TripLifecycleServiceProto";
option java_package = "com.acme.travel.v1";

// Moves a trip between the states of its lifecycle.
service TripLifecycleService {
  // Activates a trip.
  rpc ActivateTrip(ActivateTripRequest) returns (ActivateTripResponse);

  // Suspends a trip.
  rpc SuspendTrip(SuspendTripRequest) returns (SuspendTripResponse);

  // Reinstates a trip.
  rpc ReinstateTrip(ReinstateTripRequest) returns (ReinstateTripResponse);

  // Terminates a trip.
  rpc TerminateTrip(TerminateTripRequest) returns (TerminateTripResponse);

  // Renews a trip.
  rpc RenewTrip(RenewTripRequest) returns (RenewTripResponse);

  // Expires a trip.
  rpc ExpireTrip(ExpireTripRequest) returns (ExpireTripResponse);

  // Returns a trip.
  rpc GetTripLifecycle(GetTripLifecycleRequest) returns (GetTripLifecycleResponse);

  // Schedules a trip.
  rpc ScheduleTripExpiry(ScheduleTripExpiryRequest) returns (ScheduleTripExpiryResponse);
}

// The request of `ActivateTrip`.
message ActivateTripRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string trip_id = 2;
  ActivateTripRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTrip`.
message ActivateTripResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Trip trip = 1;
  ActivateTripResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

