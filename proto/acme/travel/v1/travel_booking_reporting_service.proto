syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelBookingReportingServiceProto";
option java_package = "com.acme.travel.v1";

// Builds and schedules reports about travel bookings.
service TravelBookingReportingService {
  // Generates a travel booking.
  rpc GenerateTravelBookingReport(GenerateTravelBookingReportRequest) returns (GenerateTravelBookingReportResponse);

  // Returns a travel booking.
  rpc FetchTravelBookingReport(FetchTravelBookingReportRequest) returns (FetchTravelBookingReportResponse);

  // Schedules a travel booking.
  rpc ScheduleTravelBookingReport(ScheduleTravelBookingReportRequest) returns (ScheduleTravelBookingReportResponse);

  // Streams the changes of travel bookings as they happen.
  rpc StreamTravelBookingMetrics(StreamTravelBookingMetricsRequest) returns (stream StreamTravelBookingMetricsResponse);

  // Shares a travel booking.
  rpc ShareTravelBookingReport(ShareTravelBookingReportRequest) returns (ShareTravelBookingReportResponse);

  // Counts travel bookings by status.
  rpc CountTravelBookingTotals(CountTravelBookingTotalsRequest) returns (CountTravelBookingTotalsResponse);

  // Deletes a travel booking.
  rpc DeleteTravelBookingReport(DeleteTravelBookingReportRequest) returns (DeleteTravelBookingReportResponse);
}

// The request of `GenerateTravelBookingReport`.
message GenerateTravelBookingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  GenerateTravelBookingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTravelBookingReport`.
message GenerateTravelBookingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTravelBookingReport`.
message FetchTravelBookingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTravelBookingReport`.
message FetchTravelBookingReportResponse {
  TravelBooking travel_booking = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTravelBookingReport`.
message ScheduleTravelBookingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  ScheduleTravelBookingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTravelBookingReport`.
message ScheduleTravelBookingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTravelBookingMetrics`.
message StreamTravelBookingMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TravelBookingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTravelBookingMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTravelBookingMetrics`.
message StreamTravelBookingMetricsResponse {
  TravelBooking travel_booking = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareTravelBookingReport`.
message ShareTravelBookingReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  ShareTravelBookingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTravelBookingReport`.
message ShareTravelBookingReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelBooking travel_booking = 1;
  ShareTravelBookingReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTravelBookingTotals`.
message CountTravelBookingTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TravelBookingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTravelBookingTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTravelBookingTotals`.
message CountTravelBookingTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteTravelBookingReport`.
message DeleteTravelBookingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTravelBookingReport`.
message DeleteTravelBookingReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
