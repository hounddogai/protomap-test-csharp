syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelBookingApprovalServiceProto";
option java_package = "com.acme.travel.v1";

// Routes travel bookings through approval, with escalation and delegation.
service TravelBookingApprovalService {
  // Submits a travel booking.
  rpc SubmitTravelBooking(SubmitTravelBookingRequest) returns (SubmitTravelBookingResponse);

  // Approves a travel booking.
  rpc ApproveTravelBooking(ApproveTravelBookingRequest) returns (ApproveTravelBookingResponse);

  // Rejects a travel booking.
  rpc RejectTravelBooking(RejectTravelBookingRequest) returns (RejectTravelBookingResponse);

  // Escalates a travel booking.
  rpc EscalateTravelBooking(EscalateTravelBookingRequest) returns (EscalateTravelBookingResponse);

  // Lists travel bookings a page at a time.
  rpc ListPendingTravelBookings(ListPendingTravelBookingsRequest) returns (ListPendingTravelBookingsResponse);

  // Returns a travel booking.
  rpc GetTravelBookingApprovalStatus(GetTravelBookingApprovalStatusRequest) returns (GetTravelBookingApprovalStatusResponse);

  // Comments a travel booking.
  rpc CommentTravelBookingApproval(CommentTravelBookingApprovalRequest) returns (CommentTravelBookingApprovalResponse);
}

// The request of `SubmitTravelBooking`.
message SubmitTravelBookingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  TravelBooking travel_booking = 3;
  SubmitTravelBookingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTravelBooking`.
message SubmitTravelBookingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelBooking travel_booking = 1;
  SubmitTravelBookingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveTravelBooking`.
message ApproveTravelBookingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
