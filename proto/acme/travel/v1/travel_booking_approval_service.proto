// The request of `ListPendingTravelBookings`.
message ListPendingTravelBookingsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TravelBookingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingTravelBookingsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingTravelBookings`.
message ListPendingTravelBookingsResponse {
  repeated TravelBooking travel_bookings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTravelBookingApprovalStatus`.
message GetTravelBookingApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTravelBookingApprovalStatus`.
message GetTravelBookingApprovalStatusResponse {
