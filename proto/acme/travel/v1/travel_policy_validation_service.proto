syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicyValidationServiceProto";
option java_package = "com.acme.travel.v1";

// Checks travel policies against the rules before anything acts on them.
service TravelPolicyValidationService {
  // Validates a travel policy.
  rpc ValidateTravelPolicy(ValidateTravelPolicyRequest) returns (ValidateTravelPolicyResponse);

  // Previews a travel policy.
  rpc PreviewTravelPolicy(PreviewTravelPolicyRequest) returns (PreviewTravelPolicyResponse);

  // Normalizes a travel policy.
  rpc NormalizeTravelPolicy(NormalizeTravelPolicyRequest) returns (NormalizeTravelPolicyResponse);

  // Explains a travel policy.
  rpc ExplainTravelPolicyDecision(ExplainTravelPolicyDecisionRequest) returns (ExplainTravelPolicyDecisionResponse);

  // Scores a travel policy.
  rpc ScoreTravelPolicy(ScoreTravelPolicyRequest) returns (ScoreTravelPolicyResponse);

  // Returns a travel policy.
  rpc GetTravelPolicyRules(GetTravelPolicyRulesRequest) returns (GetTravelPolicyRulesResponse);
}

// The request of `ValidateTravelPolicy`.
message ValidateTravelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  TravelPolicy travel_policy = 3;
  ValidateTravelPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTravelPolicy`.
message ValidateTravelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelPolicy travel_policy = 1;
  ValidateTravelPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewTravelPolicy`.
message PreviewTravelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
