  TravelPolicy travel_policy = 3;
  NormalizeTravelPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `NormalizeTravelPolicy`.
message NormalizeTravelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
