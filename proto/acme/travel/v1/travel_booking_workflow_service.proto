syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelBookingWorkflowServiceProto";
option java_package = "com.acme.travel.v1";

// Runs the long-lived workflow that takes a travel booking from start to finish.
service TravelBookingWorkflowService {
  // Starts a travel booking.
  rpc StartTravelBookingWorkflow(StartTravelBookingWorkflowRequest) returns (StartTravelBookingWorkflowResponse);

  // Advances a travel booking.
  rpc AdvanceTravelBookingWorkflow(AdvanceTravelBookingWorkflowRequest) returns (AdvanceTravelBookingWorkflowResponse);

  // Retrys a travel booking.
  rpc RetryTravelBookingWorkflow(RetryTravelBookingWorkflowRequest) returns (RetryTravelBookingWorkflowResponse);

  // Pauses a travel booking.
  rpc PauseTravelBookingWorkflow(PauseTravelBookingWorkflowRequest) returns (PauseTravelBookingWorkflowResponse);

  // Resumes a travel booking.
  rpc ResumeTravelBookingWorkflow(ResumeTravelBookingWorkflowRequest) returns (ResumeTravelBookingWorkflowResponse);

  // Lists travel bookings a page at a time.
  rpc ListTravelBookingWorkflows(ListTravelBookingWorkflowsRequest) returns (ListTravelBookingWorkflowsResponse);

  // Signals a travel booking.
  rpc SignalTravelBookingWorkflow(SignalTravelBookingWorkflowRequest) returns (SignalTravelBookingWorkflowResponse);
}

// The request of `StartTravelBookingWorkflow`.
message StartTravelBookingWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  TravelBooking travel_booking = 3;
  StartTravelBookingWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTravelBookingWorkflow`.
message StartTravelBookingWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelBooking travel_booking = 1;
  StartTravelBookingWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

