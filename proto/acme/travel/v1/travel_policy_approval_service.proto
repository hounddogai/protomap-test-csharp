syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicyApprovalServiceProto";
option java_package = "com.acme.travel.v1";

// Routes travel policies through approval, with escalation and delegation.
service TravelPolicyApprovalService {
  // Submits a travel policy.
  rpc SubmitTravelPolicy(SubmitTravelPolicyRequest) returns (SubmitTravelPolicyResponse);

  // Approves a travel policy.
  rpc ApproveTravelPolicy(ApproveTravelPolicyRequest) returns (ApproveTravelPolicyResponse);

  // Rejects a travel policy.
  rpc RejectTravelPolicy(RejectTravelPolicyRequest) returns (RejectTravelPolicyResponse);

  // Escalates a travel policy.
  rpc EscalateTravelPolicy(EscalateTravelPolicyRequest) returns (EscalateTravelPolicyResponse);

  // Lists travel policies a page at a time.
  rpc ListPendingTravelPolicies(ListPendingTravelPoliciesRequest) returns (ListPendingTravelPoliciesResponse);

  // Delegates a travel policy.
  rpc DelegateTravelPolicyApproval(DelegateTravelPolicyApprovalRequest) returns (DelegateTravelPolicyApprovalResponse);

  // Recalls a travel policy.
  rpc RecallTravelPolicy(RecallTravelPolicyRequest) returns (RecallTravelPolicyResponse);

  // Returns a travel policy.
  rpc GetTravelPolicyApprovalStatus(GetTravelPolicyApprovalStatusRequest) returns (GetTravelPolicyApprovalStatusResponse);

  // Comments a travel policy.
  rpc CommentTravelPolicyApproval(CommentTravelPolicyApprovalRequest) returns (CommentTravelPolicyApprovalResponse);
}

// The request of `SubmitTravelPolicy`.
message SubmitTravelPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  TravelPolicy travel_policy = 3;
  SubmitTravelPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTravelPolicy`.
message SubmitTravelPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelPolicy travel_policy = 1;
  SubmitTravelPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

