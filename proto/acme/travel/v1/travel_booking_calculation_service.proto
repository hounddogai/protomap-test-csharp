    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelBooking travel_booking = 1;
  ExplainTravelBookingCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTravelBookingRates`.
message GetTravelBookingRatesRequest {
