syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelBookingValidationServiceProto";
option java_package = "com.acme.travel.v1";

// Checks travel bookings against the rules before anything acts on them.
service TravelBookingValidationService {
  // Validates a travel booking.
  rpc ValidateTravelBooking(ValidateTravelBookingRequest) returns (ValidateTravelBookingResponse);

  // Previews a travel booking.
  rpc PreviewTravelBooking(PreviewTravelBookingRequest) returns (PreviewTravelBookingResponse);

  // Checks a travel booking.
  rpc CheckTravelBookingEligibility(CheckTravelBookingEligibilityRequest) returns (CheckTravelBookingEligibilityResponse);

  // Normalizes a travel booking.
  rpc NormalizeTravelBooking(NormalizeTravelBookingRequest) returns (NormalizeTravelBookingResponse);

  // Explains a travel booking.
  rpc ExplainTravelBookingDecision(ExplainTravelBookingDecisionRequest) returns (ExplainTravelBookingDecisionResponse);

  // Scores a travel booking.
  rpc ScoreTravelBooking(ScoreTravelBookingRequest) returns (ScoreTravelBookingResponse);

  // Lints a travel booking.
  rpc LintTravelBookings(LintTravelBookingsRequest) returns (LintTravelBookingsResponse);

  // Returns a travel booking.
  rpc GetTravelBookingRules(GetTravelBookingRulesRequest) returns (GetTravelBookingRulesResponse);
}

// The request of `ValidateTravelBooking`.
message ValidateTravelBookingRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_booking_id = 2;
  TravelBooking travel_booking = 3;
  ValidateTravelBookingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTravelBooking`.
message ValidateTravelBookingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelBooking travel_booking = 1;
  ValidateTravelBookingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

