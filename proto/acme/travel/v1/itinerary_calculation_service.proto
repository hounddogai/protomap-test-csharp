syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "ItineraryCalculationServiceProto";
option java_package = "com.acme.travel.v1";

// Computes the figures of an itinerary, such as totals, taxes, and estimates.
service ItineraryCalculationService {
  // Calculates an itinerary.
  rpc CalculateItinerary(CalculateItineraryRequest) returns (CalculateItineraryResponse);

  // Estimates an itinerary.
  rpc EstimateItinerary(EstimateItineraryRequest) returns (EstimateItineraryResponse);

  // Quotes an itinerary.
  rpc QuoteItinerary(QuoteItineraryRequest) returns (QuoteItineraryResponse);

  // Compares an itinerary.
  rpc CompareItineraryOptions(CompareItineraryOptionsRequest) returns (CompareItineraryOptionsResponse);

  // Recalculates an itinerary.
  rpc RecalculateItineraries(RecalculateItinerariesRequest) returns (RecalculateItinerariesResponse);

  // Simulates an itinerary.
  rpc SimulateItinerary(SimulateItineraryRequest) returns (SimulateItineraryResponse);

  // Explains an itinerary.
  rpc ExplainItineraryCalculation(ExplainItineraryCalculationRequest) returns (ExplainItineraryCalculationResponse);

  // Returns an itinerary.
  rpc GetItineraryRates(GetItineraryRatesRequest) returns (GetItineraryRatesResponse);
}

// The request of `CalculateItinerary`.
message CalculateItineraryRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string itinerary_id = 2;
  Itinerary itinerary = 3;
  CalculateItineraryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateItinerary`.
message CalculateItineraryResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateItineraryResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Itinerary itinerary = 1;
  CalculateItineraryResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

