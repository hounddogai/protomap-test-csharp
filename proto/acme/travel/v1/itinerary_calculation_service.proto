  map<string, string> annotations = 6;
}

// The response of `ExplainItineraryCalculation`.
message ExplainItineraryCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Itinerary itinerary = 1;
  ExplainItineraryCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetItineraryRates`.
message GetItineraryRatesRequest {
