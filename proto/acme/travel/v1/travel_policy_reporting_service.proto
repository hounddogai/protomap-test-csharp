syntax = "proto3";

package acme.travel.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/travel/v1/travel.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Travel.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/travel/v1;travelv1";
option java_multiple_files = true;
option java_outer_classname = "TravelPolicyReportingServiceProto";
option java_package = "com.acme.travel.v1";

// Builds and schedules reports about travel policies.
service TravelPolicyReportingService {
  // Generates a travel policy.
  rpc GenerateTravelPolicyReport(GenerateTravelPolicyReportRequest) returns (GenerateTravelPolicyReportResponse);

  // Returns a travel policy.
  rpc FetchTravelPolicyReport(FetchTravelPolicyReportRequest) returns (FetchTravelPolicyReportResponse);

  // Schedules a travel policy.
  rpc ScheduleTravelPolicyReport(ScheduleTravelPolicyReportRequest) returns (ScheduleTravelPolicyReportResponse);

  // Streams the changes of travel policies as they happen.
  rpc StreamTravelPolicyMetrics(StreamTravelPolicyMetricsRequest) returns (stream StreamTravelPolicyMetricsResponse);

  // Lists travel policies a page at a time.
  rpc ListTravelPolicyReports(ListTravelPolicyReportsRequest) returns (ListTravelPolicyReportsResponse);

  // Shares a travel policy.
  rpc ShareTravelPolicyReport(ShareTravelPolicyReportRequest) returns (ShareTravelPolicyReportResponse);

  // Counts travel policies by status.
  rpc CountTravelPolicyTotals(CountTravelPolicyTotalsRequest) returns (CountTravelPolicyTotalsResponse);

  // Deletes a travel policy.
  rpc DeleteTravelPolicyReport(DeleteTravelPolicyReportRequest) returns (DeleteTravelPolicyReportResponse);
}

// The request of `GenerateTravelPolicyReport`.
message GenerateTravelPolicyReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  GenerateTravelPolicyReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTravelPolicyReport`.
message GenerateTravelPolicyReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTravelPolicyReport`.
message FetchTravelPolicyReportRequest {
  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTravelPolicyReport`.
message FetchTravelPolicyReportResponse {
  TravelPolicy travel_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTravelPolicyReport`.
message ScheduleTravelPolicyReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  ScheduleTravelPolicyReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTravelPolicyReport`.
message ScheduleTravelPolicyReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTravelPolicyMetrics`.
message StreamTravelPolicyMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TravelPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTravelPolicyMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTravelPolicyMetrics`.
message StreamTravelPolicyMetricsResponse {
  TravelPolicy travel_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListTravelPolicyReports`.
message ListTravelPolicyReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TravelPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTravelPolicyReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTravelPolicyReports`.
message ListTravelPolicyReportsResponse {
  repeated TravelPolicy travel_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareTravelPolicyReport`.
message ShareTravelPolicyReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  ShareTravelPolicyReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTravelPolicyReport`.
message ShareTravelPolicyReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TravelPolicy travel_policy = 1;
  ShareTravelPolicyReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTravelPolicyTotals`.
message CountTravelPolicyTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TravelPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTravelPolicyTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTravelPolicyTotals`.
message CountTravelPolicyTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteTravelPolicyReport`.
message DeleteTravelPolicyReportRequest {
  acme.common.v1.RequestContext context = 1;
  string travel_policy_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTravelPolicyReport`.
message DeleteTravelPolicyReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
