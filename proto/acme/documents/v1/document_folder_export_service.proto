syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentFolderExportServiceProto";
option java_package = "com.acme.documents.v1";

// Exports document folders to files and other systems.
service DocumentFolderExportService {
  // Streams every matching document folder.
  rpc StreamDocumentFolderExport(StreamDocumentFolderExportRequest) returns (stream StreamDocumentFolderExportResponse);

  // Returns a document folder.
  rpc GetDocumentFolderExport(GetDocumentFolderExportRequest) returns (GetDocumentFolderExportResponse);

  // Cancels a document folder.
  rpc CancelDocumentFolderExport(CancelDocumentFolderExportRequest) returns (CancelDocumentFolderExportResponse);

  // Lists document folders a page at a time.
  rpc ListDocumentFolderExports(ListDocumentFolderExportsRequest) returns (ListDocumentFolderExportsResponse);

  // Schedules a document folder.
  rpc ScheduleDocumentFolderExport(ScheduleDocumentFolderExportRequest) returns (ScheduleDocumentFolderExportResponse);

  // Retrys a document folder.
  rpc RetryDocumentFolderExport(RetryDocumentFolderExportRequest) returns (RetryDocumentFolderExportResponse);

  // Shares a document folder.
  rpc ShareDocumentFolderExport(ShareDocumentFolderExportRequest) returns (ShareDocumentFolderExportResponse);
}

// The request of `StreamDocumentFolderExport`.
message StreamDocumentFolderExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentFolderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDocumentFolderExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamDocumentFolderExport`.
message StreamDocumentFolderExportResponse {
  DocumentFolder document_folder = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetDocumentFolderExport`.
message GetDocumentFolderExportRequest {
  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDocumentFolderExport`.
message GetDocumentFolderExportResponse {
  DocumentFolder document_folder = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelDocumentFolderExport`.
message CancelDocumentFolderExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  CancelDocumentFolderExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelDocumentFolderExport`.
message CancelDocumentFolderExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  CancelDocumentFolderExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDocumentFolderExports`.
message ListDocumentFolderExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentFolderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentFolderExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentFolderExports`.
message ListDocumentFolderExportsResponse {
  repeated DocumentFolder document_folders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleDocumentFolderExport`.
message ScheduleDocumentFolderExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  ScheduleDocumentFolderExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDocumentFolderExport`.
message ScheduleDocumentFolderExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryDocumentFolderExport`.
message RetryDocumentFolderExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  DocumentFolder document_folder = 3;
  RetryDocumentFolderExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryDocumentFolderExport`.
message RetryDocumentFolderExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  RetryDocumentFolderExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDocumentFolderExport`.
message ShareDocumentFolderExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  ShareDocumentFolderExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDocumentFolderExport`.
message ShareDocumentFolderExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  ShareDocumentFolderExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
