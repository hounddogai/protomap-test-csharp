syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentFolderSyncServiceProto";
option java_package = "com.acme.documents.v1";

// Keeps document folders in step with the systems of record in other regions.
service DocumentFolderSyncService {
  // Syncs a document folder.
  rpc SyncDocumentFolders(SyncDocumentFoldersRequest) returns (SyncDocumentFoldersResponse);

  // Pushs a document folder.
  rpc PushDocumentFolder(PushDocumentFolderRequest) returns (PushDocumentFolderResponse);

  // Pulls a document folder.
  rpc PullDocumentFolders(PullDocumentFoldersRequest) returns (PullDocumentFoldersResponse);

  // Reconciles a document folder.
  rpc ReconcileDocumentFolders(ReconcileDocumentFoldersRequest) returns (ReconcileDocumentFoldersResponse);

  // Exchanges changes of document folders with a peer.
  rpc StreamDocumentFolderChanges(stream StreamDocumentFolderChangesRequest) returns (stream StreamDocumentFolderChangesResponse);

  // Resolves a document folder.
  rpc ResolveDocumentFolderConflict(ResolveDocumentFolderConflictRequest) returns (ResolveDocumentFolderConflictResponse);

  // Returns a document folder.
  rpc GetDocumentFolderSyncState(GetDocumentFolderSyncStateRequest) returns (GetDocumentFolderSyncStateResponse);

  // Lists document folders a page at a time.
  rpc ListDocumentFolderConflicts(ListDocumentFolderConflictsRequest) returns (ListDocumentFolderConflictsResponse);
}

// The request of `SyncDocumentFolders`.
message SyncDocumentFoldersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  DocumentFolder document_folder = 3;
  SyncDocumentFoldersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncDocumentFolders`.
message SyncDocumentFoldersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  SyncDocumentFoldersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushDocumentFolder`.
message PushDocumentFolderRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  DocumentFolder document_folder = 3;
  PushDocumentFolderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushDocumentFolder`.
message PushDocumentFolderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  PushDocumentFolderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullDocumentFolders`.
message PullDocumentFoldersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  DocumentFolder document_folder = 3;
  PullDocumentFoldersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullDocumentFolders`.
message PullDocumentFoldersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
