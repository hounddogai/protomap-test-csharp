  }

  DocumentFolder document_folder = 1;
  PullDocumentFoldersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileDocumentFolders`.
message ReconcileDocumentFoldersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  DocumentFolder document_folder = 3;
  ReconcileDocumentFoldersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
