syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentHistoryServiceProto";
option java_package = "com.acme.documents.v1";

// Keeps every version of a document and restores earlier ones.
service DocumentHistoryService {
  // Records a document.
  rpc RecordDocumentVersion(RecordDocumentVersionRequest) returns (RecordDocumentVersionResponse);

  // Lists documents a page at a time.
  rpc ListDocumentVersions(ListDocumentVersionsRequest) returns (ListDocumentVersionsResponse);

  // Returns a document.
  rpc GetDocumentVersion(GetDocumentVersionRequest) returns (GetDocumentVersionResponse);

  // Compares a document.
  rpc CompareDocumentVersions(CompareDocumentVersionsRequest) returns (CompareDocumentVersionsResponse);

  // Reverts a document.
  rpc RevertDocument(RevertDocumentRequest) returns (RevertDocumentResponse);

  // Annotates a document.
  rpc AnnotateDocumentVersion(AnnotateDocumentVersionRequest) returns (AnnotateDocumentVersionResponse);

  // Deletes a document.
  rpc PruneDocumentVersions(PruneDocumentVersionsRequest) returns (PruneDocumentVersionsResponse);
}

// The request of `RecordDocumentVersion`.
message RecordDocumentVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  RecordDocumentVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordDocumentVersion`.
message RecordDocumentVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  RecordDocumentVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDocumentVersions`.
message ListDocumentVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentVersions`.
message ListDocumentVersionsResponse {
  repeated Document documents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDocumentVersion`.
message GetDocumentVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDocumentVersion`.
message GetDocumentVersionResponse {
  Document document = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareDocumentVersions`.
message CompareDocumentVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  CompareDocumentVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareDocumentVersions`.
message CompareDocumentVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  CompareDocumentVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertDocument`.
message RevertDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  RevertDocumentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertDocument`.
message RevertDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  RevertDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateDocumentVersion`.
message AnnotateDocumentVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  AnnotateDocumentVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateDocumentVersion`.
message AnnotateDocumentVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  AnnotateDocumentVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneDocumentVersions`.
message PruneDocumentVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneDocumentVersions`.
message PruneDocumentVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
