option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentTemplateWorkflowServiceProto";
option java_package = "com.acme.documents.v1";

// Runs the long-lived workflow that takes a document template from start to finish.
service DocumentTemplateWorkflowService {
  // Starts a document template.
  rpc StartDocumentTemplateWorkflow(StartDocumentTemplateWorkflowRequest) returns (StartDocumentTemplateWorkflowResponse);

  // Advances a document template.
  rpc AdvanceDocumentTemplateWorkflow(AdvanceDocumentTemplateWorkflowRequest) returns (AdvanceDocumentTemplateWorkflowResponse);

  // Cancels a document template.
  rpc CancelDocumentTemplateWorkflow(CancelDocumentTemplateWorkflowRequest) returns (CancelDocumentTemplateWorkflowResponse);

  // Retrys a document template.
  rpc RetryDocumentTemplateWorkflow(RetryDocumentTemplateWorkflowRequest) returns (RetryDocumentTemplateWorkflowResponse);

  // Pauses a document template.
  rpc PauseDocumentTemplateWorkflow(PauseDocumentTemplateWorkflowRequest) returns (PauseDocumentTemplateWorkflowResponse);

  // Resumes a document template.
  rpc ResumeDocumentTemplateWorkflow(ResumeDocumentTemplateWorkflowRequest) returns (ResumeDocumentTemplateWorkflowResponse);

  // Returns a document template.
  rpc InspectDocumentTemplateWorkflow(InspectDocumentTemplateWorkflowRequest) returns (InspectDocumentTemplateWorkflowResponse);

  // Lists document templates a page at a time.
  rpc ListDocumentTemplateWorkflows(ListDocumentTemplateWorkflowsRequest) returns (ListDocumentTemplateWorkflowsResponse);

  // Signals a document template.
  rpc SignalDocumentTemplateWorkflow(SignalDocumentTemplateWorkflowRequest) returns (SignalDocumentTemplateWorkflowResponse);
}

// The request of `StartDocumentTemplateWorkflow`.
message StartDocumentTemplateWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  DocumentTemplate document_template = 3;
  StartDocumentTemplateWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDocumentTemplateWorkflow`.
message StartDocumentTemplateWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  StartDocumentTemplateWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

