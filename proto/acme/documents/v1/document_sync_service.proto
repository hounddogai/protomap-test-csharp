syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentSyncServiceProto";
option java_package = "com.acme.documents.v1";

// Keeps documents in step with the systems of record in other regions.
service DocumentSyncService {
  // Syncs a document.
  rpc SyncDocuments(SyncDocumentsRequest) returns (SyncDocumentsResponse);

  // Pushs a document.
  rpc PushDocument(PushDocumentRequest) returns (PushDocumentResponse);

  // Pulls a document.
  rpc PullDocuments(PullDocumentsRequest) returns (PullDocumentsResponse);

  // Reconciles a document.
  rpc ReconcileDocuments(ReconcileDocumentsRequest) returns (ReconcileDocumentsResponse);

  // Exchanges changes of documents with a peer.
  rpc StreamDocumentChanges(stream StreamDocumentChangesRequest) returns (stream StreamDocumentChangesResponse);

  // Resolves a document.
  rpc ResolveDocumentConflict(ResolveDocumentConflictRequest) returns (ResolveDocumentConflictResponse);

  // Returns a document.
  rpc GetDocumentSyncState(GetDocumentSyncStateRequest) returns (GetDocumentSyncStateResponse);

  // Lists documents a page at a time.
  rpc ListDocumentConflicts(ListDocumentConflictsRequest) returns (ListDocumentConflictsResponse);
}

// The request of `SyncDocuments`.
message SyncDocumentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  SyncDocumentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncDocuments`.
message SyncDocumentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  SyncDocumentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushDocument`.
message PushDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  PushDocumentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushDocument`.
message PushDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  PushDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullDocuments`.
message PullDocumentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  PullDocumentsRequest.Details details = 4;
