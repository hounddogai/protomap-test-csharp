    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  ResolveDocumentConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolveDocumentConflict`.
message ResolveDocumentConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
