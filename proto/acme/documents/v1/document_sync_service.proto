  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDocumentSyncState`.
message GetDocumentSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDocumentSyncState`.
message GetDocumentSyncStateResponse {
  Document document = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListDocumentConflicts`.
message ListDocumentConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentConflicts`.
message ListDocumentConflictsResponse {
  repeated Document documents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
