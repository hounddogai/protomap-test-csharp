syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "SignatureExportServiceProto";
option java_package = "com.acme.documents.v1";

// Exports signatures to files and other systems.
service SignatureExportService {
  // Streams every matching signature.
  rpc StreamSignatureExport(StreamSignatureExportRequest) returns (stream StreamSignatureExportResponse);

  // Returns a signature.
  rpc GetSignatureExport(GetSignatureExportRequest) returns (GetSignatureExportResponse);

  // Cancels a signature.
  rpc CancelSignatureExport(CancelSignatureExportRequest) returns (CancelSignatureExportResponse);

  // Lists signatures a page at a time.
  rpc ListSignatureExports(ListSignatureExportsRequest) returns (ListSignatureExportsResponse);

  // Schedules a signature.
  rpc ScheduleSignatureExport(ScheduleSignatureExportRequest) returns (ScheduleSignatureExportResponse);

  // Retrys a signature.
  rpc RetrySignatureExport(RetrySignatureExportRequest) returns (RetrySignatureExportResponse);

  // Shares a signature.
  rpc ShareSignatureExport(ShareSignatureExportRequest) returns (ShareSignatureExportResponse);
}

// The request of `StreamSignatureExport`.
message StreamSignatureExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SignatureStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSignatureExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamSignatureExport`.
message StreamSignatureExportResponse {
  Signature signature = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetSignatureExport`.
message GetSignatureExportRequest {
  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSignatureExport`.
message GetSignatureExportResponse {
  Signature signature = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelSignatureExport`.
message CancelSignatureExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  CancelSignatureExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelSignatureExport`.
message CancelSignatureExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Signature signature = 1;
  CancelSignatureExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListSignatureExports`.
message ListSignatureExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SignatureStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSignatureExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSignatureExports`.
message ListSignatureExportsResponse {
  repeated Signature signatures = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleSignatureExport`.
message ScheduleSignatureExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  ScheduleSignatureExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSignatureExport`.
message ScheduleSignatureExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetrySignatureExport`.
message RetrySignatureExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  Signature signature = 3;
  RetrySignatureExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetrySignatureExport`.
message RetrySignatureExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Signature signature = 1;
  RetrySignatureExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareSignatureExport`.
message ShareSignatureExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  ShareSignatureExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSignatureExport`.
message ShareSignatureExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Signature signature = 1;
  ShareSignatureExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
