syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentExportServiceProto";
option java_package = "com.acme.documents.v1";

// Exports documents to files and other systems.
service DocumentExportService {
  // Streams every matching document.
  rpc StreamDocumentExport(StreamDocumentExportRequest) returns (stream StreamDocumentExportResponse);

  // Returns a document.
  rpc GetDocumentExport(GetDocumentExportRequest) returns (GetDocumentExportResponse);

  // Cancels a document.
  rpc CancelDocumentExport(CancelDocumentExportRequest) returns (CancelDocumentExportResponse);

  // Lists documents a page at a time.
  rpc ListDocumentExports(ListDocumentExportsRequest) returns (ListDocumentExportsResponse);

  // Schedules a document.
  rpc ScheduleDocumentExport(ScheduleDocumentExportRequest) returns (ScheduleDocumentExportResponse);

  // Retrys a document.
  rpc RetryDocumentExport(RetryDocumentExportRequest) returns (RetryDocumentExportResponse);

  // Shares a document.
  rpc ShareDocumentExport(ShareDocumentExportRequest) returns (ShareDocumentExportResponse);
}

// The request of `StreamDocumentExport`.
message StreamDocumentExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDocumentExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamDocumentExport`.
message StreamDocumentExportResponse {
  Document document = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetDocumentExport`.
message GetDocumentExportRequest {
  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDocumentExport`.
message GetDocumentExportResponse {
  Document document = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelDocumentExport`.
message CancelDocumentExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  CancelDocumentExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelDocumentExport`.
message CancelDocumentExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  CancelDocumentExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDocumentExports`.
message ListDocumentExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentExports`.
message ListDocumentExportsResponse {
  repeated Document documents = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleDocumentExport`.
message ScheduleDocumentExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  ScheduleDocumentExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDocumentExport`.
message ScheduleDocumentExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryDocumentExport`.
message RetryDocumentExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  Document document = 3;
  RetryDocumentExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryDocumentExport`.
message RetryDocumentExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  RetryDocumentExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDocumentExport`.
message ShareDocumentExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  ShareDocumentExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDocumentExport`.
message ShareDocumentExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  ShareDocumentExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
