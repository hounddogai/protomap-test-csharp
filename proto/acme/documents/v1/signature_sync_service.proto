// The request of `GetSignatureSyncState`.
message GetSignatureSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSignatureSyncState`.
message GetSignatureSyncStateResponse {
  Signature signature = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListSignatureConflicts`.
message ListSignatureConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SignatureStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSignatureConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSignatureConflicts`.
message ListSignatureConflictsResponse {
  repeated Signature signatures = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
