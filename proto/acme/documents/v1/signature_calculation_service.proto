syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "SignatureCalculationServiceProto";
option java_package = "com.acme.documents.v1";

// Computes the figures of a signature, such as totals, taxes, and estimates.
service SignatureCalculationService {
  // Calculates a signature.
  rpc CalculateSignature(CalculateSignatureRequest) returns (CalculateSignatureResponse);

  // Estimates a signature.
  rpc EstimateSignature(EstimateSignatureRequest) returns (EstimateSignatureResponse);

  // Quotes a signature.
  rpc QuoteSignature(QuoteSignatureRequest) returns (QuoteSignatureResponse);

  // Recalculates a signature.
  rpc RecalculateSignatures(RecalculateSignaturesRequest) returns (RecalculateSignaturesResponse);

  // Simulates a signature.
  rpc SimulateSignature(SimulateSignatureRequest) returns (SimulateSignatureResponse);

  // Explains a signature.
  rpc ExplainSignatureCalculation(ExplainSignatureCalculationRequest) returns (ExplainSignatureCalculationResponse);

  // Returns a signature.
  rpc GetSignatureRates(GetSignatureRatesRequest) returns (GetSignatureRatesResponse);
}

// The request of `CalculateSignature`.
message CalculateSignatureRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  Signature signature = 3;
  CalculateSignatureRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSignature`.
message CalculateSignatureResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSignatureResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Signature signature = 1;
  CalculateSignatureResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

