syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentTemplateNotificationServiceProto";
option java_package = "com.acme.documents.v1";

// Tells the people who follow a document template what changed.
service DocumentTemplateNotificationService {
  // Subscribes a document template.
  rpc SubscribeDocumentTemplateUpdates(SubscribeDocumentTemplateUpdatesRequest) returns (SubscribeDocumentTemplateUpdatesResponse);

  // Unsubscribes a document template.
  rpc UnsubscribeDocumentTemplateUpdates(UnsubscribeDocumentTemplateUpdatesRequest) returns (UnsubscribeDocumentTemplateUpdatesResponse);

  // Notifys a document template.
  rpc NotifyDocumentTemplateWatchers(NotifyDocumentTemplateWatchersRequest) returns (NotifyDocumentTemplateWatchersResponse);

  // Lists document templates a page at a time.
  rpc ListDocumentTemplateSubscriptions(ListDocumentTemplateSubscriptionsRequest) returns (ListDocumentTemplateSubscriptionsResponse);

  // Sends a document template.
  rpc SendDocumentTemplateTestNotice(SendDocumentTemplateTestNoticeRequest) returns (SendDocumentTemplateTestNoticeResponse);

  // Returns a document template.
  rpc GetDocumentTemplatePreferences(GetDocumentTemplatePreferencesRequest) returns (GetDocumentTemplatePreferencesResponse);

  // Streams the changes of document templates as they happen.
  rpc StreamDocumentTemplateNotices(StreamDocumentTemplateNoticesRequest) returns (stream StreamDocumentTemplateNoticesResponse);
}

// The request of `SubscribeDocumentTemplateUpdates`.
message SubscribeDocumentTemplateUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  SubscribeDocumentTemplateUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDocumentTemplateUpdates`.
message SubscribeDocumentTemplateUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  SubscribeDocumentTemplateUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDocumentTemplateUpdates`.
message UnsubscribeDocumentTemplateUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  UnsubscribeDocumentTemplateUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDocumentTemplateUpdates`.
message UnsubscribeDocumentTemplateUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  UnsubscribeDocumentTemplateUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDocumentTemplateWatchers`.
message NotifyDocumentTemplateWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  NotifyDocumentTemplateWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyDocumentTemplateWatchers`.
message NotifyDocumentTemplateWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  NotifyDocumentTemplateWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDocumentTemplateSubscriptions`.
message ListDocumentTemplateSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentTemplateSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentTemplateSubscriptions`.
message ListDocumentTemplateSubscriptionsResponse {
  repeated DocumentTemplate document_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendDocumentTemplateTestNotice`.
message SendDocumentTemplateTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
