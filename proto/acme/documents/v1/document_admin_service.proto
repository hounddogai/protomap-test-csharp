syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentAdminServiceProto";
option java_package = "com.acme.documents.v1";

// Operator actions on documents that support staff run by hand.
service DocumentAdminService {
  // Archives a document.
  rpc ArchiveDocument(ArchiveDocumentRequest) returns (ArchiveDocumentResponse);

  // Restores a document.
  rpc RestoreDocument(RestoreDocumentRequest) returns (RestoreDocumentResponse);

  // Deletes a document.
  rpc PurgeDocument(PurgeDocumentRequest) returns (PurgeDocumentResponse);

  // Reassigns a document.
  rpc ReassignDocument(ReassignDocumentRequest) returns (ReassignDocumentResponse);

  // Locks a document.
  rpc LockDocument(LockDocumentRequest) returns (LockDocumentResponse);

  // Transfers a document.
  rpc TransferDocument(TransferDocumentRequest) returns (TransferDocumentResponse);

  // Returns a document.
  rpc InspectDocument(InspectDocumentRequest) returns (InspectDocumentResponse);
}

// The request of `ArchiveDocument`.
message ArchiveDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  ArchiveDocumentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveDocument`.
message ArchiveDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  ArchiveDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreDocument`.
message RestoreDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  RestoreDocumentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `RestoreDocument`.
message RestoreDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  RestoreDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeDocument`.
message PurgeDocumentRequest {
  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeDocument`.
message PurgeDocumentResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignDocument`.
message ReassignDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  ReassignDocumentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReassignDocument`.
message ReassignDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  ReassignDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `LockDocument`.
message LockDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  LockDocumentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `LockDocument`.
message LockDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  LockDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `TransferDocument`.
message TransferDocumentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  TransferDocumentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `TransferDocument`.
message TransferDocumentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Document document = 1;
  TransferDocumentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `InspectDocument`.
message InspectDocumentRequest {
  acme.common.v1.RequestContext context = 1;
  string document_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectDocument`.
message InspectDocumentResponse {
  Document document = 1;
  acme.common.v1.OperationResult result = 2;
}
