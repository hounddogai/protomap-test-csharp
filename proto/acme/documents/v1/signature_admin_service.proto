// The request of `InspectSignature`.
message InspectSignatureRequest {
  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectSignature`.
message InspectSignatureResponse {
