// The request of `PurgeSignature`.
message PurgeSignatureRequest {
  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeSignature`.
message PurgeSignatureResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignSignature`.
message ReassignSignatureRequest {
