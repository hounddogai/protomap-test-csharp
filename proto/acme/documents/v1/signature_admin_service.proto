    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  Signature signature = 3;
  RepairSignatureRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
