syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "SignatureAdminServiceProto";
option java_package = "com.acme.documents.v1";

// Operator actions on signatures that support staff run by hand.
service SignatureAdminService {
  // Archives a signature.
  rpc ArchiveSignature(ArchiveSignatureRequest) returns (ArchiveSignatureResponse);

  // Restores a signature.
  rpc RestoreSignature(RestoreSignatureRequest) returns (RestoreSignatureResponse);

  // Deletes a signature.
  rpc PurgeSignature(PurgeSignatureRequest) returns (PurgeSignatureResponse);

  // Reassigns a signature.
  rpc ReassignSignature(ReassignSignatureRequest) returns (ReassignSignatureResponse);

  // Locks a signature.
  rpc LockSignature(LockSignatureRequest) returns (LockSignatureResponse);

  // Unlocks a signature.
  rpc UnlockSignature(UnlockSignatureRequest) returns (UnlockSignatureResponse);

  // Transfers a signature.
  rpc TransferSignature(TransferSignatureRequest) returns (TransferSignatureResponse);

  // Repairs a signature.
  rpc RepairSignature(RepairSignatureRequest) returns (RepairSignatureResponse);

  // Returns a signature.
  rpc InspectSignature(InspectSignatureRequest) returns (InspectSignatureResponse);
}

// The request of `ArchiveSignature`.
message ArchiveSignatureRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  ArchiveSignatureRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveSignature`.
message ArchiveSignatureResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Signature signature = 1;
  ArchiveSignatureResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreSignature`.
message RestoreSignatureRequest {
  // What the operation needs besides the record.
  message Details {
