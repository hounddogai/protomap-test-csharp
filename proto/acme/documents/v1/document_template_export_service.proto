syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentTemplateExportServiceProto";
option java_package = "com.acme.documents.v1";

// Exports document templates to files and other systems.
service DocumentTemplateExportService {
  // Streams every matching document template.
  rpc StreamDocumentTemplateExport(StreamDocumentTemplateExportRequest) returns (stream StreamDocumentTemplateExportResponse);

  // Returns a document template.
  rpc GetDocumentTemplateExport(GetDocumentTemplateExportRequest) returns (GetDocumentTemplateExportResponse);

  // Cancels a document template.
  rpc CancelDocumentTemplateExport(CancelDocumentTemplateExportRequest) returns (CancelDocumentTemplateExportResponse);

  // Lists document templates a page at a time.
  rpc ListDocumentTemplateExports(ListDocumentTemplateExportsRequest) returns (ListDocumentTemplateExportsResponse);

  // Schedules a document template.
  rpc ScheduleDocumentTemplateExport(ScheduleDocumentTemplateExportRequest) returns (ScheduleDocumentTemplateExportResponse);

  // Retrys a document template.
  rpc RetryDocumentTemplateExport(RetryDocumentTemplateExportRequest) returns (RetryDocumentTemplateExportResponse);

  // Shares a document template.
  rpc ShareDocumentTemplateExport(ShareDocumentTemplateExportRequest) returns (ShareDocumentTemplateExportResponse);
}

// The request of `StreamDocumentTemplateExport`.
message StreamDocumentTemplateExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDocumentTemplateExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamDocumentTemplateExport`.
message StreamDocumentTemplateExportResponse {
  DocumentTemplate document_template = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetDocumentTemplateExport`.
message GetDocumentTemplateExportRequest {
  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDocumentTemplateExport`.
message GetDocumentTemplateExportResponse {
  DocumentTemplate document_template = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelDocumentTemplateExport`.
message CancelDocumentTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  CancelDocumentTemplateExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelDocumentTemplateExport`.
message CancelDocumentTemplateExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  CancelDocumentTemplateExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDocumentTemplateExports`.
message ListDocumentTemplateExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentTemplateExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentTemplateExports`.
message ListDocumentTemplateExportsResponse {
  repeated DocumentTemplate document_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleDocumentTemplateExport`.
message ScheduleDocumentTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  ScheduleDocumentTemplateExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDocumentTemplateExport`.
message ScheduleDocumentTemplateExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryDocumentTemplateExport`.
message RetryDocumentTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  DocumentTemplate document_template = 3;
  RetryDocumentTemplateExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryDocumentTemplateExport`.
message RetryDocumentTemplateExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  RetryDocumentTemplateExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDocumentTemplateExport`.
message ShareDocumentTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  ShareDocumentTemplateExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDocumentTemplateExport`.
message ShareDocumentTemplateExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  ShareDocumentTemplateExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
