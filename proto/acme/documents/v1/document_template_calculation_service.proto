syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentTemplateCalculationServiceProto";
option java_package = "com.acme.documents.v1";

// Computes the figures of a document template, such as totals, taxes, and estimates.
service DocumentTemplateCalculationService {
  // Calculates a document template.
  rpc CalculateDocumentTemplate(CalculateDocumentTemplateRequest) returns (CalculateDocumentTemplateResponse);

  // Estimates a document template.
  rpc EstimateDocumentTemplate(EstimateDocumentTemplateRequest) returns (EstimateDocumentTemplateResponse);

  // Quotes a document template.
  rpc QuoteDocumentTemplate(QuoteDocumentTemplateRequest) returns (QuoteDocumentTemplateResponse);

  // Compares a document template.
  rpc CompareDocumentTemplateOptions(CompareDocumentTemplateOptionsRequest) returns (CompareDocumentTemplateOptionsResponse);

  // Recalculates a document template.
  rpc RecalculateDocumentTemplates(RecalculateDocumentTemplatesRequest) returns (RecalculateDocumentTemplatesResponse);

  // Simulates a document template.
  rpc SimulateDocumentTemplate(SimulateDocumentTemplateRequest) returns (SimulateDocumentTemplateResponse);

  // Explains a document template.
  rpc ExplainDocumentTemplateCalculation(ExplainDocumentTemplateCalculationRequest) returns (ExplainDocumentTemplateCalculationResponse);

  // Returns a document template.
  rpc GetDocumentTemplateRates(GetDocumentTemplateRatesRequest) returns (GetDocumentTemplateRatesResponse);
}

// The request of `CalculateDocumentTemplate`.
message CalculateDocumentTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  DocumentTemplate document_template = 3;
  CalculateDocumentTemplateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDocumentTemplate`.
message CalculateDocumentTemplateResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDocumentTemplateResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  DocumentTemplate document_template = 1;
  CalculateDocumentTemplateResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

