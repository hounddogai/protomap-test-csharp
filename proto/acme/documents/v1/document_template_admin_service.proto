}

// The request of `InspectDocumentTemplate`.
message InspectDocumentTemplateRequest {
  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectDocumentTemplate`.
message InspectDocumentTemplateResponse {
