  DocumentTemplate document_template = 1;
  RestoreDocumentTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeDocumentTemplate`.
message PurgeDocumentTemplateRequest {
  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeDocumentTemplate`.
message PurgeDocumentTemplateResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignDocumentTemplate`.
message ReassignDocumentTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  ReassignDocumentTemplateRequest.Details details = 3;
  string reason = 4;
