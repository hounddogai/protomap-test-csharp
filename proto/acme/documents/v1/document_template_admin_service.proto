syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentTemplateAdminServiceProto";
option java_package = "com.acme.documents.v1";

// Operator actions on document templates that support staff run by hand.
service DocumentTemplateAdminService {
  // Archives a document template.
  rpc ArchiveDocumentTemplate(ArchiveDocumentTemplateRequest) returns (ArchiveDocumentTemplateResponse);

  // Restores a document template.
  rpc RestoreDocumentTemplate(RestoreDocumentTemplateRequest) returns (RestoreDocumentTemplateResponse);

  // Deletes a document template.
  rpc PurgeDocumentTemplate(PurgeDocumentTemplateRequest) returns (PurgeDocumentTemplateResponse);

  // Reassigns a document template.
  rpc ReassignDocumentTemplate(ReassignDocumentTemplateRequest) returns (ReassignDocumentTemplateResponse);

  // Locks a document template.
  rpc LockDocumentTemplate(LockDocumentTemplateRequest) returns (LockDocumentTemplateResponse);

  // Unlocks a document template.
  rpc UnlockDocumentTemplate(UnlockDocumentTemplateRequest) returns (UnlockDocumentTemplateResponse);

  // Transfers a document template.
  rpc TransferDocumentTemplate(TransferDocumentTemplateRequest) returns (TransferDocumentTemplateResponse);

  // Repairs a document template.
  rpc RepairDocumentTemplate(RepairDocumentTemplateRequest) returns (RepairDocumentTemplateResponse);

  // Returns a document template.
  rpc InspectDocumentTemplate(InspectDocumentTemplateRequest) returns (InspectDocumentTemplateResponse);
}

// The request of `ArchiveDocumentTemplate`.
message ArchiveDocumentTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_template_id = 2;
  ArchiveDocumentTemplateRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveDocumentTemplate`.
message ArchiveDocumentTemplateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentTemplate document_template = 1;
  ArchiveDocumentTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreDocumentTemplate`.
message RestoreDocumentTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
