syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "SignatureValidationServiceProto";
option java_package = "com.acme.documents.v1";

// Checks signatures against the rules before anything acts on them.
service SignatureValidationService {
  // Validates a signature.
  rpc ValidateSignature(ValidateSignatureRequest) returns (ValidateSignatureResponse);

  // Previews a signature.
  rpc PreviewSignature(PreviewSignatureRequest) returns (PreviewSignatureResponse);

  // Checks a signature.
  rpc CheckSignatureEligibility(CheckSignatureEligibilityRequest) returns (CheckSignatureEligibilityResponse);

  // Normalizes a signature.
  rpc NormalizeSignature(NormalizeSignatureRequest) returns (NormalizeSignatureResponse);

  // Explains a signature.
  rpc ExplainSignatureDecision(ExplainSignatureDecisionRequest) returns (ExplainSignatureDecisionResponse);

  // Scores a signature.
  rpc ScoreSignature(ScoreSignatureRequest) returns (ScoreSignatureResponse);

  // Lints a signature.
  rpc LintSignatures(LintSignaturesRequest) returns (LintSignaturesResponse);
}

// The request of `ValidateSignature`.
message ValidateSignatureRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string signature_id = 2;
  Signature signature = 3;
  ValidateSignatureRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSignature`.
message ValidateSignatureResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Signature signature = 1;
  ValidateSignatureResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

