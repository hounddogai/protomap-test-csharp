syntax = "proto3";

package acme.documents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/documents/v1/documents.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Documents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/documents/v1;documentsv1";
option java_multiple_files = true;
option java_outer_classname = "DocumentFolderNotificationServiceProto";
option java_package = "com.acme.documents.v1";

// Tells the people who follow a document folder what changed.
service DocumentFolderNotificationService {
  // Subscribes a document folder.
  rpc SubscribeDocumentFolderUpdates(SubscribeDocumentFolderUpdatesRequest) returns (SubscribeDocumentFolderUpdatesResponse);

  // Unsubscribes a document folder.
  rpc UnsubscribeDocumentFolderUpdates(UnsubscribeDocumentFolderUpdatesRequest) returns (UnsubscribeDocumentFolderUpdatesResponse);

  // Notifys a document folder.
  rpc NotifyDocumentFolderWatchers(NotifyDocumentFolderWatchersRequest) returns (NotifyDocumentFolderWatchersResponse);

  // Lists document folders a page at a time.
  rpc ListDocumentFolderSubscriptions(ListDocumentFolderSubscriptionsRequest) returns (ListDocumentFolderSubscriptionsResponse);

  // Sends a document folder.
  rpc SendDocumentFolderTestNotice(SendDocumentFolderTestNoticeRequest) returns (SendDocumentFolderTestNoticeResponse);

  // Returns a document folder.
  rpc GetDocumentFolderPreferences(GetDocumentFolderPreferencesRequest) returns (GetDocumentFolderPreferencesResponse);

  // Streams the changes of document folders as they happen.
  rpc StreamDocumentFolderNotices(StreamDocumentFolderNoticesRequest) returns (stream StreamDocumentFolderNoticesResponse);
}

// The request of `SubscribeDocumentFolderUpdates`.
message SubscribeDocumentFolderUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  SubscribeDocumentFolderUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDocumentFolderUpdates`.
message SubscribeDocumentFolderUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  SubscribeDocumentFolderUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDocumentFolderUpdates`.
message UnsubscribeDocumentFolderUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  UnsubscribeDocumentFolderUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDocumentFolderUpdates`.
message UnsubscribeDocumentFolderUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  UnsubscribeDocumentFolderUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDocumentFolderWatchers`.
message NotifyDocumentFolderWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  NotifyDocumentFolderWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyDocumentFolderWatchers`.
message NotifyDocumentFolderWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  NotifyDocumentFolderWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDocumentFolderSubscriptions`.
message ListDocumentFolderSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentFolderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDocumentFolderSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDocumentFolderSubscriptions`.
message ListDocumentFolderSubscriptionsResponse {
  repeated DocumentFolder document_folders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendDocumentFolderTestNotice`.
message SendDocumentFolderTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  SendDocumentFolderTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendDocumentFolderTestNotice`.
message SendDocumentFolderTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DocumentFolder document_folder = 1;
  SendDocumentFolderTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDocumentFolderPreferences`.
message GetDocumentFolderPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDocumentFolderPreferences`.
message GetDocumentFolderPreferencesResponse {
  DocumentFolder document_folder = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamDocumentFolderNotices`.
message StreamDocumentFolderNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DocumentFolderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDocumentFolderNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDocumentFolderNotices`.
message StreamDocumentFolderNoticesResponse {
  DocumentFolder document_folder = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
