}

// The request of `PurgeDocumentFolder`.
message PurgeDocumentFolderRequest {
  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeDocumentFolder`.
message PurgeDocumentFolderResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignDocumentFolder`.
message ReassignDocumentFolderRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string document_folder_id = 2;
  ReassignDocumentFolderRequest.Details details = 3;
  string reason = 4;
