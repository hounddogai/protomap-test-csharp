syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employees/v1/employees.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "PositionWorkflowServiceProto";
option java_package = "com.acme.employees.v1";

// Runs the long-lived workflow that takes a position from start to finish.
service PositionWorkflowService {
  // Starts a position.
  rpc StartPositionWorkflow(StartPositionWorkflowRequest) returns (StartPositionWorkflowResponse);

  // Advances a position.
  rpc AdvancePositionWorkflow(AdvancePositionWorkflowRequest) returns (AdvancePositionWorkflowResponse);

  // Retrys a position.
  rpc RetryPositionWorkflow(RetryPositionWorkflowRequest) returns (RetryPositionWorkflowResponse);

  // Resumes a position.
  rpc ResumePositionWorkflow(ResumePositionWorkflowRequest) returns (ResumePositionWorkflowResponse);

  // Lists positions a page at a time.
  rpc ListPositionWorkflows(ListPositionWorkflowsRequest) returns (ListPositionWorkflowsResponse);

  // Signals a position.
  rpc SignalPositionWorkflow(SignalPositionWorkflowRequest) returns (SignalPositionWorkflowResponse);
}

// The request of `StartPositionWorkflow`.
message StartPositionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string position_id = 2;
  Position position = 3;
  StartPositionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPositionWorkflow`.
message StartPositionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Position position = 1;
  StartPositionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

