option java_multiple_files = true;
option java_outer_classname = "OrgUnitWorkflowServiceProto";
option java_package = "com.acme.employees.v1";

// Runs the long-lived workflow that takes an org unit from start to finish.
service OrgUnitWorkflowService {
  // Starts an org unit.
  rpc StartOrgUnitWorkflow(StartOrgUnitWorkflowRequest) returns (StartOrgUnitWorkflowResponse);

  // Advances an org unit.
  rpc AdvanceOrgUnitWorkflow(AdvanceOrgUnitWorkflowRequest) returns (AdvanceOrgUnitWorkflowResponse);

  // Cancels an org unit.
  rpc CancelOrgUnitWorkflow(CancelOrgUnitWorkflowRequest) returns (CancelOrgUnitWorkflowResponse);

  // Retrys an org unit.
  rpc RetryOrgUnitWorkflow(RetryOrgUnitWorkflowRequest) returns (RetryOrgUnitWorkflowResponse);

  // Pauses an org unit.
  rpc PauseOrgUnitWorkflow(PauseOrgUnitWorkflowRequest) returns (PauseOrgUnitWorkflowResponse);

  // Resumes an org unit.
  rpc ResumeOrgUnitWorkflow(ResumeOrgUnitWorkflowRequest) returns (ResumeOrgUnitWorkflowResponse);

  // Returns an org unit.
  rpc InspectOrgUnitWorkflow(InspectOrgUnitWorkflowRequest) returns (InspectOrgUnitWorkflowResponse);

  // Lists org units a page at a time.
  rpc ListOrgUnitWorkflows(ListOrgUnitWorkflowsRequest) returns (ListOrgUnitWorkflowsResponse);

  // Signals an org unit.
  rpc SignalOrgUnitWorkflow(SignalOrgUnitWorkflowRequest) returns (SignalOrgUnitWorkflowResponse);
}

// The request of `StartOrgUnitWorkflow`.
message StartOrgUnitWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string org_unit_id = 2;
  OrgUnit org_unit = 3;
  StartOrgUnitWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartOrgUnitWorkflow`.
message StartOrgUnitWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OrgUnit org_unit = 1;
  StartOrgUnitWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

