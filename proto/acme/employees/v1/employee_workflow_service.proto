option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "EmployeeWorkflowServiceProto";
option java_package = "com.acme.employees.v1";

// Runs the long-lived workflow that takes an employee from start to finish.
service EmployeeWorkflowService {
  // Starts an employee.
  rpc StartEmployeeWorkflow(StartEmployeeWorkflowRequest) returns (StartEmployeeWorkflowResponse);

  // Advances an employee.
  rpc AdvanceEmployeeWorkflow(AdvanceEmployeeWorkflowRequest) returns (AdvanceEmployeeWorkflowResponse);

  // Cancels an employee.
  rpc CancelEmployeeWorkflow(CancelEmployeeWorkflowRequest) returns (CancelEmployeeWorkflowResponse);

  // Retrys an employee.
  rpc RetryEmployeeWorkflow(RetryEmployeeWorkflowRequest) returns (RetryEmployeeWorkflowResponse);

  // Pauses an employee.
  rpc PauseEmployeeWorkflow(PauseEmployeeWorkflowRequest) returns (PauseEmployeeWorkflowResponse);

  // Resumes an employee.
  rpc ResumeEmployeeWorkflow(ResumeEmployeeWorkflowRequest) returns (ResumeEmployeeWorkflowResponse);

  // Returns an employee.
  rpc InspectEmployeeWorkflow(InspectEmployeeWorkflowRequest) returns (InspectEmployeeWorkflowResponse);

  // Lists employees a page at a time.
  rpc ListEmployeeWorkflows(ListEmployeeWorkflowsRequest) returns (ListEmployeeWorkflowsResponse);

  // Signals an employee.
  rpc SignalEmployeeWorkflow(SignalEmployeeWorkflowRequest) returns (SignalEmployeeWorkflowResponse);
}

// The request of `StartEmployeeWorkflow`.
message StartEmployeeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string employee_id = 2;
  Employee employee = 3;
  StartEmployeeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartEmployeeWorkflow`.
message StartEmployeeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Employee employee = 1;
  StartEmployeeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

