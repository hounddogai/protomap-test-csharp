syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/employees/v1/employees.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "PositionValidationServiceProto";
option java_package = "com.acme.employees.v1";

// Checks positions against the rules before anything acts on them.
service PositionValidationService {
  // Validates a position.
  rpc ValidatePosition(ValidatePositionRequest) returns (ValidatePositionResponse);

  // Previews a position.
  rpc PreviewPosition(PreviewPositionRequest) returns (PreviewPositionResponse);

  // Checks a position.
  rpc CheckPositionEligibility(CheckPositionEligibilityRequest) returns (CheckPositionEligibilityResponse);

  // Normalizes a position.
  rpc NormalizePosition(NormalizePositionRequest) returns (NormalizePositionResponse);

  // Explains a position.
  rpc ExplainPositionDecision(ExplainPositionDecisionRequest) returns (ExplainPositionDecisionResponse);

  // Scores a position.
  rpc ScorePosition(ScorePositionRequest) returns (ScorePositionResponse);

  // Lints a position.
  rpc LintPositions(LintPositionsRequest) returns (LintPositionsResponse);

  // Returns a position.
  rpc GetPositionRules(GetPositionRulesRequest) returns (GetPositionRulesResponse);
}

// The request of `ValidatePosition`.
message ValidatePositionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string position_id = 2;
  Position position = 3;
  ValidatePositionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePosition`.
message ValidatePositionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Position position = 1;
  ValidatePositionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

