syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employees/v1/employees.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "EmployeeApprovalServiceProto";
option java_package = "com.acme.employees.v1";

// Routes employees through approval, with escalation and delegation.
service EmployeeApprovalService {
  // Submits an employee.
  rpc SubmitEmployee(SubmitEmployeeRequest) returns (SubmitEmployeeResponse);

  // Approves an employee.
  rpc ApproveEmployee(ApproveEmployeeRequest) returns (ApproveEmployeeResponse);

  // Escalates an employee.
  rpc EscalateEmployee(EscalateEmployeeRequest) returns (EscalateEmployeeResponse);

  // Lists employees a page at a time.
  rpc ListPendingEmployees(ListPendingEmployeesRequest) returns (ListPendingEmployeesResponse);

  // Recalls an employee.
  rpc RecallEmployee(RecallEmployeeRequest) returns (RecallEmployeeResponse);

  // Comments an employee.
  rpc CommentEmployeeApproval(CommentEmployeeApprovalRequest) returns (CommentEmployeeApprovalResponse);
}

// The request of `SubmitEmployee`.
message SubmitEmployeeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string employee_id = 2;
  Employee employee = 3;
  SubmitEmployeeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEmployee`.
message SubmitEmployeeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Employee employee = 1;
  SubmitEmployeeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

