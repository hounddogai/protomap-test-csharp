syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/employees/v1/employees.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "EmploymentContractValidationServiceProto";
option java_package = "com.acme.employees.v1";

// Checks employment contracts against the rules before anything acts on them.
service EmploymentContractValidationService {
  // Validates an employment contract.
  rpc ValidateEmploymentContract(ValidateEmploymentContractRequest) returns (ValidateEmploymentContractResponse);

  // Previews an employment contract.
  rpc PreviewEmploymentContract(PreviewEmploymentContractRequest) returns (PreviewEmploymentContractResponse);

  // Checks an employment contract.
  rpc CheckEmploymentContractEligibility(CheckEmploymentContractEligibilityRequest) returns (CheckEmploymentContractEligibilityResponse);

  // Normalizes an employment contract.
  rpc NormalizeEmploymentContract(NormalizeEmploymentContractRequest) returns (NormalizeEmploymentContractResponse);

  // Explains an employment contract.
  rpc ExplainEmploymentContractDecision(ExplainEmploymentContractDecisionRequest) returns (ExplainEmploymentContractDecisionResponse);

  // Scores an employment contract.
  rpc ScoreEmploymentContract(ScoreEmploymentContractRequest) returns (ScoreEmploymentContractResponse);

  // Lints an employment contract.
  rpc LintEmploymentContracts(LintEmploymentContractsRequest) returns (LintEmploymentContractsResponse);

  // Returns an employment contract.
  rpc GetEmploymentContractRules(GetEmploymentContractRulesRequest) returns (GetEmploymentContractRulesResponse);
}

// The request of `ValidateEmploymentContract`.
message ValidateEmploymentContractRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string employment_contract_id = 2;
  EmploymentContract employment_contract = 3;
  ValidateEmploymentContractRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateEmploymentContract`.
message ValidateEmploymentContractResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EmploymentContract employment_contract = 1;
  ValidateEmploymentContractResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

