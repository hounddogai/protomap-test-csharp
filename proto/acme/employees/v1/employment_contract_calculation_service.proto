syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/employees/v1/employees.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "EmploymentContractCalculationServiceProto";
option java_package = "com.acme.employees.v1";

// Computes the figures of an employment contract, such as totals, taxes, and estimates.
service EmploymentContractCalculationService {
  // Calculates an employment contract.
  rpc CalculateEmploymentContract(CalculateEmploymentContractRequest) returns (CalculateEmploymentContractResponse);

  // Estimates an employment contract.
  rpc EstimateEmploymentContract(EstimateEmploymentContractRequest) returns (EstimateEmploymentContractResponse);

  // Quotes an employment contract.
  rpc QuoteEmploymentContract(QuoteEmploymentContractRequest) returns (QuoteEmploymentContractResponse);

  // Compares an employment contract.
  rpc CompareEmploymentContractOptions(CompareEmploymentContractOptionsRequest) returns (CompareEmploymentContractOptionsResponse);

  // Recalculates an employment contract.
  rpc RecalculateEmploymentContracts(RecalculateEmploymentContractsRequest) returns (RecalculateEmploymentContractsResponse);

  // Simulates an employment contract.
  rpc SimulateEmploymentContract(SimulateEmploymentContractRequest) returns (SimulateEmploymentContractResponse);

  // Explains an employment contract.
  rpc ExplainEmploymentContractCalculation(ExplainEmploymentContractCalculationRequest) returns (ExplainEmploymentContractCalculationResponse);

  // Returns an employment contract.
  rpc GetEmploymentContractRates(GetEmploymentContractRatesRequest) returns (GetEmploymentContractRatesResponse);
}

// The request of `CalculateEmploymentContract`.
message CalculateEmploymentContractRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string employment_contract_id = 2;
  EmploymentContract employment_contract = 3;
  CalculateEmploymentContractRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateEmploymentContract`.
message CalculateEmploymentContractResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateEmploymentContractResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  EmploymentContract employment_contract = 1;
  CalculateEmploymentContractResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

