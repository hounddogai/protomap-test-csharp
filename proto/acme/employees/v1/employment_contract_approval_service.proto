syntax = "proto3";

package acme.employees.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/employees/v1/employees.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Employees.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/employees/v1;employeesv1";
option java_multiple_files = true;
option java_outer_classname = "EmploymentContractApprovalServiceProto";
option java_package = "com.acme.employees.v1";

// Routes employment contracts through approval, with escalation and delegation.
service EmploymentContractApprovalService {
  // Submits an employment contract.
  rpc SubmitEmploymentContract(SubmitEmploymentContractRequest) returns (SubmitEmploymentContractResponse);

  // Approves an employment contract.
  rpc ApproveEmploymentContract(ApproveEmploymentContractRequest) returns (ApproveEmploymentContractResponse);

  // Rejects an employment contract.
  rpc RejectEmploymentContract(RejectEmploymentContractRequest) returns (RejectEmploymentContractResponse);

  // Escalates an employment contract.
  rpc EscalateEmploymentContract(EscalateEmploymentContractRequest) returns (EscalateEmploymentContractResponse);

  // Lists employment contracts a page at a time.
  rpc ListPendingEmploymentContracts(ListPendingEmploymentContractsRequest) returns (ListPendingEmploymentContractsResponse);

  // Delegates an employment contract.
  rpc DelegateEmploymentContractApproval(DelegateEmploymentContractApprovalRequest) returns (DelegateEmploymentContractApprovalResponse);

  // Recalls an employment contract.
  rpc RecallEmploymentContract(RecallEmploymentContractRequest) returns (RecallEmploymentContractResponse);

  // Returns an employment contract.
  rpc GetEmploymentContractApprovalStatus(GetEmploymentContractApprovalStatusRequest) returns (GetEmploymentContractApprovalStatusResponse);

  // Comments an employment contract.
  rpc CommentEmploymentContractApproval(CommentEmploymentContractApprovalRequest) returns (CommentEmploymentContractApprovalResponse);
}

// The request of `SubmitEmploymentContract`.
message SubmitEmploymentContractRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string employment_contract_id = 2;
  EmploymentContract employment_contract = 3;
  SubmitEmploymentContractRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEmploymentContract`.
message SubmitEmploymentContractResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EmploymentContract employment_contract = 1;
  SubmitEmploymentContractResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

