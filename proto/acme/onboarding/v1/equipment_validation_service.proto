syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "EquipmentValidationServiceProto";
option java_package = "com.acme.onboarding.v1";

// Checks equipments against the rules before anything acts on them.
service EquipmentValidationService {
  // Validates an equipment.
  rpc ValidateEquipment(ValidateEquipmentRequest) returns (ValidateEquipmentResponse);

  // Previews an equipment.
  rpc PreviewEquipment(PreviewEquipmentRequest) returns (PreviewEquipmentResponse);

  // Checks an equipment.
  rpc CheckEquipmentEligibility(CheckEquipmentEligibilityRequest) returns (CheckEquipmentEligibilityResponse);

  // Normalizes an equipment.
  rpc NormalizeEquipment(NormalizeEquipmentRequest) returns (NormalizeEquipmentResponse);

  // Explains an equipment.
  rpc ExplainEquipmentDecision(ExplainEquipmentDecisionRequest) returns (ExplainEquipmentDecisionResponse);

  // Scores an equipment.
  rpc ScoreEquipment(ScoreEquipmentRequest) returns (ScoreEquipmentResponse);

  // Lints an equipment.
  rpc LintEquipments(LintEquipmentsRequest) returns (LintEquipmentsResponse);

  // Returns an equipment.
  rpc GetEquipmentRules(GetEquipmentRulesRequest) returns (GetEquipmentRulesResponse);
}

// The request of `ValidateEquipment`.
message ValidateEquipmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  Equipment equipment = 3;
  ValidateEquipmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateEquipment`.
message ValidateEquipmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Equipment equipment = 1;
  ValidateEquipmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

