option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "EquipmentWorkflowServiceProto";
option java_package = "com.acme.onboarding.v1";

// Runs the long-lived workflow that takes an equipment from start to finish.
service EquipmentWorkflowService {
  // Starts an equipment.
  rpc StartEquipmentWorkflow(StartEquipmentWorkflowRequest) returns (StartEquipmentWorkflowResponse);

  // Advances an equipment.
  rpc AdvanceEquipmentWorkflow(AdvanceEquipmentWorkflowRequest) returns (AdvanceEquipmentWorkflowResponse);

  // Cancels an equipment.
  rpc CancelEquipmentWorkflow(CancelEquipmentWorkflowRequest) returns (CancelEquipmentWorkflowResponse);

  // Retrys an equipment.
  rpc RetryEquipmentWorkflow(RetryEquipmentWorkflowRequest) returns (RetryEquipmentWorkflowResponse);

  // Pauses an equipment.
  rpc PauseEquipmentWorkflow(PauseEquipmentWorkflowRequest) returns (PauseEquipmentWorkflowResponse);

  // Resumes an equipment.
  rpc ResumeEquipmentWorkflow(ResumeEquipmentWorkflowRequest) returns (ResumeEquipmentWorkflowResponse);

  // Returns an equipment.
  rpc InspectEquipmentWorkflow(InspectEquipmentWorkflowRequest) returns (InspectEquipmentWorkflowResponse);

  // Lists equipments a page at a time.
  rpc ListEquipmentWorkflows(ListEquipmentWorkflowsRequest) returns (ListEquipmentWorkflowsResponse);

  // Signals an equipment.
  rpc SignalEquipmentWorkflow(SignalEquipmentWorkflowRequest) returns (SignalEquipmentWorkflowResponse);
}

// The request of `StartEquipmentWorkflow`.
message StartEquipmentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  Equipment equipment = 3;
  StartEquipmentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartEquipmentWorkflow`.
message StartEquipmentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Equipment equipment = 1;
  StartEquipmentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

