syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "EquipmentReportingServiceProto";
option java_package = "com.acme.onboarding.v1";

// Builds and schedules reports about equipments.
service EquipmentReportingService {
  // Generates an equipment.
  rpc GenerateEquipmentReport(GenerateEquipmentReportRequest) returns (GenerateEquipmentReportResponse);

  // Returns an equipment.
  rpc FetchEquipmentReport(FetchEquipmentReportRequest) returns (FetchEquipmentReportResponse);

  // Schedules an equipment.
  rpc ScheduleEquipmentReport(ScheduleEquipmentReportRequest) returns (ScheduleEquipmentReportResponse);

  // Streams the changes of equipments as they happen.
  rpc StreamEquipmentMetrics(StreamEquipmentMetricsRequest) returns (stream StreamEquipmentMetricsResponse);

  // Shares an equipment.
  rpc ShareEquipmentReport(ShareEquipmentReportRequest) returns (ShareEquipmentReportResponse);

  // Counts equipments by status.
  rpc CountEquipmentTotals(CountEquipmentTotalsRequest) returns (CountEquipmentTotalsResponse);

  // Deletes an equipment.
  rpc DeleteEquipmentReport(DeleteEquipmentReportRequest) returns (DeleteEquipmentReportResponse);
}

// The request of `GenerateEquipmentReport`.
message GenerateEquipmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  GenerateEquipmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateEquipmentReport`.
message GenerateEquipmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchEquipmentReport`.
message FetchEquipmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchEquipmentReport`.
message FetchEquipmentReportResponse {
  Equipment equipment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleEquipmentReport`.
message ScheduleEquipmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  ScheduleEquipmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleEquipmentReport`.
message ScheduleEquipmentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamEquipmentMetrics`.
message StreamEquipmentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EquipmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamEquipmentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamEquipmentMetrics`.
message StreamEquipmentMetricsResponse {
  Equipment equipment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareEquipmentReport`.
message ShareEquipmentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  ShareEquipmentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareEquipmentReport`.
message ShareEquipmentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Equipment equipment = 1;
  ShareEquipmentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountEquipmentTotals`.
message CountEquipmentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EquipmentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountEquipmentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountEquipmentTotals`.
message CountEquipmentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteEquipmentReport`.
message DeleteEquipmentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteEquipmentReport`.
message DeleteEquipmentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
