syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "OnboardingTaskValidationServiceProto";
option java_package = "com.acme.onboarding.v1";

// Checks onboarding tasks against the rules before anything acts on them.
service OnboardingTaskValidationService {
  // Validates an onboarding task.
  rpc ValidateOnboardingTask(ValidateOnboardingTaskRequest) returns (ValidateOnboardingTaskResponse);

  // Previews an onboarding task.
  rpc PreviewOnboardingTask(PreviewOnboardingTaskRequest) returns (PreviewOnboardingTaskResponse);

  // Checks an onboarding task.
  rpc CheckOnboardingTaskEligibility(CheckOnboardingTaskEligibilityRequest) returns (CheckOnboardingTaskEligibilityResponse);

  // Explains an onboarding task.
  rpc ExplainOnboardingTaskDecision(ExplainOnboardingTaskDecisionRequest) returns (ExplainOnboardingTaskDecisionResponse);

  // Scores an onboarding task.
  rpc ScoreOnboardingTask(ScoreOnboardingTaskRequest) returns (ScoreOnboardingTaskResponse);

  // Lints an onboarding task.
  rpc LintOnboardingTasks(LintOnboardingTasksRequest) returns (LintOnboardingTasksResponse);

  // Returns an onboarding task.
  rpc GetOnboardingTaskRules(GetOnboardingTaskRulesRequest) returns (GetOnboardingTaskRulesResponse);
}

// The request of `ValidateOnboardingTask`.
message ValidateOnboardingTaskRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  OnboardingTask onboarding_task = 3;
  ValidateOnboardingTaskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateOnboardingTask`.
message ValidateOnboardingTaskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OnboardingTask onboarding_task = 1;
  ValidateOnboardingTaskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

