syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "OnboardingTaskWorkflowServiceProto";
option java_package = "com.acme.onboarding.v1";

// Runs the long-lived workflow that takes an onboarding task from start to finish.
service OnboardingTaskWorkflowService {
  // Starts an onboarding task.
  rpc StartOnboardingTaskWorkflow(StartOnboardingTaskWorkflowRequest) returns (StartOnboardingTaskWorkflowResponse);

  // Advances an onboarding task.
  rpc AdvanceOnboardingTaskWorkflow(AdvanceOnboardingTaskWorkflowRequest) returns (AdvanceOnboardingTaskWorkflowResponse);

  // Cancels an onboarding task.
  rpc CancelOnboardingTaskWorkflow(CancelOnboardingTaskWorkflowRequest) returns (CancelOnboardingTaskWorkflowResponse);

  // Retrys an onboarding task.
  rpc RetryOnboardingTaskWorkflow(RetryOnboardingTaskWorkflowRequest) returns (RetryOnboardingTaskWorkflowResponse);

  // Pauses an onboarding task.
  rpc PauseOnboardingTaskWorkflow(PauseOnboardingTaskWorkflowRequest) returns (PauseOnboardingTaskWorkflowResponse);

  // Resumes an onboarding task.
  rpc ResumeOnboardingTaskWorkflow(ResumeOnboardingTaskWorkflowRequest) returns (ResumeOnboardingTaskWorkflowResponse);

  // Returns an onboarding task.
  rpc InspectOnboardingTaskWorkflow(InspectOnboardingTaskWorkflowRequest) returns (InspectOnboardingTaskWorkflowResponse);

  // Lists onboarding tasks a page at a time.
  rpc ListOnboardingTaskWorkflows(ListOnboardingTaskWorkflowsRequest) returns (ListOnboardingTaskWorkflowsResponse);

  // Signals an onboarding task.
  rpc SignalOnboardingTaskWorkflow(SignalOnboardingTaskWorkflowRequest) returns (SignalOnboardingTaskWorkflowResponse);
}

// The request of `StartOnboardingTaskWorkflow`.
message StartOnboardingTaskWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  OnboardingTask onboarding_task = 3;
  StartOnboardingTaskWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartOnboardingTaskWorkflow`.
message StartOnboardingTaskWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OnboardingTask onboarding_task = 1;
  StartOnboardingTaskWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

