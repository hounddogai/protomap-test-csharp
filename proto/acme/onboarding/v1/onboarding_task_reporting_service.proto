syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "OnboardingTaskReportingServiceProto";
option java_package = "com.acme.onboarding.v1";

// Builds and schedules reports about onboarding tasks.
service OnboardingTaskReportingService {
  // Generates an onboarding task.
  rpc GenerateOnboardingTaskReport(GenerateOnboardingTaskReportRequest) returns (GenerateOnboardingTaskReportResponse);

  // Returns an onboarding task.
  rpc FetchOnboardingTaskReport(FetchOnboardingTaskReportRequest) returns (FetchOnboardingTaskReportResponse);

  // Schedules an onboarding task.
  rpc ScheduleOnboardingTaskReport(ScheduleOnboardingTaskReportRequest) returns (ScheduleOnboardingTaskReportResponse);

  // Streams the changes of onboarding tasks as they happen.
  rpc StreamOnboardingTaskMetrics(StreamOnboardingTaskMetricsRequest) returns (stream StreamOnboardingTaskMetricsResponse);

  // Lists onboarding tasks a page at a time.
  rpc ListOnboardingTaskReports(ListOnboardingTaskReportsRequest) returns (ListOnboardingTaskReportsResponse);

  // Shares an onboarding task.
  rpc ShareOnboardingTaskReport(ShareOnboardingTaskReportRequest) returns (ShareOnboardingTaskReportResponse);

  // Counts onboarding tasks by status.
  rpc CountOnboardingTaskTotals(CountOnboardingTaskTotalsRequest) returns (CountOnboardingTaskTotalsResponse);

  // Deletes an onboarding task.
  rpc DeleteOnboardingTaskReport(DeleteOnboardingTaskReportRequest) returns (DeleteOnboardingTaskReportResponse);
}

// The request of `GenerateOnboardingTaskReport`.
message GenerateOnboardingTaskReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  GenerateOnboardingTaskReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateOnboardingTaskReport`.
message GenerateOnboardingTaskReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchOnboardingTaskReport`.
message FetchOnboardingTaskReportRequest {
  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchOnboardingTaskReport`.
message FetchOnboardingTaskReportResponse {
  OnboardingTask onboarding_task = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleOnboardingTaskReport`.
message ScheduleOnboardingTaskReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  ScheduleOnboardingTaskReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleOnboardingTaskReport`.
message ScheduleOnboardingTaskReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamOnboardingTaskMetrics`.
message StreamOnboardingTaskMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OnboardingTaskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamOnboardingTaskMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamOnboardingTaskMetrics`.
message StreamOnboardingTaskMetricsResponse {
  OnboardingTask onboarding_task = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListOnboardingTaskReports`.
message ListOnboardingTaskReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OnboardingTaskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListOnboardingTaskReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListOnboardingTaskReports`.
message ListOnboardingTaskReportsResponse {
  repeated OnboardingTask onboarding_tasks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareOnboardingTaskReport`.
message ShareOnboardingTaskReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  ShareOnboardingTaskReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareOnboardingTaskReport`.
message ShareOnboardingTaskReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OnboardingTask onboarding_task = 1;
  ShareOnboardingTaskReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountOnboardingTaskTotals`.
message CountOnboardingTaskTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated OnboardingTaskStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountOnboardingTaskTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountOnboardingTaskTotals`.
message CountOnboardingTaskTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteOnboardingTaskReport`.
message DeleteOnboardingTaskReportRequest {
  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteOnboardingTaskReport`.
message DeleteOnboardingTaskReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
