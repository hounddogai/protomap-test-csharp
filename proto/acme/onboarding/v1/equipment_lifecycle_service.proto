syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "EquipmentLifecycleServiceProto";
option java_package = "com.acme.onboarding.v1";

// Moves an equipment between the states of its lifecycle.
service EquipmentLifecycleService {
  // Activates an equipment.
  rpc ActivateEquipment(ActivateEquipmentRequest) returns (ActivateEquipmentResponse);

  // Suspends an equipment.
  rpc SuspendEquipment(SuspendEquipmentRequest) returns (SuspendEquipmentResponse);

  // Terminates an equipment.
  rpc TerminateEquipment(TerminateEquipmentRequest) returns (TerminateEquipmentResponse);

  // Renews an equipment.
  rpc RenewEquipment(RenewEquipmentRequest) returns (RenewEquipmentResponse);

  // Expires an equipment.
  rpc ExpireEquipment(ExpireEquipmentRequest) returns (ExpireEquipmentResponse);

  // Returns an equipment.
  rpc GetEquipmentLifecycle(GetEquipmentLifecycleRequest) returns (GetEquipmentLifecycleResponse);

  // Schedules an equipment.
  rpc ScheduleEquipmentExpiry(ScheduleEquipmentExpiryRequest) returns (ScheduleEquipmentExpiryResponse);
}

// The request of `ActivateEquipment`.
message ActivateEquipmentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  ActivateEquipmentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateEquipment`.
message ActivateEquipmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Equipment equipment = 1;
  ActivateEquipmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

