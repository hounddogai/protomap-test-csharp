syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "EquipmentCalculationServiceProto";
option java_package = "com.acme.onboarding.v1";

// Computes the figures of an equipment, such as totals, taxes, and estimates.
service EquipmentCalculationService {
  // Calculates an equipment.
  rpc CalculateEquipment(CalculateEquipmentRequest) returns (CalculateEquipmentResponse);

  // Estimates an equipment.
  rpc EstimateEquipment(EstimateEquipmentRequest) returns (EstimateEquipmentResponse);

  // Quotes an equipment.
  rpc QuoteEquipment(QuoteEquipmentRequest) returns (QuoteEquipmentResponse);

  // Compares an equipment.
  rpc CompareEquipmentOptions(CompareEquipmentOptionsRequest) returns (CompareEquipmentOptionsResponse);

  // Recalculates an equipment.
  rpc RecalculateEquipments(RecalculateEquipmentsRequest) returns (RecalculateEquipmentsResponse);

  // Simulates an equipment.
  rpc SimulateEquipment(SimulateEquipmentRequest) returns (SimulateEquipmentResponse);

  // Explains an equipment.
  rpc ExplainEquipmentCalculation(ExplainEquipmentCalculationRequest) returns (ExplainEquipmentCalculationResponse);

  // Returns an equipment.
  rpc GetEquipmentRates(GetEquipmentRatesRequest) returns (GetEquipmentRatesResponse);
}

// The request of `CalculateEquipment`.
message CalculateEquipmentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  Equipment equipment = 3;
  CalculateEquipmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateEquipment`.
message CalculateEquipmentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateEquipmentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Equipment equipment = 1;
  CalculateEquipmentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

