syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "EquipmentApprovalServiceProto";
option java_package = "com.acme.onboarding.v1";

// Routes equipments through approval, with escalation and delegation.
service EquipmentApprovalService {
  // Submits an equipment.
  rpc SubmitEquipment(SubmitEquipmentRequest) returns (SubmitEquipmentResponse);

  // Approves an equipment.
  rpc ApproveEquipment(ApproveEquipmentRequest) returns (ApproveEquipmentResponse);

  // Escalates an equipment.
  rpc EscalateEquipment(EscalateEquipmentRequest) returns (EscalateEquipmentResponse);

  // Lists equipments a page at a time.
  rpc ListPendingEquipments(ListPendingEquipmentsRequest) returns (ListPendingEquipmentsResponse);

  // Delegates an equipment.
  rpc DelegateEquipmentApproval(DelegateEquipmentApprovalRequest) returns (DelegateEquipmentApprovalResponse);

  // Recalls an equipment.
  rpc RecallEquipment(RecallEquipmentRequest) returns (RecallEquipmentResponse);

  // Returns an equipment.
  rpc GetEquipmentApprovalStatus(GetEquipmentApprovalStatusRequest) returns (GetEquipmentApprovalStatusResponse);

  // Comments an equipment.
  rpc CommentEquipmentApproval(CommentEquipmentApprovalRequest) returns (CommentEquipmentApprovalResponse);
}

// The request of `SubmitEquipment`.
message SubmitEquipmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string equipment_id = 2;
  Equipment equipment = 3;
  SubmitEquipmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEquipment`.
message SubmitEquipmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Equipment equipment = 1;
  SubmitEquipmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

