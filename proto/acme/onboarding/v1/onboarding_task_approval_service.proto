syntax = "proto3";

package acme.onboarding.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/onboarding/v1/onboarding.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Onboarding.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/onboarding/v1;onboardingv1";
option java_multiple_files = true;
option java_outer_classname = "OnboardingTaskApprovalServiceProto";
option java_package = "com.acme.onboarding.v1";

// Routes onboarding tasks through approval, with escalation and delegation.
service OnboardingTaskApprovalService {
  // Submits an onboarding task.
  rpc SubmitOnboardingTask(SubmitOnboardingTaskRequest) returns (SubmitOnboardingTaskResponse);

  // Approves an onboarding task.
  rpc ApproveOnboardingTask(ApproveOnboardingTaskRequest) returns (ApproveOnboardingTaskResponse);

  // Rejects an onboarding task.
  rpc RejectOnboardingTask(RejectOnboardingTaskRequest) returns (RejectOnboardingTaskResponse);

  // Escalates an onboarding task.
  rpc EscalateOnboardingTask(EscalateOnboardingTaskRequest) returns (EscalateOnboardingTaskResponse);

  // Lists onboarding tasks a page at a time.
  rpc ListPendingOnboardingTasks(ListPendingOnboardingTasksRequest) returns (ListPendingOnboardingTasksResponse);

  // Delegates an onboarding task.
  rpc DelegateOnboardingTaskApproval(DelegateOnboardingTaskApprovalRequest) returns (DelegateOnboardingTaskApprovalResponse);

  // Recalls an onboarding task.
  rpc RecallOnboardingTask(RecallOnboardingTaskRequest) returns (RecallOnboardingTaskResponse);

  // Returns an onboarding task.
  rpc GetOnboardingTaskApprovalStatus(GetOnboardingTaskApprovalStatusRequest) returns (GetOnboardingTaskApprovalStatusResponse);

  // Comments an onboarding task.
  rpc CommentOnboardingTaskApproval(CommentOnboardingTaskApprovalRequest) returns (CommentOnboardingTaskApprovalResponse);
}

// The request of `SubmitOnboardingTask`.
message SubmitOnboardingTaskRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string onboarding_task_id = 2;
  OnboardingTask onboarding_task = 3;
  SubmitOnboardingTaskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitOnboardingTask`.
message SubmitOnboardingTaskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  OnboardingTask onboarding_task = 1;
  SubmitOnboardingTaskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

