syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "DevicePolicyCalculationServiceProto";
option java_package = "com.acme.devices.v1";

// Computes the figures of a device policy, such as totals, taxes, and estimates.
service DevicePolicyCalculationService {
  // Calculates a device policy.
  rpc CalculateDevicePolicy(CalculateDevicePolicyRequest) returns (CalculateDevicePolicyResponse);

  // Estimates a device policy.
  rpc EstimateDevicePolicy(EstimateDevicePolicyRequest) returns (EstimateDevicePolicyResponse);

  // Quotes a device policy.
  rpc QuoteDevicePolicy(QuoteDevicePolicyRequest) returns (QuoteDevicePolicyResponse);

  // Compares a device policy.
  rpc CompareDevicePolicyOptions(CompareDevicePolicyOptionsRequest) returns (CompareDevicePolicyOptionsResponse);

  // Recalculates a device policy.
  rpc RecalculateDevicePolicies(RecalculateDevicePoliciesRequest) returns (RecalculateDevicePoliciesResponse);

  // Simulates a device policy.
  rpc SimulateDevicePolicy(SimulateDevicePolicyRequest) returns (SimulateDevicePolicyResponse);

  // Explains a device policy.
  rpc ExplainDevicePolicyCalculation(ExplainDevicePolicyCalculationRequest) returns (ExplainDevicePolicyCalculationResponse);

  // Returns a device policy.
  rpc GetDevicePolicyRates(GetDevicePolicyRatesRequest) returns (GetDevicePolicyRatesResponse);
}

// The request of `CalculateDevicePolicy`.
message CalculateDevicePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string device_policy_id = 2;
  DevicePolicy device_policy = 3;
  CalculateDevicePolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDevicePolicy`.
message CalculateDevicePolicyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDevicePolicyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  DevicePolicy device_policy = 1;
  CalculateDevicePolicyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

