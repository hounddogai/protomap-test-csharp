syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ManagedDeviceWorkflowServiceProto";
option java_package = "com.acme.devices.v1";

// Runs the long-lived workflow that takes a managed device from start to finish.
service ManagedDeviceWorkflowService {
  // Starts a managed device.
  rpc StartManagedDeviceWorkflow(StartManagedDeviceWorkflowRequest) returns (StartManagedDeviceWorkflowResponse);

  // Advances a managed device.
  rpc AdvanceManagedDeviceWorkflow(AdvanceManagedDeviceWorkflowRequest) returns (AdvanceManagedDeviceWorkflowResponse);

  // Cancels a managed device.
  rpc CancelManagedDeviceWorkflow(CancelManagedDeviceWorkflowRequest) returns (CancelManagedDeviceWorkflowResponse);

  // Retrys a managed device.
  rpc RetryManagedDeviceWorkflow(RetryManagedDeviceWorkflowRequest) returns (RetryManagedDeviceWorkflowResponse);

  // Pauses a managed device.
  rpc PauseManagedDeviceWorkflow(PauseManagedDeviceWorkflowRequest) returns (PauseManagedDeviceWorkflowResponse);

  // Resumes a managed device.
  rpc ResumeManagedDeviceWorkflow(ResumeManagedDeviceWorkflowRequest) returns (ResumeManagedDeviceWorkflowResponse);

  // Returns a managed device.
  rpc InspectManagedDeviceWorkflow(InspectManagedDeviceWorkflowRequest) returns (InspectManagedDeviceWorkflowResponse);

  // Lists managed devices a page at a time.
  rpc ListManagedDeviceWorkflows(ListManagedDeviceWorkflowsRequest) returns (ListManagedDeviceWorkflowsResponse);

  // Signals a managed device.
  rpc SignalManagedDeviceWorkflow(SignalManagedDeviceWorkflowRequest) returns (SignalManagedDeviceWorkflowResponse);
}

// The request of `StartManagedDeviceWorkflow`.
message StartManagedDeviceWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string managed_device_id = 2;
  ManagedDevice managed_device = 3;
  StartManagedDeviceWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartManagedDeviceWorkflow`.
message StartManagedDeviceWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ManagedDevice managed_device = 1;
  StartManagedDeviceWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

