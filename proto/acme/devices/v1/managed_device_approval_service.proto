syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/devices/v1/devices.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ManagedDeviceApprovalServiceProto";
option java_package = "com.acme.devices.v1";

// Routes managed devices through approval, with escalation and delegation.
service ManagedDeviceApprovalService {
  // Submits a managed device.
  rpc SubmitManagedDevice(SubmitManagedDeviceRequest) returns (SubmitManagedDeviceResponse);

  // Approves a managed device.
  rpc ApproveManagedDevice(ApproveManagedDeviceRequest) returns (ApproveManagedDeviceResponse);

  // Rejects a managed device.
  rpc RejectManagedDevice(RejectManagedDeviceRequest) returns (RejectManagedDeviceResponse);

  // Escalates a managed device.
  rpc EscalateManagedDevice(EscalateManagedDeviceRequest) returns (EscalateManagedDeviceResponse);

  // Lists managed devices a page at a time.
  rpc ListPendingManagedDevices(ListPendingManagedDevicesRequest) returns (ListPendingManagedDevicesResponse);

  // Delegates a managed device.
  rpc DelegateManagedDeviceApproval(DelegateManagedDeviceApprovalRequest) returns (DelegateManagedDeviceApprovalResponse);

  // Recalls a managed device.
  rpc RecallManagedDevice(RecallManagedDeviceRequest) returns (RecallManagedDeviceResponse);

  // Returns a managed device.
  rpc GetManagedDeviceApprovalStatus(GetManagedDeviceApprovalStatusRequest) returns (GetManagedDeviceApprovalStatusResponse);
}

// The request of `SubmitManagedDevice`.
message SubmitManagedDeviceRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string managed_device_id = 2;
  ManagedDevice managed_device = 3;
  SubmitManagedDeviceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitManagedDevice`.
message SubmitManagedDeviceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ManagedDevice managed_device = 1;
  SubmitManagedDeviceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

