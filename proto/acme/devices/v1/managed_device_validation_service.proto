syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ManagedDeviceValidationServiceProto";
option java_package = "com.acme.devices.v1";

// Checks managed devices against the rules before anything acts on them.
service ManagedDeviceValidationService {
  // Validates a managed device.
  rpc ValidateManagedDevice(ValidateManagedDeviceRequest) returns (ValidateManagedDeviceResponse);

  // Previews a managed device.
  rpc PreviewManagedDevice(PreviewManagedDeviceRequest) returns (PreviewManagedDeviceResponse);

  // Checks a managed device.
  rpc CheckManagedDeviceEligibility(CheckManagedDeviceEligibilityRequest) returns (CheckManagedDeviceEligibilityResponse);

  // Normalizes a managed device.
  rpc NormalizeManagedDevice(NormalizeManagedDeviceRequest) returns (NormalizeManagedDeviceResponse);

  // Explains a managed device.
  rpc ExplainManagedDeviceDecision(ExplainManagedDeviceDecisionRequest) returns (ExplainManagedDeviceDecisionResponse);

  // Scores a managed device.
  rpc ScoreManagedDevice(ScoreManagedDeviceRequest) returns (ScoreManagedDeviceResponse);
}

// The request of `ValidateManagedDevice`.
message ValidateManagedDeviceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string managed_device_id = 2;
  ManagedDevice managed_device = 3;
  ValidateManagedDeviceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateManagedDevice`.
message ValidateManagedDeviceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ManagedDevice managed_device = 1;
  ValidateManagedDeviceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

