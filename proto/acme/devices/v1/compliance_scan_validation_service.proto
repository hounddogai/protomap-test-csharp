syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceScanValidationServiceProto";
option java_package = "com.acme.devices.v1";

// Checks compliance scans against the rules before anything acts on them.
service ComplianceScanValidationService {
  // Validates a compliance scan.
  rpc ValidateComplianceScan(ValidateComplianceScanRequest) returns (ValidateComplianceScanResponse);

  // Previews a compliance scan.
  rpc PreviewComplianceScan(PreviewComplianceScanRequest) returns (PreviewComplianceScanResponse);

  // Checks a compliance scan.
  rpc CheckComplianceScanEligibility(CheckComplianceScanEligibilityRequest) returns (CheckComplianceScanEligibilityResponse);

  // Normalizes a compliance scan.
  rpc NormalizeComplianceScan(NormalizeComplianceScanRequest) returns (NormalizeComplianceScanResponse);

  // Explains a compliance scan.
  rpc ExplainComplianceScanDecision(ExplainComplianceScanDecisionRequest) returns (ExplainComplianceScanDecisionResponse);

  // Scores a compliance scan.
  rpc ScoreComplianceScan(ScoreComplianceScanRequest) returns (ScoreComplianceScanResponse);

  // Lints a compliance scan.
  rpc LintComplianceScans(LintComplianceScansRequest) returns (LintComplianceScansResponse);

  // Returns a compliance scan.
  rpc GetComplianceScanRules(GetComplianceScanRulesRequest) returns (GetComplianceScanRulesResponse);
}

// The request of `ValidateComplianceScan`.
message ValidateComplianceScanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_scan_id = 2;
  ComplianceScan compliance_scan = 3;
  ValidateComplianceScanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateComplianceScan`.
message ValidateComplianceScanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ComplianceScan compliance_scan = 1;
  ValidateComplianceScanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

