message ExplainComplianceScanCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ComplianceScan compliance_scan = 1;
  ExplainComplianceScanCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetComplianceScanRates`.
message GetComplianceScanRatesRequest {
