syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceScanCalculationServiceProto";
option java_package = "com.acme.devices.v1";

// Computes the figures of a compliance scan, such as totals, taxes, and estimates.
service ComplianceScanCalculationService {
  // Calculates a compliance scan.
  rpc CalculateComplianceScan(CalculateComplianceScanRequest) returns (CalculateComplianceScanResponse);

  // Estimates a compliance scan.
  rpc EstimateComplianceScan(EstimateComplianceScanRequest) returns (EstimateComplianceScanResponse);

  // Compares a compliance scan.
  rpc CompareComplianceScanOptions(CompareComplianceScanOptionsRequest) returns (CompareComplianceScanOptionsResponse);

  // Recalculates a compliance scan.
  rpc RecalculateComplianceScans(RecalculateComplianceScansRequest) returns (RecalculateComplianceScansResponse);

  // Explains a compliance scan.
  rpc ExplainComplianceScanCalculation(ExplainComplianceScanCalculationRequest) returns (ExplainComplianceScanCalculationResponse);

  // Returns a compliance scan.
  rpc GetComplianceScanRates(GetComplianceScanRatesRequest) returns (GetComplianceScanRatesResponse);
}

// The request of `CalculateComplianceScan`.
message CalculateComplianceScanRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_scan_id = 2;
  ComplianceScan compliance_scan = 3;
  CalculateComplianceScanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateComplianceScan`.
message CalculateComplianceScanResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateComplianceScanResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ComplianceScan compliance_scan = 1;
  CalculateComplianceScanResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

