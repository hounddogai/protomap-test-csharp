syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/devices/v1/devices.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceScanLifecycleServiceProto";
option java_package = "com.acme.devices.v1";

// Moves a compliance scan between the states of its lifecycle.
service ComplianceScanLifecycleService {
  // Activates a compliance scan.
  rpc ActivateComplianceScan(ActivateComplianceScanRequest) returns (ActivateComplianceScanResponse);

  // Suspends a compliance scan.
  rpc SuspendComplianceScan(SuspendComplianceScanRequest) returns (SuspendComplianceScanResponse);

  // Reinstates a compliance scan.
  rpc ReinstateComplianceScan(ReinstateComplianceScanRequest) returns (ReinstateComplianceScanResponse);

  // Terminates a compliance scan.
  rpc TerminateComplianceScan(TerminateComplianceScanRequest) returns (TerminateComplianceScanResponse);

  // Expires a compliance scan.
  rpc ExpireComplianceScan(ExpireComplianceScanRequest) returns (ExpireComplianceScanResponse);

  // Schedules a compliance scan.
  rpc ScheduleComplianceScanExpiry(ScheduleComplianceScanExpiryRequest) returns (ScheduleComplianceScanExpiryResponse);
}

// The request of `ActivateComplianceScan`.
message ActivateComplianceScanRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_scan_id = 2;
  ActivateComplianceScanRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateComplianceScan`.
message ActivateComplianceScanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ComplianceScan compliance_scan = 1;
  ActivateComplianceScanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

