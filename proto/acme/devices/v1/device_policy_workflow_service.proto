option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "DevicePolicyWorkflowServiceProto";
option java_package = "com.acme.devices.v1";

// Runs the long-lived workflow that takes a device policy from start to finish.
service DevicePolicyWorkflowService {
  // Starts a device policy.
  rpc StartDevicePolicyWorkflow(StartDevicePolicyWorkflowRequest) returns (StartDevicePolicyWorkflowResponse);

  // Advances a device policy.
  rpc AdvanceDevicePolicyWorkflow(AdvanceDevicePolicyWorkflowRequest) returns (AdvanceDevicePolicyWorkflowResponse);

  // Cancels a device policy.
  rpc CancelDevicePolicyWorkflow(CancelDevicePolicyWorkflowRequest) returns (CancelDevicePolicyWorkflowResponse);

  // Retrys a device policy.
  rpc RetryDevicePolicyWorkflow(RetryDevicePolicyWorkflowRequest) returns (RetryDevicePolicyWorkflowResponse);

  // Pauses a device policy.
  rpc PauseDevicePolicyWorkflow(PauseDevicePolicyWorkflowRequest) returns (PauseDevicePolicyWorkflowResponse);

  // Resumes a device policy.
  rpc ResumeDevicePolicyWorkflow(ResumeDevicePolicyWorkflowRequest) returns (ResumeDevicePolicyWorkflowResponse);

  // Returns a device policy.
  rpc InspectDevicePolicyWorkflow(InspectDevicePolicyWorkflowRequest) returns (InspectDevicePolicyWorkflowResponse);

  // Signals a device policy.
  rpc SignalDevicePolicyWorkflow(SignalDevicePolicyWorkflowRequest) returns (SignalDevicePolicyWorkflowResponse);
}

// The request of `StartDevicePolicyWorkflow`.
message StartDevicePolicyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string device_policy_id = 2;
  DevicePolicy device_policy = 3;
  StartDevicePolicyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDevicePolicyWorkflow`.
message StartDevicePolicyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DevicePolicy device_policy = 1;
  StartDevicePolicyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

