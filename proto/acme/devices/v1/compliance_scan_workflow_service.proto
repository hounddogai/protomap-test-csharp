syntax = "proto3";

package acme.devices.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/devices/v1/devices.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Devices.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/devices/v1;devicesv1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceScanWorkflowServiceProto";
option java_package = "com.acme.devices.v1";

// Runs the long-lived workflow that takes a compliance scan from start to finish.
service ComplianceScanWorkflowService {
  // Starts a compliance scan.
  rpc StartComplianceScanWorkflow(StartComplianceScanWorkflowRequest) returns (StartComplianceScanWorkflowResponse);

  // Advances a compliance scan.
  rpc AdvanceComplianceScanWorkflow(AdvanceComplianceScanWorkflowRequest) returns (AdvanceComplianceScanWorkflowResponse);

  // Retrys a compliance scan.
  rpc RetryComplianceScanWorkflow(RetryComplianceScanWorkflowRequest) returns (RetryComplianceScanWorkflowResponse);

  // Pauses a compliance scan.
  rpc PauseComplianceScanWorkflow(PauseComplianceScanWorkflowRequest) returns (PauseComplianceScanWorkflowResponse);

  // Resumes a compliance scan.
  rpc ResumeComplianceScanWorkflow(ResumeComplianceScanWorkflowRequest) returns (ResumeComplianceScanWorkflowResponse);

  // Returns a compliance scan.
  rpc InspectComplianceScanWorkflow(InspectComplianceScanWorkflowRequest) returns (InspectComplianceScanWorkflowResponse);

  // Lists compliance scans a page at a time.
  rpc ListComplianceScanWorkflows(ListComplianceScanWorkflowsRequest) returns (ListComplianceScanWorkflowsResponse);
}

// The request of `StartComplianceScanWorkflow`.
message StartComplianceScanWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_scan_id = 2;
  ComplianceScan compliance_scan = 3;
  StartComplianceScanWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartComplianceScanWorkflow`.
message StartComplianceScanWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ComplianceScan compliance_scan = 1;
  StartComplianceScanWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

