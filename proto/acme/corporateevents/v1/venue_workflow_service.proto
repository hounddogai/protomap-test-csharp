option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "VenueWorkflowServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Runs the long-lived workflow that takes a venue from start to finish.
service VenueWorkflowService {
  // Starts a venue.
  rpc StartVenueWorkflow(StartVenueWorkflowRequest) returns (StartVenueWorkflowResponse);

  // Advances a venue.
  rpc AdvanceVenueWorkflow(AdvanceVenueWorkflowRequest) returns (AdvanceVenueWorkflowResponse);

  // Cancels a venue.
  rpc CancelVenueWorkflow(CancelVenueWorkflowRequest) returns (CancelVenueWorkflowResponse);

  // Retrys a venue.
  rpc RetryVenueWorkflow(RetryVenueWorkflowRequest) returns (RetryVenueWorkflowResponse);

  // Pauses a venue.
  rpc PauseVenueWorkflow(PauseVenueWorkflowRequest) returns (PauseVenueWorkflowResponse);

  // Resumes a venue.
  rpc ResumeVenueWorkflow(ResumeVenueWorkflowRequest) returns (ResumeVenueWorkflowResponse);

  // Returns a venue.
  rpc InspectVenueWorkflow(InspectVenueWorkflowRequest) returns (InspectVenueWorkflowResponse);

  // Signals a venue.
  rpc SignalVenueWorkflow(SignalVenueWorkflowRequest) returns (SignalVenueWorkflowResponse);
}

// The request of `StartVenueWorkflow`.
message StartVenueWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  StartVenueWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartVenueWorkflow`.
message StartVenueWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  StartVenueWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

