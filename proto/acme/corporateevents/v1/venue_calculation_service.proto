syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "VenueCalculationServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Computes the figures of a venue, such as totals, taxes, and estimates.
service VenueCalculationService {
  // Calculates a venue.
  rpc CalculateVenue(CalculateVenueRequest) returns (CalculateVenueResponse);

  // Estimates a venue.
  rpc EstimateVenue(EstimateVenueRequest) returns (EstimateVenueResponse);

  // Quotes a venue.
  rpc QuoteVenue(QuoteVenueRequest) returns (QuoteVenueResponse);

  // Compares a venue.
  rpc CompareVenueOptions(CompareVenueOptionsRequest) returns (CompareVenueOptionsResponse);

  // Recalculates a venue.
  rpc RecalculateVenues(RecalculateVenuesRequest) returns (RecalculateVenuesResponse);

  // Simulates a venue.
  rpc SimulateVenue(SimulateVenueRequest) returns (SimulateVenueResponse);

  // Explains a venue.
  rpc ExplainVenueCalculation(ExplainVenueCalculationRequest) returns (ExplainVenueCalculationResponse);

  // Returns a venue.
  rpc GetVenueRates(GetVenueRatesRequest) returns (GetVenueRatesResponse);
}

// The request of `CalculateVenue`.
message CalculateVenueRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  CalculateVenueRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateVenue`.
message CalculateVenueResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateVenueResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Venue venue = 1;
  CalculateVenueResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

