syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "RegistrationApprovalServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Routes registrations through approval, with escalation and delegation.
service RegistrationApprovalService {
  // Submits a registration.
  rpc SubmitRegistration(SubmitRegistrationRequest) returns (SubmitRegistrationResponse);

  // Approves a registration.
  rpc ApproveRegistration(ApproveRegistrationRequest) returns (ApproveRegistrationResponse);

  // Rejects a registration.
  rpc RejectRegistration(RejectRegistrationRequest) returns (RejectRegistrationResponse);

  // Escalates a registration.
  rpc EscalateRegistration(EscalateRegistrationRequest) returns (EscalateRegistrationResponse);

  // Lists registrations a page at a time.
  rpc ListPendingRegistrations(ListPendingRegistrationsRequest) returns (ListPendingRegistrationsResponse);

  // Delegates a registration.
  rpc DelegateRegistrationApproval(DelegateRegistrationApprovalRequest) returns (DelegateRegistrationApprovalResponse);

  // Recalls a registration.
  rpc RecallRegistration(RecallRegistrationRequest) returns (RecallRegistrationResponse);

  // Returns a registration.
  rpc GetRegistrationApprovalStatus(GetRegistrationApprovalStatusRequest) returns (GetRegistrationApprovalStatusResponse);
}

// The request of `SubmitRegistration`.
message SubmitRegistrationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string registration_id = 2;
  Registration registration = 3;
  SubmitRegistrationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRegistration`.
message SubmitRegistrationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Registration registration = 1;
  SubmitRegistrationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

