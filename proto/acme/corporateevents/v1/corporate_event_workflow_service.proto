syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "CorporateEventWorkflowServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Runs the long-lived workflow that takes a corporate event from start to finish.
service CorporateEventWorkflowService {
  // Starts a corporate event.
  rpc StartCorporateEventWorkflow(StartCorporateEventWorkflowRequest) returns (StartCorporateEventWorkflowResponse);

  // Advances a corporate event.
  rpc AdvanceCorporateEventWorkflow(AdvanceCorporateEventWorkflowRequest) returns (AdvanceCorporateEventWorkflowResponse);

  // Cancels a corporate event.
  rpc CancelCorporateEventWorkflow(CancelCorporateEventWorkflowRequest) returns (CancelCorporateEventWorkflowResponse);

  // Retrys a corporate event.
  rpc RetryCorporateEventWorkflow(RetryCorporateEventWorkflowRequest) returns (RetryCorporateEventWorkflowResponse);

  // Pauses a corporate event.
  rpc PauseCorporateEventWorkflow(PauseCorporateEventWorkflowRequest) returns (PauseCorporateEventWorkflowResponse);

  // Resumes a corporate event.
  rpc ResumeCorporateEventWorkflow(ResumeCorporateEventWorkflowRequest) returns (ResumeCorporateEventWorkflowResponse);

  // Returns a corporate event.
  rpc InspectCorporateEventWorkflow(InspectCorporateEventWorkflowRequest) returns (InspectCorporateEventWorkflowResponse);
}

// The request of `StartCorporateEventWorkflow`.
message StartCorporateEventWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  CorporateEvent corporate_event = 3;
  StartCorporateEventWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCorporateEventWorkflow`.
message StartCorporateEventWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CorporateEvent corporate_event = 1;
  StartCorporateEventWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

