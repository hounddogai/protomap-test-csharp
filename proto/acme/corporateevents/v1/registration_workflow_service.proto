syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "RegistrationWorkflowServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Runs the long-lived workflow that takes a registration from start to finish.
service RegistrationWorkflowService {
  // Starts a registration.
  rpc StartRegistrationWorkflow(StartRegistrationWorkflowRequest) returns (StartRegistrationWorkflowResponse);

  // Advances a registration.
  rpc AdvanceRegistrationWorkflow(AdvanceRegistrationWorkflowRequest) returns (AdvanceRegistrationWorkflowResponse);

  // Cancels a registration.
  rpc CancelRegistrationWorkflow(CancelRegistrationWorkflowRequest) returns (CancelRegistrationWorkflowResponse);

  // Retrys a registration.
  rpc RetryRegistrationWorkflow(RetryRegistrationWorkflowRequest) returns (RetryRegistrationWorkflowResponse);

  // Pauses a registration.
  rpc PauseRegistrationWorkflow(PauseRegistrationWorkflowRequest) returns (PauseRegistrationWorkflowResponse);

  // Resumes a registration.
  rpc ResumeRegistrationWorkflow(ResumeRegistrationWorkflowRequest) returns (ResumeRegistrationWorkflowResponse);

  // Returns a registration.
  rpc InspectRegistrationWorkflow(InspectRegistrationWorkflowRequest) returns (InspectRegistrationWorkflowResponse);

  // Lists registrations a page at a time.
  rpc ListRegistrationWorkflows(ListRegistrationWorkflowsRequest) returns (ListRegistrationWorkflowsResponse);

  // Signals a registration.
  rpc SignalRegistrationWorkflow(SignalRegistrationWorkflowRequest) returns (SignalRegistrationWorkflowResponse);
}

// The request of `StartRegistrationWorkflow`.
message StartRegistrationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string registration_id = 2;
  Registration registration = 3;
  StartRegistrationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRegistrationWorkflow`.
message StartRegistrationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Registration registration = 1;
  StartRegistrationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

