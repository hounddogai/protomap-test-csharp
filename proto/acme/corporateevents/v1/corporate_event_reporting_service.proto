syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "CorporateEventReportingServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Builds and schedules reports about corporate events.
service CorporateEventReportingService {
  // Generates a corporate event.
  rpc GenerateCorporateEventReport(GenerateCorporateEventReportRequest) returns (GenerateCorporateEventReportResponse);

  // Returns a corporate event.
  rpc FetchCorporateEventReport(FetchCorporateEventReportRequest) returns (FetchCorporateEventReportResponse);

  // Schedules a corporate event.
  rpc ScheduleCorporateEventReport(ScheduleCorporateEventReportRequest) returns (ScheduleCorporateEventReportResponse);

  // Streams the changes of corporate events as they happen.
  rpc StreamCorporateEventMetrics(StreamCorporateEventMetricsRequest) returns (stream StreamCorporateEventMetricsResponse);

  // Lists corporate events a page at a time.
  rpc ListCorporateEventReports(ListCorporateEventReportsRequest) returns (ListCorporateEventReportsResponse);

  // Shares a corporate event.
  rpc ShareCorporateEventReport(ShareCorporateEventReportRequest) returns (ShareCorporateEventReportResponse);

  // Counts corporate events by status.
  rpc CountCorporateEventTotals(CountCorporateEventTotalsRequest) returns (CountCorporateEventTotalsResponse);

  // Deletes a corporate event.
  rpc DeleteCorporateEventReport(DeleteCorporateEventReportRequest) returns (DeleteCorporateEventReportResponse);
}

// The request of `GenerateCorporateEventReport`.
message GenerateCorporateEventReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  GenerateCorporateEventReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateCorporateEventReport`.
message GenerateCorporateEventReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchCorporateEventReport`.
message FetchCorporateEventReportRequest {
  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchCorporateEventReport`.
message FetchCorporateEventReportResponse {
  CorporateEvent corporate_event = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleCorporateEventReport`.
message ScheduleCorporateEventReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  ScheduleCorporateEventReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleCorporateEventReport`.
message ScheduleCorporateEventReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamCorporateEventMetrics`.
message StreamCorporateEventMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamCorporateEventMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamCorporateEventMetrics`.
message StreamCorporateEventMetricsResponse {
  CorporateEvent corporate_event = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCorporateEventReports`.
message ListCorporateEventReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCorporateEventReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCorporateEventReports`.
message ListCorporateEventReportsResponse {
  repeated CorporateEvent corporate_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareCorporateEventReport`.
message ShareCorporateEventReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  ShareCorporateEventReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareCorporateEventReport`.
message ShareCorporateEventReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CorporateEvent corporate_event = 1;
  ShareCorporateEventReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCorporateEventTotals`.
message CountCorporateEventTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CorporateEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCorporateEventTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCorporateEventTotals`.
message CountCorporateEventTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteCorporateEventReport`.
message DeleteCorporateEventReportRequest {
  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCorporateEventReport`.
message DeleteCorporateEventReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
