// The request of `ReconcileVenues`.
message ReconcileVenuesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  ReconcileVenuesRequest.Details details = 4;
  string reason = 5;
