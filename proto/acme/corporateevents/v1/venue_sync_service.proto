}

// The request of `GetVenueSyncState`.
message GetVenueSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetVenueSyncState`.
message GetVenueSyncStateResponse {
  Venue venue = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListVenueConflicts`.
message ListVenueConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenueConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenueConflicts`.
message ListVenueConflictsResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
