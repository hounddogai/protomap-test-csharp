syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "VenueSyncServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Keeps venues in step with the systems of record in other regions.
service VenueSyncService {
  // Syncs a venue.
  rpc SyncVenues(SyncVenuesRequest) returns (SyncVenuesResponse);

  // Pushs a venue.
  rpc PushVenue(PushVenueRequest) returns (PushVenueResponse);

  // Pulls a venue.
  rpc PullVenues(PullVenuesRequest) returns (PullVenuesResponse);

  // Reconciles a venue.
  rpc ReconcileVenues(ReconcileVenuesRequest) returns (ReconcileVenuesResponse);

  // Exchanges changes of venues with a peer.
  rpc StreamVenueChanges(stream StreamVenueChangesRequest) returns (stream StreamVenueChangesResponse);

  // Resolves a venue.
  rpc ResolveVenueConflict(ResolveVenueConflictRequest) returns (ResolveVenueConflictResponse);

  // Returns a venue.
  rpc GetVenueSyncState(GetVenueSyncStateRequest) returns (GetVenueSyncStateResponse);

  // Lists venues a page at a time.
  rpc ListVenueConflicts(ListVenueConflictsRequest) returns (ListVenueConflictsResponse);
}

// The request of `SyncVenues`.
message SyncVenuesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  SyncVenuesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncVenues`.
message SyncVenuesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  SyncVenuesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushVenue`.
message PushVenueRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  PushVenueRequest.Details details = 4;
  string reason = 5;
