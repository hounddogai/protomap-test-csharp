syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "RegistrationLifecycleServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Moves a registration between the states of its lifecycle.
service RegistrationLifecycleService {
  // Activates a registration.
  rpc ActivateRegistration(ActivateRegistrationRequest) returns (ActivateRegistrationResponse);

  // Suspends a registration.
  rpc SuspendRegistration(SuspendRegistrationRequest) returns (SuspendRegistrationResponse);

  // Reinstates a registration.
  rpc ReinstateRegistration(ReinstateRegistrationRequest) returns (ReinstateRegistrationResponse);

  // Terminates a registration.
  rpc TerminateRegistration(TerminateRegistrationRequest) returns (TerminateRegistrationResponse);

  // Renews a registration.
  rpc RenewRegistration(RenewRegistrationRequest) returns (RenewRegistrationResponse);

  // Expires a registration.
  rpc ExpireRegistration(ExpireRegistrationRequest) returns (ExpireRegistrationResponse);

  // Returns a registration.
  rpc GetRegistrationLifecycle(GetRegistrationLifecycleRequest) returns (GetRegistrationLifecycleResponse);

  // Schedules a registration.
  rpc ScheduleRegistrationExpiry(ScheduleRegistrationExpiryRequest) returns (ScheduleRegistrationExpiryResponse);
}

// The request of `ActivateRegistration`.
message ActivateRegistrationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string registration_id = 2;
  ActivateRegistrationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRegistration`.
message ActivateRegistrationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Registration registration = 1;
  ActivateRegistrationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

