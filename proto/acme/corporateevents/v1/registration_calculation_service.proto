syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "RegistrationCalculationServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Computes the figures of a registration, such as totals, taxes, and estimates.
service RegistrationCalculationService {
  // Calculates a registration.
  rpc CalculateRegistration(CalculateRegistrationRequest) returns (CalculateRegistrationResponse);

  // Estimates a registration.
  rpc EstimateRegistration(EstimateRegistrationRequest) returns (EstimateRegistrationResponse);

  // Compares a registration.
  rpc CompareRegistrationOptions(CompareRegistrationOptionsRequest) returns (CompareRegistrationOptionsResponse);

  // Recalculates a registration.
  rpc RecalculateRegistrations(RecalculateRegistrationsRequest) returns (RecalculateRegistrationsResponse);

  // Explains a registration.
  rpc ExplainRegistrationCalculation(ExplainRegistrationCalculationRequest) returns (ExplainRegistrationCalculationResponse);

  // Returns a registration.
  rpc GetRegistrationRates(GetRegistrationRatesRequest) returns (GetRegistrationRatesResponse);
}

// The request of `CalculateRegistration`.
message CalculateRegistrationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string registration_id = 2;
  Registration registration = 3;
  CalculateRegistrationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRegistration`.
message CalculateRegistrationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRegistrationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Registration registration = 1;
  CalculateRegistrationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

