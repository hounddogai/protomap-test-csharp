syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "VenueReportingServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Builds and schedules reports about venues.
service VenueReportingService {
  // Generates a venue.
  rpc GenerateVenueReport(GenerateVenueReportRequest) returns (GenerateVenueReportResponse);

  // Returns a venue.
  rpc FetchVenueReport(FetchVenueReportRequest) returns (FetchVenueReportResponse);

  // Schedules a venue.
  rpc ScheduleVenueReport(ScheduleVenueReportRequest) returns (ScheduleVenueReportResponse);

  // Streams the changes of venues as they happen.
  rpc StreamVenueMetrics(StreamVenueMetricsRequest) returns (stream StreamVenueMetricsResponse);

  // Lists venues a page at a time.
  rpc ListVenueReports(ListVenueReportsRequest) returns (ListVenueReportsResponse);

  // Shares a venue.
  rpc ShareVenueReport(ShareVenueReportRequest) returns (ShareVenueReportResponse);

  // Deletes a venue.
  rpc DeleteVenueReport(DeleteVenueReportRequest) returns (DeleteVenueReportResponse);
}

// The request of `GenerateVenueReport`.
message GenerateVenueReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  GenerateVenueReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateVenueReport`.
message GenerateVenueReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchVenueReport`.
message FetchVenueReportRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchVenueReport`.
message FetchVenueReportResponse {
  Venue venue = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleVenueReport`.
message ScheduleVenueReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  ScheduleVenueReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVenueReport`.
message ScheduleVenueReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamVenueMetrics`.
message StreamVenueMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVenueMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamVenueMetrics`.
message StreamVenueMetricsResponse {
  Venue venue = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListVenueReports`.
message ListVenueReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VenueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVenueReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVenueReports`.
message ListVenueReportsResponse {
  repeated Venue venues = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareVenueReport`.
message ShareVenueReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  ShareVenueReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareVenueReport`.
message ShareVenueReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  ShareVenueReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteVenueReport`.
message DeleteVenueReportRequest {
  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteVenueReport`.
message DeleteVenueReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
