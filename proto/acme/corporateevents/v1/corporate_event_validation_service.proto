syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "CorporateEventValidationServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Checks corporate events against the rules before anything acts on them.
service CorporateEventValidationService {
  // Validates a corporate event.
  rpc ValidateCorporateEvent(ValidateCorporateEventRequest) returns (ValidateCorporateEventResponse);

  // Previews a corporate event.
  rpc PreviewCorporateEvent(PreviewCorporateEventRequest) returns (PreviewCorporateEventResponse);

  // Checks a corporate event.
  rpc CheckCorporateEventEligibility(CheckCorporateEventEligibilityRequest) returns (CheckCorporateEventEligibilityResponse);

  // Normalizes a corporate event.
  rpc NormalizeCorporateEvent(NormalizeCorporateEventRequest) returns (NormalizeCorporateEventResponse);

  // Explains a corporate event.
  rpc ExplainCorporateEventDecision(ExplainCorporateEventDecisionRequest) returns (ExplainCorporateEventDecisionResponse);

  // Scores a corporate event.
  rpc ScoreCorporateEvent(ScoreCorporateEventRequest) returns (ScoreCorporateEventResponse);

  // Lints a corporate event.
  rpc LintCorporateEvents(LintCorporateEventsRequest) returns (LintCorporateEventsResponse);

  // Returns a corporate event.
  rpc GetCorporateEventRules(GetCorporateEventRulesRequest) returns (GetCorporateEventRulesResponse);
}

// The request of `ValidateCorporateEvent`.
message ValidateCorporateEventRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  CorporateEvent corporate_event = 3;
  ValidateCorporateEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCorporateEvent`.
message ValidateCorporateEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CorporateEvent corporate_event = 1;
  ValidateCorporateEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

