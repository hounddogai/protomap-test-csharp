syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "VenueLifecycleServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Moves a venue between the states of its lifecycle.
service VenueLifecycleService {
  // Activates a venue.
  rpc ActivateVenue(ActivateVenueRequest) returns (ActivateVenueResponse);

  // Suspends a venue.
  rpc SuspendVenue(SuspendVenueRequest) returns (SuspendVenueResponse);

  // Reinstates a venue.
  rpc ReinstateVenue(ReinstateVenueRequest) returns (ReinstateVenueResponse);

  // Terminates a venue.
  rpc TerminateVenue(TerminateVenueRequest) returns (TerminateVenueResponse);

  // Renews a venue.
  rpc RenewVenue(RenewVenueRequest) returns (RenewVenueResponse);

  // Expires a venue.
  rpc ExpireVenue(ExpireVenueRequest) returns (ExpireVenueResponse);

  // Returns a venue.
  rpc GetVenueLifecycle(GetVenueLifecycleRequest) returns (GetVenueLifecycleResponse);

  // Schedules a venue.
  rpc ScheduleVenueExpiry(ScheduleVenueExpiryRequest) returns (ScheduleVenueExpiryResponse);
}

// The request of `ActivateVenue`.
message ActivateVenueRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  ActivateVenueRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateVenue`.
message ActivateVenueResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  ActivateVenueResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

