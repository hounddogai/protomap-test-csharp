syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "VenueApprovalServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Routes venues through approval, with escalation and delegation.
service VenueApprovalService {
  // Submits a venue.
  rpc SubmitVenue(SubmitVenueRequest) returns (SubmitVenueResponse);

  // Approves a venue.
  rpc ApproveVenue(ApproveVenueRequest) returns (ApproveVenueResponse);

  // Rejects a venue.
  rpc RejectVenue(RejectVenueRequest) returns (RejectVenueResponse);

  // Escalates a venue.
  rpc EscalateVenue(EscalateVenueRequest) returns (EscalateVenueResponse);

  // Lists venues a page at a time.
  rpc ListPendingVenues(ListPendingVenuesRequest) returns (ListPendingVenuesResponse);

  // Delegates a venue.
  rpc DelegateVenueApproval(DelegateVenueApprovalRequest) returns (DelegateVenueApprovalResponse);

  // Recalls a venue.
  rpc RecallVenue(RecallVenueRequest) returns (RecallVenueResponse);

  // Returns a venue.
  rpc GetVenueApprovalStatus(GetVenueApprovalStatusRequest) returns (GetVenueApprovalStatusResponse);

  // Comments a venue.
  rpc CommentVenueApproval(CommentVenueApprovalRequest) returns (CommentVenueApprovalResponse);
}

// The request of `SubmitVenue`.
message SubmitVenueRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string venue_id = 2;
  Venue venue = 3;
  SubmitVenueRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVenue`.
message SubmitVenueResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Venue venue = 1;
  SubmitVenueResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

