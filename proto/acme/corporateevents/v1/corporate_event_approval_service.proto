syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "CorporateEventApprovalServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Routes corporate events through approval, with escalation and delegation.
service CorporateEventApprovalService {
  // Submits a corporate event.
  rpc SubmitCorporateEvent(SubmitCorporateEventRequest) returns (SubmitCorporateEventResponse);

  // Approves a corporate event.
  rpc ApproveCorporateEvent(ApproveCorporateEventRequest) returns (ApproveCorporateEventResponse);

  // Rejects a corporate event.
  rpc RejectCorporateEvent(RejectCorporateEventRequest) returns (RejectCorporateEventResponse);

  // Escalates a corporate event.
  rpc EscalateCorporateEvent(EscalateCorporateEventRequest) returns (EscalateCorporateEventResponse);

  // Lists corporate events a page at a time.
  rpc ListPendingCorporateEvents(ListPendingCorporateEventsRequest) returns (ListPendingCorporateEventsResponse);

  // Delegates a corporate event.
  rpc DelegateCorporateEventApproval(DelegateCorporateEventApprovalRequest) returns (DelegateCorporateEventApprovalResponse);

  // Returns a corporate event.
  rpc GetCorporateEventApprovalStatus(GetCorporateEventApprovalStatusRequest) returns (GetCorporateEventApprovalStatusResponse);
}

// The request of `SubmitCorporateEvent`.
message SubmitCorporateEventRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  CorporateEvent corporate_event = 3;
  SubmitCorporateEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCorporateEvent`.
message SubmitCorporateEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CorporateEvent corporate_event = 1;
  SubmitCorporateEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCorporateEvent`.
message ApproveCorporateEventRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  CorporateEvent corporate_event = 3;
  ApproveCorporateEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveCorporateEvent`.
message ApproveCorporateEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CorporateEvent corporate_event = 1;
  ApproveCorporateEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RejectCorporateEvent`.
message RejectCorporateEventRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
