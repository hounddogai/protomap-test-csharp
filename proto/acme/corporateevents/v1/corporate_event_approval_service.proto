// The request of `GetCorporateEventApprovalStatus`.
message GetCorporateEventApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCorporateEventApprovalStatus`.
message GetCorporateEventApprovalStatusResponse {
  CorporateEvent corporate_event = 1;
  acme.common.v1.OperationResult result = 2;
}
