syntax = "proto3";

package acme.corporateevents.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/corporateevents/v1/corporateevents.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Corporateevents.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/corporateevents/v1;corporateeventsv1";
option java_multiple_files = true;
option java_outer_classname = "CorporateEventLifecycleServiceProto";
option java_package = "com.acme.corporateevents.v1";

// Moves a corporate event between the states of its lifecycle.
service CorporateEventLifecycleService {
  // Activates a corporate event.
  rpc ActivateCorporateEvent(ActivateCorporateEventRequest) returns (ActivateCorporateEventResponse);

  // Suspends a corporate event.
  rpc SuspendCorporateEvent(SuspendCorporateEventRequest) returns (SuspendCorporateEventResponse);

  // Reinstates a corporate event.
  rpc ReinstateCorporateEvent(ReinstateCorporateEventRequest) returns (ReinstateCorporateEventResponse);

  // Terminates a corporate event.
  rpc TerminateCorporateEvent(TerminateCorporateEventRequest) returns (TerminateCorporateEventResponse);

  // Renews a corporate event.
  rpc RenewCorporateEvent(RenewCorporateEventRequest) returns (RenewCorporateEventResponse);

  // Expires a corporate event.
  rpc ExpireCorporateEvent(ExpireCorporateEventRequest) returns (ExpireCorporateEventResponse);

  // Schedules a corporate event.
  rpc ScheduleCorporateEventExpiry(ScheduleCorporateEventExpiryRequest) returns (ScheduleCorporateEventExpiryResponse);
}

// The request of `ActivateCorporateEvent`.
message ActivateCorporateEventRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string corporate_event_id = 2;
  ActivateCorporateEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCorporateEvent`.
message ActivateCorporateEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CorporateEvent corporate_event = 1;
  ActivateCorporateEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

