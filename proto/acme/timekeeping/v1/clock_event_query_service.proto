syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "ClockEventQueryServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Answers read-only questions about clock events, for screens and reports.
service ClockEventQueryService {
  // Returns a clock event.
  rpc LookupClockEvent(LookupClockEventRequest) returns (LookupClockEventResponse);

  // Lists clock events a page at a time.
  rpc BrowseClockEvents(BrowseClockEventsRequest) returns (BrowseClockEventsResponse);

  // Lists clock events a page at a time.
  rpc FindClockEvents(FindClockEventsRequest) returns (FindClockEventsResponse);

  // Counts clock events by status.
  rpc CountClockEvents(CountClockEventsRequest) returns (CountClockEventsResponse);

  // Returns several clock events at once.
  rpc ResolveClockEvents(ResolveClockEventsRequest) returns (ResolveClockEventsResponse);

  // Summarizes a clock event.
  rpc SummarizeClockEvents(SummarizeClockEventsRequest) returns (SummarizeClockEventsResponse);

  // Lists clock events a page at a time.
  rpc SuggestClockEvents(SuggestClockEventsRequest) returns (SuggestClockEventsResponse);

  // Returns a clock event.
  rpc PeekClockEvent(PeekClockEventRequest) returns (PeekClockEventResponse);
}

// The request of `LookupClockEvent`.
message LookupClockEventRequest {
  acme.common.v1.RequestContext context = 1;
  string clock_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupClockEvent`.
message LookupClockEventResponse {
  ClockEvent clock_event = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseClockEvents`.
message BrowseClockEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClockEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseClockEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseClockEvents`.
message BrowseClockEventsResponse {
  repeated ClockEvent clock_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindClockEvents`.
message FindClockEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClockEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindClockEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindClockEvents`.
message FindClockEventsResponse {
  repeated ClockEvent clock_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountClockEvents`.
message CountClockEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClockEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountClockEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountClockEvents`.
message CountClockEventsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveClockEvents`.
message ResolveClockEventsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string clock_event_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveClockEvents`.
message ResolveClockEventsResponse {
  repeated ClockEvent clock_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeClockEvents`.
message SummarizeClockEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string clock_event_id = 2;
  SummarizeClockEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeClockEvents`.
message SummarizeClockEventsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestClockEvents`.
message SuggestClockEventsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClockEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestClockEventsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestClockEvents`.
message SuggestClockEventsResponse {
  repeated ClockEvent clock_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekClockEvent`.
message PeekClockEventRequest {
  acme.common.v1.RequestContext context = 1;
  string clock_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekClockEvent`.
message PeekClockEventResponse {
  ClockEvent clock_event = 1;
  acme.common.v1.OperationResult result = 2;
}
