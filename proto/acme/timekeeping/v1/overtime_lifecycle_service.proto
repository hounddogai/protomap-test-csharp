syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "OvertimeLifecycleServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Moves an overtime between the states of its lifecycle.
service OvertimeLifecycleService {
  // Activates an overtime.
  rpc ActivateOvertime(ActivateOvertimeRequest) returns (ActivateOvertimeResponse);

  // Suspends an overtime.
  rpc SuspendOvertime(SuspendOvertimeRequest) returns (SuspendOvertimeResponse);

  // Reinstates an overtime.
  rpc ReinstateOvertime(ReinstateOvertimeRequest) returns (ReinstateOvertimeResponse);

  // Terminates an overtime.
  rpc TerminateOvertime(TerminateOvertimeRequest) returns (TerminateOvertimeResponse);

  // Renews an overtime.
  rpc RenewOvertime(RenewOvertimeRequest) returns (RenewOvertimeResponse);

  // Expires an overtime.
  rpc ExpireOvertime(ExpireOvertimeRequest) returns (ExpireOvertimeResponse);

  // Returns an overtime.
  rpc GetOvertimeLifecycle(GetOvertimeLifecycleRequest) returns (GetOvertimeLifecycleResponse);

  // Schedules an overtime.
  rpc ScheduleOvertimeExpiry(ScheduleOvertimeExpiryRequest) returns (ScheduleOvertimeExpiryResponse);
}

// The request of `ActivateOvertime`.
message ActivateOvertimeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string overtime_id = 2;
  ActivateOvertimeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateOvertime`.
message ActivateOvertimeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Overtime overtime = 1;
  ActivateOvertimeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

