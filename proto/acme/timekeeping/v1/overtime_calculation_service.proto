syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "OvertimeCalculationServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Computes the figures of an overtime, such as totals, taxes, and estimates.
service OvertimeCalculationService {
  // Calculates an overtime.
  rpc CalculateOvertime(CalculateOvertimeRequest) returns (CalculateOvertimeResponse);

  // Estimates an overtime.
  rpc EstimateOvertime(EstimateOvertimeRequest) returns (EstimateOvertimeResponse);

  // Quotes an overtime.
  rpc QuoteOvertime(QuoteOvertimeRequest) returns (QuoteOvertimeResponse);

  // Compares an overtime.
  rpc CompareOvertimeOptions(CompareOvertimeOptionsRequest) returns (CompareOvertimeOptionsResponse);

  // Recalculates an overtime.
  rpc RecalculateOvertimes(RecalculateOvertimesRequest) returns (RecalculateOvertimesResponse);

  // Simulates an overtime.
  rpc SimulateOvertime(SimulateOvertimeRequest) returns (SimulateOvertimeResponse);

  // Explains an overtime.
  rpc ExplainOvertimeCalculation(ExplainOvertimeCalculationRequest) returns (ExplainOvertimeCalculationResponse);

  // Returns an overtime.
  rpc GetOvertimeRates(GetOvertimeRatesRequest) returns (GetOvertimeRatesResponse);
}

// The request of `CalculateOvertime`.
message CalculateOvertimeRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string overtime_id = 2;
  Overtime overtime = 3;
  CalculateOvertimeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateOvertime`.
message CalculateOvertimeResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateOvertimeResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Overtime overtime = 1;
  CalculateOvertimeResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

