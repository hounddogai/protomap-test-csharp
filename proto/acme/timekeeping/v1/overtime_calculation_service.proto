    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Overtime overtime = 1;
  ExplainOvertimeCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetOvertimeRates`.
message GetOvertimeRatesRequest {
