syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "OvertimeWorkflowServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Runs the long-lived workflow that takes an overtime from start to finish.
service OvertimeWorkflowService {
  // Starts an overtime.
  rpc StartOvertimeWorkflow(StartOvertimeWorkflowRequest) returns (StartOvertimeWorkflowResponse);

  // Advances an overtime.
  rpc AdvanceOvertimeWorkflow(AdvanceOvertimeWorkflowRequest) returns (AdvanceOvertimeWorkflowResponse);

  // Cancels an overtime.
  rpc CancelOvertimeWorkflow(CancelOvertimeWorkflowRequest) returns (CancelOvertimeWorkflowResponse);

  // Retrys an overtime.
  rpc RetryOvertimeWorkflow(RetryOvertimeWorkflowRequest) returns (RetryOvertimeWorkflowResponse);

  // Pauses an overtime.
  rpc PauseOvertimeWorkflow(PauseOvertimeWorkflowRequest) returns (PauseOvertimeWorkflowResponse);

  // Resumes an overtime.
  rpc ResumeOvertimeWorkflow(ResumeOvertimeWorkflowRequest) returns (ResumeOvertimeWorkflowResponse);

  // Returns an overtime.
  rpc InspectOvertimeWorkflow(InspectOvertimeWorkflowRequest) returns (InspectOvertimeWorkflowResponse);

  // Lists overtimes a page at a time.
  rpc ListOvertimeWorkflows(ListOvertimeWorkflowsRequest) returns (ListOvertimeWorkflowsResponse);

  // Signals an overtime.
  rpc SignalOvertimeWorkflow(SignalOvertimeWorkflowRequest) returns (SignalOvertimeWorkflowResponse);
}

// The request of `StartOvertimeWorkflow`.
message StartOvertimeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string overtime_id = 2;
  Overtime overtime = 3;
  StartOvertimeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartOvertimeWorkflow`.
message StartOvertimeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Overtime overtime = 1;
  StartOvertimeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

