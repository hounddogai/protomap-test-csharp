syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "TimesheetWorkflowServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Runs the long-lived workflow that takes a timesheet from start to finish.
service TimesheetWorkflowService {
  // Starts a timesheet.
  rpc StartTimesheetWorkflow(StartTimesheetWorkflowRequest) returns (StartTimesheetWorkflowResponse);

  // Advances a timesheet.
  rpc AdvanceTimesheetWorkflow(AdvanceTimesheetWorkflowRequest) returns (AdvanceTimesheetWorkflowResponse);

  // Cancels a timesheet.
  rpc CancelTimesheetWorkflow(CancelTimesheetWorkflowRequest) returns (CancelTimesheetWorkflowResponse);

  // Retrys a timesheet.
  rpc RetryTimesheetWorkflow(RetryTimesheetWorkflowRequest) returns (RetryTimesheetWorkflowResponse);

  // Pauses a timesheet.
  rpc PauseTimesheetWorkflow(PauseTimesheetWorkflowRequest) returns (PauseTimesheetWorkflowResponse);

  // Resumes a timesheet.
  rpc ResumeTimesheetWorkflow(ResumeTimesheetWorkflowRequest) returns (ResumeTimesheetWorkflowResponse);

  // Returns a timesheet.
  rpc InspectTimesheetWorkflow(InspectTimesheetWorkflowRequest) returns (InspectTimesheetWorkflowResponse);

  // Lists timesheets a page at a time.
  rpc ListTimesheetWorkflows(ListTimesheetWorkflowsRequest) returns (ListTimesheetWorkflowsResponse);

  // Signals a timesheet.
  rpc SignalTimesheetWorkflow(SignalTimesheetWorkflowRequest) returns (SignalTimesheetWorkflowResponse);
}

// The request of `StartTimesheetWorkflow`.
message StartTimesheetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string timesheet_id = 2;
  Timesheet timesheet = 3;
  StartTimesheetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTimesheetWorkflow`.
message StartTimesheetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Timesheet timesheet = 1;
  StartTimesheetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

