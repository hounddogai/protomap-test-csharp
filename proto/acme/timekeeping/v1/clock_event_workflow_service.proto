option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "ClockEventWorkflowServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Runs the long-lived workflow that takes a clock event from start to finish.
service ClockEventWorkflowService {
  // Starts a clock event.
  rpc StartClockEventWorkflow(StartClockEventWorkflowRequest) returns (StartClockEventWorkflowResponse);

  // Advances a clock event.
  rpc AdvanceClockEventWorkflow(AdvanceClockEventWorkflowRequest) returns (AdvanceClockEventWorkflowResponse);

  // Cancels a clock event.
  rpc CancelClockEventWorkflow(CancelClockEventWorkflowRequest) returns (CancelClockEventWorkflowResponse);

  // Retrys a clock event.
  rpc RetryClockEventWorkflow(RetryClockEventWorkflowRequest) returns (RetryClockEventWorkflowResponse);

  // Pauses a clock event.
  rpc PauseClockEventWorkflow(PauseClockEventWorkflowRequest) returns (PauseClockEventWorkflowResponse);

  // Resumes a clock event.
  rpc ResumeClockEventWorkflow(ResumeClockEventWorkflowRequest) returns (ResumeClockEventWorkflowResponse);

  // Returns a clock event.
  rpc InspectClockEventWorkflow(InspectClockEventWorkflowRequest) returns (InspectClockEventWorkflowResponse);

  // Lists clock events a page at a time.
  rpc ListClockEventWorkflows(ListClockEventWorkflowsRequest) returns (ListClockEventWorkflowsResponse);

  // Signals a clock event.
  rpc SignalClockEventWorkflow(SignalClockEventWorkflowRequest) returns (SignalClockEventWorkflowResponse);
}

// The request of `StartClockEventWorkflow`.
message StartClockEventWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string clock_event_id = 2;
  ClockEvent clock_event = 3;
  StartClockEventWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartClockEventWorkflow`.
message StartClockEventWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClockEvent clock_event = 1;
  StartClockEventWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

