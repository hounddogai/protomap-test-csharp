syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "ClockEventApprovalServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Routes clock events through approval, with escalation and delegation.
service ClockEventApprovalService {
  // Submits a clock event.
  rpc SubmitClockEvent(SubmitClockEventRequest) returns (SubmitClockEventResponse);

  // Approves a clock event.
  rpc ApproveClockEvent(ApproveClockEventRequest) returns (ApproveClockEventResponse);

  // Rejects a clock event.
  rpc RejectClockEvent(RejectClockEventRequest) returns (RejectClockEventResponse);

  // Escalates a clock event.
  rpc EscalateClockEvent(EscalateClockEventRequest) returns (EscalateClockEventResponse);

  // Lists clock events a page at a time.
  rpc ListPendingClockEvents(ListPendingClockEventsRequest) returns (ListPendingClockEventsResponse);

  // Delegates a clock event.
  rpc DelegateClockEventApproval(DelegateClockEventApprovalRequest) returns (DelegateClockEventApprovalResponse);

  // Recalls a clock event.
  rpc RecallClockEvent(RecallClockEventRequest) returns (RecallClockEventResponse);

  // Returns a clock event.
  rpc GetClockEventApprovalStatus(GetClockEventApprovalStatusRequest) returns (GetClockEventApprovalStatusResponse);

  // Comments a clock event.
  rpc CommentClockEventApproval(CommentClockEventApprovalRequest) returns (CommentClockEventApprovalResponse);
}

// The request of `SubmitClockEvent`.
message SubmitClockEventRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string clock_event_id = 2;
  ClockEvent clock_event = 3;
  SubmitClockEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitClockEvent`.
message SubmitClockEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClockEvent clock_event = 1;
  SubmitClockEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

