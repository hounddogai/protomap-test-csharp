syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "TimesheetValidationServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Checks timesheets against the rules before anything acts on them.
service TimesheetValidationService {
  // Validates a timesheet.
  rpc ValidateTimesheet(ValidateTimesheetRequest) returns (ValidateTimesheetResponse);

  // Previews a timesheet.
  rpc PreviewTimesheet(PreviewTimesheetRequest) returns (PreviewTimesheetResponse);

  // Normalizes a timesheet.
  rpc NormalizeTimesheet(NormalizeTimesheetRequest) returns (NormalizeTimesheetResponse);

  // Explains a timesheet.
  rpc ExplainTimesheetDecision(ExplainTimesheetDecisionRequest) returns (ExplainTimesheetDecisionResponse);

  // Scores a timesheet.
  rpc ScoreTimesheet(ScoreTimesheetRequest) returns (ScoreTimesheetResponse);

  // Lints a timesheet.
  rpc LintTimesheets(LintTimesheetsRequest) returns (LintTimesheetsResponse);

  // Returns a timesheet.
  rpc GetTimesheetRules(GetTimesheetRulesRequest) returns (GetTimesheetRulesResponse);
}

// The request of `ValidateTimesheet`.
message ValidateTimesheetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string timesheet_id = 2;
  Timesheet timesheet = 3;
  ValidateTimesheetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTimesheet`.
message ValidateTimesheetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Timesheet timesheet = 1;
  ValidateTimesheetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

