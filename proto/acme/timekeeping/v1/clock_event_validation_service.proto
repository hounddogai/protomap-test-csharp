syntax = "proto3";

package acme.timekeeping.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/timekeeping/v1/timekeeping.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Timekeeping.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/timekeeping/v1;timekeepingv1";
option java_multiple_files = true;
option java_outer_classname = "ClockEventValidationServiceProto";
option java_package = "com.acme.timekeeping.v1";

// Checks clock events against the rules before anything acts on them.
service ClockEventValidationService {
  // Validates a clock event.
  rpc ValidateClockEvent(ValidateClockEventRequest) returns (ValidateClockEventResponse);

  // Previews a clock event.
  rpc PreviewClockEvent(PreviewClockEventRequest) returns (PreviewClockEventResponse);

  // Checks a clock event.
  rpc CheckClockEventEligibility(CheckClockEventEligibilityRequest) returns (CheckClockEventEligibilityResponse);

  // Normalizes a clock event.
  rpc NormalizeClockEvent(NormalizeClockEventRequest) returns (NormalizeClockEventResponse);

  // Explains a clock event.
  rpc ExplainClockEventDecision(ExplainClockEventDecisionRequest) returns (ExplainClockEventDecisionResponse);

  // Scores a clock event.
  rpc ScoreClockEvent(ScoreClockEventRequest) returns (ScoreClockEventResponse);

  // Lints a clock event.
  rpc LintClockEvents(LintClockEventsRequest) returns (LintClockEventsResponse);

  // Returns a clock event.
  rpc GetClockEventRules(GetClockEventRulesRequest) returns (GetClockEventRulesResponse);
}

// The request of `ValidateClockEvent`.
message ValidateClockEventRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string clock_event_id = 2;
  ClockEvent clock_event = 3;
  ValidateClockEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateClockEvent`.
message ValidateClockEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClockEvent clock_event = 1;
  ValidateClockEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

