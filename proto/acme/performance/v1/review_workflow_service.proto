syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "ReviewWorkflowServiceProto";
option java_package = "com.acme.performance.v1";

// Runs the long-lived workflow that takes a review from start to finish.
service ReviewWorkflowService {
  // Starts a review.
  rpc StartReviewWorkflow(StartReviewWorkflowRequest) returns (StartReviewWorkflowResponse);

  // Advances a review.
  rpc AdvanceReviewWorkflow(AdvanceReviewWorkflowRequest) returns (AdvanceReviewWorkflowResponse);

  // Cancels a review.
  rpc CancelReviewWorkflow(CancelReviewWorkflowRequest) returns (CancelReviewWorkflowResponse);

  // Retrys a review.
  rpc RetryReviewWorkflow(RetryReviewWorkflowRequest) returns (RetryReviewWorkflowResponse);

  // Pauses a review.
  rpc PauseReviewWorkflow(PauseReviewWorkflowRequest) returns (PauseReviewWorkflowResponse);

  // Resumes a review.
  rpc ResumeReviewWorkflow(ResumeReviewWorkflowRequest) returns (ResumeReviewWorkflowResponse);

  // Returns a review.
  rpc InspectReviewWorkflow(InspectReviewWorkflowRequest) returns (InspectReviewWorkflowResponse);

  // Lists reviews a page at a time.
  rpc ListReviewWorkflows(ListReviewWorkflowsRequest) returns (ListReviewWorkflowsResponse);

  // Signals a review.
  rpc SignalReviewWorkflow(SignalReviewWorkflowRequest) returns (SignalReviewWorkflowResponse);
}

// The request of `StartReviewWorkflow`.
message StartReviewWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string review_id = 2;
  Review review = 3;
  StartReviewWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartReviewWorkflow`.
message StartReviewWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Review review = 1;
  StartReviewWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

