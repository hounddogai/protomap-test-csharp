syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "CalibrationCalculationServiceProto";
option java_package = "com.acme.performance.v1";

// Computes the figures of a calibration, such as totals, taxes, and estimates.
service CalibrationCalculationService {
  // Calculates a calibration.
  rpc CalculateCalibration(CalculateCalibrationRequest) returns (CalculateCalibrationResponse);

  // Estimates a calibration.
  rpc EstimateCalibration(EstimateCalibrationRequest) returns (EstimateCalibrationResponse);

  // Quotes a calibration.
  rpc QuoteCalibration(QuoteCalibrationRequest) returns (QuoteCalibrationResponse);

  // Compares a calibration.
  rpc CompareCalibrationOptions(CompareCalibrationOptionsRequest) returns (CompareCalibrationOptionsResponse);

  // Recalculates a calibration.
  rpc RecalculateCalibrations(RecalculateCalibrationsRequest) returns (RecalculateCalibrationsResponse);

  // Simulates a calibration.
  rpc SimulateCalibration(SimulateCalibrationRequest) returns (SimulateCalibrationResponse);

  // Returns a calibration.
  rpc GetCalibrationRates(GetCalibrationRatesRequest) returns (GetCalibrationRatesResponse);
}

// The request of `CalculateCalibration`.
message CalculateCalibrationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string calibration_id = 2;
  Calibration calibration = 3;
  CalculateCalibrationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCalibration`.
message CalculateCalibrationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCalibrationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Calibration calibration = 1;
  CalculateCalibrationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

