syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "FeedbackApprovalServiceProto";
option java_package = "com.acme.performance.v1";

// Routes feedbacks through approval, with escalation and delegation.
service FeedbackApprovalService {
  // Submits a feedback.
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);

  // Approves a feedback.
  rpc ApproveFeedback(ApproveFeedbackRequest) returns (ApproveFeedbackResponse);

  // Rejects a feedback.
  rpc RejectFeedback(RejectFeedbackRequest) returns (RejectFeedbackResponse);

  // Escalates a feedback.
  rpc EscalateFeedback(EscalateFeedbackRequest) returns (EscalateFeedbackResponse);

  // Lists feedbacks a page at a time.
  rpc ListPendingFeedbacks(ListPendingFeedbacksRequest) returns (ListPendingFeedbacksResponse);

  // Delegates a feedback.
  rpc DelegateFeedbackApproval(DelegateFeedbackApprovalRequest) returns (DelegateFeedbackApprovalResponse);

  // Recalls a feedback.
  rpc RecallFeedback(RecallFeedbackRequest) returns (RecallFeedbackResponse);

  // Returns a feedback.
  rpc GetFeedbackApprovalStatus(GetFeedbackApprovalStatusRequest) returns (GetFeedbackApprovalStatusResponse);

  // Comments a feedback.
  rpc CommentFeedbackApproval(CommentFeedbackApprovalRequest) returns (CommentFeedbackApprovalResponse);
}

// The request of `SubmitFeedback`.
message SubmitFeedbackRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feedback_id = 2;
  Feedback feedback = 3;
  SubmitFeedbackRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFeedback`.
message SubmitFeedbackResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Feedback feedback = 1;
  SubmitFeedbackResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

