syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "FeedbackValidationServiceProto";
option java_package = "com.acme.performance.v1";

// Checks feedbacks against the rules before anything acts on them.
service FeedbackValidationService {
  // Validates a feedback.
  rpc ValidateFeedback(ValidateFeedbackRequest) returns (ValidateFeedbackResponse);

  // Previews a feedback.
  rpc PreviewFeedback(PreviewFeedbackRequest) returns (PreviewFeedbackResponse);

  // Checks a feedback.
  rpc CheckFeedbackEligibility(CheckFeedbackEligibilityRequest) returns (CheckFeedbackEligibilityResponse);

  // Normalizes a feedback.
  rpc NormalizeFeedback(NormalizeFeedbackRequest) returns (NormalizeFeedbackResponse);

  // Explains a feedback.
  rpc ExplainFeedbackDecision(ExplainFeedbackDecisionRequest) returns (ExplainFeedbackDecisionResponse);

  // Scores a feedback.
  rpc ScoreFeedback(ScoreFeedbackRequest) returns (ScoreFeedbackResponse);

  // Lints a feedback.
  rpc LintFeedbacks(LintFeedbacksRequest) returns (LintFeedbacksResponse);

  // Returns a feedback.
  rpc GetFeedbackRules(GetFeedbackRulesRequest) returns (GetFeedbackRulesResponse);
}

// The request of `ValidateFeedback`.
message ValidateFeedbackRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feedback_id = 2;
  Feedback feedback = 3;
  ValidateFeedbackRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFeedback`.
message ValidateFeedbackResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Feedback feedback = 1;
  ValidateFeedbackResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

