syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "GoalValidationServiceProto";
option java_package = "com.acme.performance.v1";

// Checks goals against the rules before anything acts on them.
service GoalValidationService {
  // Validates a goal.
  rpc ValidateGoal(ValidateGoalRequest) returns (ValidateGoalResponse);

  // Previews a goal.
  rpc PreviewGoal(PreviewGoalRequest) returns (PreviewGoalResponse);

  // Normalizes a goal.
  rpc NormalizeGoal(NormalizeGoalRequest) returns (NormalizeGoalResponse);

  // Explains a goal.
  rpc ExplainGoalDecision(ExplainGoalDecisionRequest) returns (ExplainGoalDecisionResponse);

  // Scores a goal.
  rpc ScoreGoal(ScoreGoalRequest) returns (ScoreGoalResponse);

  // Lints a goal.
  rpc LintGoals(LintGoalsRequest) returns (LintGoalsResponse);

  // Returns a goal.
  rpc GetGoalRules(GetGoalRulesRequest) returns (GetGoalRulesResponse);
}

// The request of `ValidateGoal`.
message ValidateGoalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string goal_id = 2;
  Goal goal = 3;
  ValidateGoalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGoal`.
message ValidateGoalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Goal goal = 1;
  ValidateGoalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

