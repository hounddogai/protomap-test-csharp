syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "FeedbackWorkflowServiceProto";
option java_package = "com.acme.performance.v1";

// Runs the long-lived workflow that takes a feedback from start to finish.
service FeedbackWorkflowService {
  // Starts a feedback.
  rpc StartFeedbackWorkflow(StartFeedbackWorkflowRequest) returns (StartFeedbackWorkflowResponse);

  // Advances a feedback.
  rpc AdvanceFeedbackWorkflow(AdvanceFeedbackWorkflowRequest) returns (AdvanceFeedbackWorkflowResponse);

  // Cancels a feedback.
  rpc CancelFeedbackWorkflow(CancelFeedbackWorkflowRequest) returns (CancelFeedbackWorkflowResponse);

  // Retrys a feedback.
  rpc RetryFeedbackWorkflow(RetryFeedbackWorkflowRequest) returns (RetryFeedbackWorkflowResponse);

  // Pauses a feedback.
  rpc PauseFeedbackWorkflow(PauseFeedbackWorkflowRequest) returns (PauseFeedbackWorkflowResponse);

  // Resumes a feedback.
  rpc ResumeFeedbackWorkflow(ResumeFeedbackWorkflowRequest) returns (ResumeFeedbackWorkflowResponse);

  // Returns a feedback.
  rpc InspectFeedbackWorkflow(InspectFeedbackWorkflowRequest) returns (InspectFeedbackWorkflowResponse);

  // Lists feedbacks a page at a time.
  rpc ListFeedbackWorkflows(ListFeedbackWorkflowsRequest) returns (ListFeedbackWorkflowsResponse);

  // Signals a feedback.
  rpc SignalFeedbackWorkflow(SignalFeedbackWorkflowRequest) returns (SignalFeedbackWorkflowResponse);
}

// The request of `StartFeedbackWorkflow`.
message StartFeedbackWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feedback_id = 2;
  Feedback feedback = 3;
  StartFeedbackWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFeedbackWorkflow`.
message StartFeedbackWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Feedback feedback = 1;
  StartFeedbackWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

