syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "GoalApprovalServiceProto";
option java_package = "com.acme.performance.v1";

// Routes goals through approval, with escalation and delegation.
service GoalApprovalService {
  // Submits a goal.
  rpc SubmitGoal(SubmitGoalRequest) returns (SubmitGoalResponse);

  // Approves a goal.
  rpc ApproveGoal(ApproveGoalRequest) returns (ApproveGoalResponse);

  // Rejects a goal.
  rpc RejectGoal(RejectGoalRequest) returns (RejectGoalResponse);

  // Escalates a goal.
  rpc EscalateGoal(EscalateGoalRequest) returns (EscalateGoalResponse);

  // Lists goals a page at a time.
  rpc ListPendingGoals(ListPendingGoalsRequest) returns (ListPendingGoalsResponse);

  // Delegates a goal.
  rpc DelegateGoalApproval(DelegateGoalApprovalRequest) returns (DelegateGoalApprovalResponse);

  // Recalls a goal.
  rpc RecallGoal(RecallGoalRequest) returns (RecallGoalResponse);

  // Returns a goal.
  rpc GetGoalApprovalStatus(GetGoalApprovalStatusRequest) returns (GetGoalApprovalStatusResponse);

  // Comments a goal.
  rpc CommentGoalApproval(CommentGoalApprovalRequest) returns (CommentGoalApprovalResponse);
}

// The request of `SubmitGoal`.
message SubmitGoalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string goal_id = 2;
  Goal goal = 3;
  SubmitGoalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitGoal`.
message SubmitGoalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Goal goal = 1;
  SubmitGoalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

