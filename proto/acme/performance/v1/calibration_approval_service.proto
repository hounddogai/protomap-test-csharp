syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "CalibrationApprovalServiceProto";
option java_package = "com.acme.performance.v1";

// Routes calibrations through approval, with escalation and delegation.
service CalibrationApprovalService {
  // Submits a calibration.
  rpc SubmitCalibration(SubmitCalibrationRequest) returns (SubmitCalibrationResponse);

  // Approves a calibration.
  rpc ApproveCalibration(ApproveCalibrationRequest) returns (ApproveCalibrationResponse);

  // Escalates a calibration.
  rpc EscalateCalibration(EscalateCalibrationRequest) returns (EscalateCalibrationResponse);

  // Lists calibrations a page at a time.
  rpc ListPendingCalibrations(ListPendingCalibrationsRequest) returns (ListPendingCalibrationsResponse);

  // Delegates a calibration.
  rpc DelegateCalibrationApproval(DelegateCalibrationApprovalRequest) returns (DelegateCalibrationApprovalResponse);

  // Returns a calibration.
  rpc GetCalibrationApprovalStatus(GetCalibrationApprovalStatusRequest) returns (GetCalibrationApprovalStatusResponse);

  // Comments a calibration.
  rpc CommentCalibrationApproval(CommentCalibrationApprovalRequest) returns (CommentCalibrationApprovalResponse);
}

// The request of `SubmitCalibration`.
message SubmitCalibrationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string calibration_id = 2;
  Calibration calibration = 3;
  SubmitCalibrationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCalibration`.
message SubmitCalibrationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Calibration calibration = 1;
  SubmitCalibrationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCalibration`.
message ApproveCalibrationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
