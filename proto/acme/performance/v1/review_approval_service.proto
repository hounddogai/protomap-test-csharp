syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "ReviewApprovalServiceProto";
option java_package = "com.acme.performance.v1";

// Routes reviews through approval, with escalation and delegation.
service ReviewApprovalService {
  // Submits a review.
  rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse);

  // Approves a review.
  rpc ApproveReview(ApproveReviewRequest) returns (ApproveReviewResponse);

  // Rejects a review.
  rpc RejectReview(RejectReviewRequest) returns (RejectReviewResponse);

  // Escalates a review.
  rpc EscalateReview(EscalateReviewRequest) returns (EscalateReviewResponse);

  // Lists reviews a page at a time.
  rpc ListPendingReviews(ListPendingReviewsRequest) returns (ListPendingReviewsResponse);

  // Returns a review.
  rpc GetReviewApprovalStatus(GetReviewApprovalStatusRequest) returns (GetReviewApprovalStatusResponse);

  // Comments a review.
  rpc CommentReviewApproval(CommentReviewApprovalRequest) returns (CommentReviewApprovalResponse);
}

// The request of `SubmitReview`.
message SubmitReviewRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string review_id = 2;
  Review review = 3;
  SubmitReviewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitReview`.
message SubmitReviewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Review review = 1;
  SubmitReviewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

