// The request of `ListPendingReviews`.
message ListPendingReviewsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ReviewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingReviewsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingReviews`.
message ListPendingReviewsResponse {
  repeated Review reviews = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetReviewApprovalStatus`.
message GetReviewApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string review_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetReviewApprovalStatus`.
message GetReviewApprovalStatusResponse {
  Review review = 1;
  acme.common.v1.OperationResult result = 2;
