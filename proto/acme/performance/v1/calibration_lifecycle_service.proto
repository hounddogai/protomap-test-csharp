syntax = "proto3";

package acme.performance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/performance/v1/performance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Performance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/performance/v1;performancev1";
option java_multiple_files = true;
option java_outer_classname = "CalibrationLifecycleServiceProto";
option java_package = "com.acme.performance.v1";

// Moves a calibration between the states of its lifecycle.
service CalibrationLifecycleService {
  // Activates a calibration.
  rpc ActivateCalibration(ActivateCalibrationRequest) returns (ActivateCalibrationResponse);

  // Suspends a calibration.
  rpc SuspendCalibration(SuspendCalibrationRequest) returns (SuspendCalibrationResponse);

  // Reinstates a calibration.
  rpc ReinstateCalibration(ReinstateCalibrationRequest) returns (ReinstateCalibrationResponse);

  // Terminates a calibration.
  rpc TerminateCalibration(TerminateCalibrationRequest) returns (TerminateCalibrationResponse);

  // Expires a calibration.
  rpc ExpireCalibration(ExpireCalibrationRequest) returns (ExpireCalibrationResponse);

  // Returns a calibration.
  rpc GetCalibrationLifecycle(GetCalibrationLifecycleRequest) returns (GetCalibrationLifecycleResponse);

  // Schedules a calibration.
  rpc ScheduleCalibrationExpiry(ScheduleCalibrationExpiryRequest) returns (ScheduleCalibrationExpiryResponse);
}

// The request of `ActivateCalibration`.
message ActivateCalibrationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string calibration_id = 2;
  ActivateCalibrationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCalibration`.
message ActivateCalibrationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Calibration calibration = 1;
  ActivateCalibrationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

